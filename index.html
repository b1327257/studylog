<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2233;--sub:#7a8199;--ac:#4f6bed;--bd:#e4e7f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--tx:#e8eaf3;--sub:#8b92ab;--ac:#7c93ff;--bd:#2b3042;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--tx:#e8eaf3;--sub:#8b92ab;--ac:#7c93ff;--bd:#2b3042;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:14px 14px 90px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:14px;color:var(--sub);margin:0 0 10px;font-weight:600}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.r{background:#e5484d}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin-bottom:8px}
.clock{font-size:52px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 12px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:26px;font-weight:700}.sub{color:var(--sub);font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--sub);border-radius:0;padding:14px 4px;font-size:13px}nav button.on{color:var(--ac)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;background:none;color:var(--sub);padding:8px}.seg button.on{background:var(--card);color:var(--tx)}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.chart i{width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}.chart span{font-size:10px;color:var(--sub);height:14px;white-space:nowrap}
.nv{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.nv button{padding:6px 14px}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative}.donut:after{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--card)}
.lg{display:flex;align-items:center;gap:6px;font-size:13px;margin:5px 0}.lg b{width:10px;height:10px;border-radius:3px;flex:none}.lg em{margin-left:auto;font-style:normal;color:var(--sub);white-space:nowrap}
.cv{width:44px;height:58px;border-radius:6px;position:relative;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.it:last-child{border:0}
.it>div:nth-child(2),.it>div:nth-child(1):not(.cv){min-width:0}.it>div:nth-child(2){flex:1}
.it button{padding:5px 9px;font-size:12px}.dh{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:12px 0 2px}
textarea{min-height:120px;font-size:12px}
#mini{position:fixed;top:0;left:0;right:0;z-index:5;display:none;align-items:center;gap:8px;background:var(--ac);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px}
#mini>div{flex:1;min-width:0}#mini b{display:block;font-size:12px;opacity:.9;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#mini span{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}#mini button{background:#ffffff33;padding:8px 12px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bk{text-align:center;font-size:12px;min-width:0}.bk .cv{width:100%;height:auto;aspect-ratio:3/4;font-size:34px;border-radius:8px;margin-bottom:4px}.bk b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qk{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto}.qk button{flex:none;display:flex;align-items:center;gap:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:8px 12px;max-width:70%}
.sw{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid var(--bd)}
.ring{width:92px;height:92px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--bd)}.ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}.ring span{position:relative}
.hm{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-template-columns:repeat(15,1fr);gap:3px}.hm i{aspect-ratio:1;border-radius:3px;display:block}
.st{display:flex;gap:1px;height:14px;margin:6px 0}.st i{flex:1;border-radius:2px;display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;display:none;align-items:center;gap:10px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;white-space:nowrap}#toast button{padding:4px 10px;background:var(--ac);color:#fff}
#cel{position:fixed;inset:0;z-index:30;display:none;pointer-events:none;overflow:hidden}#cel .cb{position:absolute;left:50%;top:28%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px 26px;text-align:center;box-shadow:0 8px 30px #0004;animation:pop .4s}#cel i{position:absolute;top:-30px;font-style:normal;font-size:22px;animation:fall 2.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
</style></head><body>
<div id="mini"></div><div id="v"></div><div id="toast"></div><div id="cel"></div>
<nav><button data-t="home">ホーム</button><button data-t="log">記録</button><button data-t="stat">振り返り</button><button data-t="mat">設定</button></nav>
<script>
const K='studylog2',COL=['#4f6bed','#e5484d','#22a06b','#f59f00','#9c5de4','#0ea5b7','#e8590c','#7a8199'],DW='日月火水木金土';
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{subs:[],mats:[],logs:[],goal:10,timer:null,sel:null};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab='home',mode='week',off=0,ed=null,pu=0,md={sid:'',title:'',unit:'ページ',isbn:'',cover:'',msg:'',ns:''},wl,ptxt='';
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),clk=s=>{s=Math.floor(s);return p2(s/3600|0)+':'+p2((s%3600)/60|0)+':'+p2(s%60)};
const hm=s=>{const m=Math.round(s/60);return m>=60?`${m/60|0}時間${m%60}分`:`${m}分`};
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())},tm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
const mat=id=>S.mats.find(m=>m.id==id),sub=id=>S.subs.find(s=>s.id==id);
const col=m=>{const s=m&&sub(m.sid);return s&&s.color||COL[Math.max(0,S.subs.findIndex(x=>m&&x.id==m.sid))%8]},ico=m=>{const s=m&&sub(m.sid);return s&&s.icon||'📘'};
const el=()=>{const t=S.timer;return t?t.acc+(t.at?(Date.now()-t.at)/1000:0):0};
const wk=o=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d};
const inR=(a,b)=>S.logs.filter(l=>l.t>=a&&l.t<b),sm=ls=>ls.reduce((x,l)=>x+l.sec,0);
function weekTotal(){const a=wk(0).getTime();return sm(inR(a,a+6048e5))+(S.timer?el():0)}
function todayTotal(){const d=new Date();d.setHours(0,0,0,0);return sm(inR(d.getTime(),d.getTime()+864e5))+(S.timer?el():0)}
const DG=()=>S.dgoal==null?60:S.dgoal,MN=()=>S.minDay==null?15:S.minDay;
function dayMap(){const m={};S.logs.forEach(l=>{const k=dk(l.t);m[k]=(m[k]||0)+l.sec});return m}
function streak(){const m=dayMap(),mn=Math.max(1,MN())*60,tk=dk(new Date()),ok=k=>(m[k]||0)+(S.timer&&k==tk?el():0)>=mn;let d=new Date(),n=0;if(!ok(tk))d.setDate(d.getDate()-1);while(n<4000&&ok(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function cover(m){return `<div class="cv" style="background:${col(m)}">${ico(m)}${m.cover?`<img src="${esc(m.cover)}" alt="" onerror="this.remove()">`:''}</div>`}
function opts(sel){return S.subs.map(s=>{const ms=S.mats.filter(m=>m.sid==s.id);return ms.length?`<optgroup label="${s.icon||'📘'} ${esc(s.name)}">${ms.map(m=>`<option value="${m.id}" ${m.id==sel?'selected':''}>${esc(m.title)}</option>`).join('')}</optgroup>`:''}).join('')}
const wake=()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch(e){}};
const unwake=()=>{try{wl&&wl.release();wl=null}catch(e){}};

/* タイマー */
function toggle(){const t=S.timer;if(!t){const mid=$('sel').value;if(!mid)return;S.sel=mid;S.timer={mid,acc:0,at:Date.now(),st:Date.now()};wake()}
else if(t.at){t.acc=el();t.at=null;unwake()}else{t.at=Date.now();wake()}save();render()}
function finish(){const t=S.timer,s=Math.round(el());S.timer=null;unwake();if(s>=1){ed={id:null,fin:1,mid:t.mid,t:t.st,sec:s,amt:'',focus:0,memo:''};tab='log'}save();render()}
function tick(){if($('clock'))$('clock').textContent=clk(el());if($('mclk'))$('mclk').textContent=clk(el());
if($('gp')){const w=weekTotal(),g=S.goal*3600,td=todayTotal(),dg=DG()*60,mn=Math.max(1,MN())*60,p=Math.min(100,w/g*100);
$('rg').style.background=`conic-gradient(${p>=100?'#22a06b':'var(--ac)'} ${p}%,var(--bd) 0)`;$('gt').textContent=hm(w);$('gr').textContent=Math.round(w/g*100)+'%';$('td').textContent=hm(td);
$('gp').style.width=(dg?Math.min(100,td/dg*100):0)+'%';$('dg').textContent=dg?`${hm(td)} / ${hm(dg)}`:'未設定';
$('ml').textContent=td>=mn?'✓ 今日の連続日数はキープ済み':`あと${Math.ceil((mn-td)/60)}分で今日の連続日数をキープ`}
chk()}
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();if(S.timer&&S.timer.at)wake()}});
function setGoal(v){S.goal=Math.max(.5,+v||1);save();render()}

function quick(id){S.sel=id;S.timer={mid:id,acc:0,at:Date.now(),st:Date.now()};wake();save();render()}
function recent(){const o=[];[...S.logs].sort((a,b)=>b.t-a.t).forEach(l=>{if(mat(l.mid)&&!o.includes(l.mid))o.push(l.mid)});S.mats.forEach(m=>{if(!o.includes(m.id))o.push(m.id)});return o.slice(0,3)}
function chips(){if(S.timer||!S.mats.length)return '';return `<div class="sub" style="margin-bottom:6px">ワンタップで開始（最近の教材）</div><div class="qk">${recent().map(id=>{const m=mat(id);return `<button onclick="quick(${id})"><span style="font-size:20px">${ico(m)}</span>${esc(m.title)}</button>`}).join('')}</div>`}
/* ホーム */
function vHome(){const t=S.timer,run=t&&t.at;
return `<div class="card"><h2>今週の目標</h2><div class="row" style="align-items:center;margin-bottom:10px"><div class="ring" id="rg" style="flex:none"><span id="gr">0%</span></div><div style="flex:1"><div class="big" id="gt">0分</div><div class="sub">目標 ${S.goal}時間 ／ 今日 <span id="td"></span> ／ 連続 ${streak()}日</div><div class="sub" id="ml" style="margin-top:4px"></div></div></div>
<div class="sub">今日の目標 <span id="dg"></span></div><div class="bar"><i id="gp" style="background:#f59f00"></i></div>
<div class="row" style="margin-top:10px"><div><div class="sub">週目標（時間）</div><input type="number" min="0.5" step="0.5" value="${S.goal}" onchange="setGoal(this.value)" style="margin:0"></div><div><div class="sub">1日目標（分）</div><input type="number" min="0" step="5" value="${DG()}" onchange="S.dgoal=Math.max(0,+this.value||0);save();render()" style="margin:0"></div><div><div class="sub">最低ライン（分）</div><input type="number" min="0" step="5" value="${MN()}" onchange="S.minDay=Math.max(0,+this.value||0);save();render()" style="margin:0"></div></div></div>${subWeek()}
<div class="card"><h2>ストップウォッチ</h2><div class="clock" id="clock">00:00:00</div>
${chips()}${S.mats.length?`<select id="sel" ${t?'disabled':''}>${opts(t?t.mid:S.sel)}</select>`:'<div class="sub" style="margin-bottom:10px">先に「教材」タブで教材を追加してください</div>'}
<div class="row"><button onclick="toggle()" ${S.mats.length?'':'disabled'}>${run?'一時停止':t?'再開':'スタート'}</button>${t?'<button class="r" onclick="finish()">終了して記録</button>':''}</div>
<div class="sub" style="margin-top:10px">アプリを閉じても計測は続きます（開始時刻から計算）</div></div>`}

/* 記録 */
function setT(d,t){if(t)ed.nt=0;const c=new Date(ed.t);d=d||dk(ed.t);t=t||tm(ed.t);ed.t=new Date(d+'T'+t).getTime()||ed.t}
function vForm(){const e=ed,m=mat(e.mid),pv=prevTo();
return `<div class="card"><h2>${e.id?'記録を編集':e.fin?'お疲れさま！記録を保存':'記録を追加'}</h2>
<select onchange="ed.mid=this.value;render()">${opts(e.mid)}</select>
<div class="row"><input type="date" value="${dk(e.t)}" onchange="setT(this.value,null)"><input type="time" value="${tm(e.t)}" onchange="setT(null,this.value)"></div>
<input type="number" min="0" placeholder="分" value="${Math.round(e.sec/60)}" oninput="ed.sec=+this.value*60">
<div class="sub" style="margin-bottom:4px">量（${m?m.unit:''}）</div>
<div class="row" style="align-items:center;margin-bottom:8px">${[-5,-1].map(d=>`<button class="g" style="flex:none;padding:10px" onclick="stp(${d})">${d}</button>`).join('')}<input type="number" min="0" value="${e.amt??''}" oninput="ed.amt=this.value" style="margin:0;text-align:center">${[1,5].map(d=>`<button class="g" style="flex:none;padding:10px" onclick="stp(${d})">＋${d}</button>`).join('')}</div>
<div class="row"><input type="number" placeholder="ここから${pv!=null?'（'+(pv+1)+'）':''}" value="${e.fr??''}" onchange="setFr(this.value)"><input type="number" placeholder="ここまで（位置）" value="${e.to??''}" onchange="setTo(this.value)"></div>${pv!=null?`<div class="sub" style="margin:-4px 0 8px">${pv>0?'到達済みの最大位置 '+pv+m.unit+'。':''}続きは${pv+1}${m.unit}から。復習は「ここから」を変更してください</div>`:''}
<div class="sub" style="margin-bottom:4px">集中度（任意）</div><div class="seg">${[1,2,3].map(n=>`<button class="${e.focus==n?'on':''}" onclick="ed.focus=ed.focus==${n}?0:${n};render()">${['△ いまいち','○ ふつう','◎ 集中'][n-1]}</button>`).join('')}</div>
<input placeholder="一言メモ（任意）" value="${esc(e.memo||'')}" oninput="ed.memo=this.value">
<div class="row"><button onclick="saveEd()">保存</button><button class="g" onclick="ed=null;render()">キャンセル</button></div></div>`}
function prevTo(){const m=mat(ed.mid),ls=S.logs.filter(x=>x.mid==ed.mid&&x.to!=null&&x.id!=ed.id&&x.t<=ed.t);return ls.length?Math.max(...ls.map(x=>x.to)):(m&&(m.from>1||m.total)?(m.from||1)-1:null)}
function stp(d){ed.amt=Math.max(0,(+ed.amt||0)+d);render()}
function rc(){const pv=prevTo(),fr=ed.fr!==''&&ed.fr!=null?+ed.fr:(pv!=null?pv+1:null);if(fr!=null&&ed.to!==''&&ed.to!=null)ed.amt=Math.max(0,+ed.to-fr+1)}
function setTo(v){ed.to=v;rc();render()}
function setFr(v){ed.fr=v;rc();render()}
let _u=0;const uid=()=>{_u=Math.max(_u+1,Date.now());return _u};
function resFr(e){if(e.to===''||e.to==null)return null;if(e.fr!==''&&e.fr!=null)return +e.fr;const pv=prevTo();if(pv!=null)return pv+1;if(e.amt!==''&&e.amt!=null)return +e.to-+e.amt+1;return null}
function saveEd(){const e=ed;if(!e.mid||!(e.sec>0))return;const r={id:e.id||uid(),mid:+e.mid,t:e.t,sec:Math.round(e.sec),amt:e.amt===''||e.amt==null?null:+e.amt,to:e.to===''||e.to==null?null:+e.to,fr:resFr(e),focus:e.focus||0,memo:e.memo||'',nt:e.nt||0};
const i=S.logs.findIndex(l=>l.id==r.id);if(i>=0)S.logs[i]=r;else S.logs.push(r);ed=null;save();render()}
function addNew(){ed={id:null,mid:S.sel||(S.mats[0]&&S.mats[0].id),t:Date.now(),sec:1800,amt:'',focus:0,memo:''};render()}
function tap(b,f){if(!b.dataset.c){b.dataset.c=1;b.textContent='もう一度';return}f()}
function vLog(){const ls=[...S.logs].sort((a,b)=>b.t-a.t).slice(0,120),g={};ls.forEach(l=>(g[dk(l.t)]=g[dk(l.t)]||[]).push(l));
return (ed?vForm():S.mats.length?'<button onclick="addNew()" style="width:100%;margin-bottom:12px">＋ 記録を追加</button>':'')+
`<div class="card">${ls.length?Object.entries(g).map(([d,a])=>{const dd=new Date(d.replace(/-/g,'/'));return `<div class="dh"><b>${dd.getMonth()+1}/${dd.getDate()}（${DW[dd.getDay()]}）</b><span>${hm(sm(a))}</span></div>`+a.map(l=>{const m=mat(l.mid);return `<div class="it"><div class="cv" style="width:8px;height:36px;background:${col(m)}"></div><div><b>${esc(m?m.title:'削除済み')}</b><div class="sub">${l.nt?'':tm(l.t)+'〜 '}${hm(l.sec)}${l.amt!=null?' ／ '+l.amt+(m?m.unit:'')+(l.to!=null?'（'+(l.fr!=null?l.fr:'')+'〜'+l.to+'）':''):''}${l.focus?' ／ '+['','△','○','◎'][l.focus]:''}${l.memo?'<br>'+esc(l.memo):''}</div></div><button class="g" onclick="ed={...S.logs.find(x=>x.id==${l.id})};render()">編集</button><button class="g" onclick="del(()=>{S.logs=S.logs.filter(x=>x.id!=${l.id});save();render()})">削除</button></div>`}).join('')}).join(''):'<div class="sub">まだ記録がありません</div>'}</div>`}

/* 振り返り */
function range(){let a,b,bk=[];
if(mode==='week'){a=wk(off);for(let i=0;i<7;i++)bk.push([a.getTime()+i*864e5,a.getTime()+(i+1)*864e5,'月火水木金土日'[i]]);b=new Date(a.getTime()+6048e5);const e=new Date(b-1);return{a:a.getTime(),b:b.getTime(),bk,label:`${a.getMonth()+1}/${a.getDate()}〜${e.getMonth()+1}/${e.getDate()}`}}
const n=new Date();a=new Date(n.getFullYear(),n.getMonth()+off,1);b=new Date(a.getFullYear(),a.getMonth()+1,1);const dn=(b-a)/864e5;
for(let i=0;i<dn;i++)bk.push([new Date(a.getFullYear(),a.getMonth(),i+1).getTime(),new Date(a.getFullYear(),a.getMonth(),i+2).getTime(),(i==0||(i+1)%5==0)?i+1:'']);
return{a:a.getTime(),b:b.getTime(),bk,label:`${a.getFullYear()}年${a.getMonth()+1}月`}}
function hours(ls){const h=Array(24).fill(0);ls.filter(l=>!l.nt).forEach(l=>{let c=l.t;const e=l.t+l.sec*1000;while(c<e){const d=new Date(c),n=new Date(c);n.setHours(d.getHours()+1,0,0,0);const k=Math.min(e,n.getTime())-c;h[d.getHours()]+=k/1000;c+=k}});return h}
function bars(v,lb,hi){const mx=Math.max(...v,1);return `<div class="chart">${v.map((x,i)=>`<div><i style="height:${x/mx*100}%;${x?'':'opacity:.2'}${hi===i?';background:#f59f00':''}"></i><span>${lb[i]}</span></div>`).join('')}</div>`}
function perMat(ls){const p={};ls.forEach(l=>{const o=p[l.mid]=p[l.mid]||{s:0,a:0,f:[]};o.s+=l.sec;if(l.amt!=null)o.a+=l.amt;if(l.focus)o.f.push(l.focus)});return Object.entries(p).sort((x,y)=>y[1].s-x[1].s)}
const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'-';
function vStat(){const r=range(),ls=inR(r.a,r.b),v=r.bk.map(x=>sm(inR(x[0],x[1]))),tot=sm(ls),pm=perMat(ls),H=hours(ls),hx=Math.max(...H),hi=hx>0?H.indexOf(hx):-1;let acc=0;
const gr=pm.map(([id,o])=>{const f=acc/tot*100;acc+=o.s;return `${col(mat(id))} ${f}% ${acc/tot*100}%`}).join(',');
return `<div class="card"><div class="seg"><button class="${mode==='week'?'on':''}" onclick="mode='week';off=0;ptxt='';render()">週</button><button class="${mode==='month'?'on':''}" onclick="mode='month';off=0;ptxt='';render()">月</button></div>
<div class="nv"><button class="g" onclick="off--;ptxt='';render()">‹</button><b>${r.label}</b><button class="g" onclick="off++;ptxt='';render()" ${off>=0?'disabled style="opacity:.3"':''}>›</button></div>
<div class="big">${hm(tot)}</div><div class="sub">1日平均 ${hm(tot/r.bk.length)}　連続 ${streak()}日</div>${cmpHTML(r,tot)}${bars(v,r.bk.map(x=>x[2]))}</div>
${heat()}${prog()}${fcard()}<div class="card"><h2>教材ごとの時間配分</h2>${pm.length?`<div class="row" style="align-items:center"><div class="donut" style="background:conic-gradient(${gr})"></div><div>${pm.map(([id,o])=>{const m=mat(id);return `<div class="lg"><b style="background:${col(m)}"></b>${esc(m?m.title:'削除済み')}<em>${hm(o.s)} ${Math.round(o.s/tot*100)}%</em></div>`}).join('')}</div></div>`:'<div class="sub">この期間の記録はありません</div>'}</div>
<div class="card"><h2>時間帯（開始から終了まで按分）</h2>${hi>=0?`<div><b>ゴールデンタイム: ${hi}時台</b></div>`:''}${bars(H,H.map((_,i)=>i%3==0?i:''),hi)}</div>
<div class="card"><h2>分析用プロンプト</h2><select onchange="pu=+this.value;ptxt=''" >${['週・月の振り返り','ペース見直し（遅れ・偏りの確認）','時間帯と集中度の分析','試験前の戦略（優先順位と配分）','教材の見直し（効果の比較）','やる気が落ちたときの立て直し'].map((x,i)=>`<option value="${i}" ${pu==i?'selected':''}>${x}</option>`).join('')}</select>
<button onclick="gen()" style="width:100%">この期間で作成してコピー</button>${ptxt?`<textarea id="pt" style="margin-top:8px" readonly>${esc(ptxt)}</textarea><div class="sub">コピーされない場合は、上の文章を長押しでコピーしてGeminiなどに貼ってください</div>`:''}</div>`}
function gen(){const r=range(),ls=inR(r.a,r.b),tot=sm(ls),H=hours(ls),pm=perMat(ls);
const day=r.bk.map(x=>{const s=sm(inR(x[0],x[1]));return s?`${mode=='week'?x[2]:new Date(x[0]).getDate()+'日'}:${hm(s)}`:''}).filter(Boolean).join('、')||'なし';
const hr=H.map((s,i)=>[i,s]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>`${x[0]}時台:${hm(x[1])}`).join('、')||'なし';

return `<div class="card"><h2>時間帯ごとの集中度（直近60日）</h2>${B.some(a=>a.length)?(bi>=0?`<div><b>集中しやすい時間帯：${bi*3}〜${bi*3+3}時（平均 ${bv.toFixed(1)} / 3）</b></div>`:'')+`<div class="chart">${av.map((v,i)=>`<div><i style="height:${v/3*100}%;${B[i].length<2?'opacity:.3':''}${i==bi?';background:#f59f00':''}"></i><span>${i*3}</span></div>`).join('')}</div><div class="sub">薄い帯は記録が1回だけの時間帯。集中度は記録保存時の入力です</div>`:'<div class="sub">集中度つきの記録がまだありません（記録を保存するときに入力できます）</div>'}</div>`}
let us=null,ut,ct;
function cmp(r,tot){const so=off;off=so-1;const pr=range();off=so;const cut=off===0?Math.min(pr.b,pr.a+(Date.now()-r.a)):pr.b,pv=sm(inR(pr.a,cut));return{pv,pct:pv>0?Math.round((tot-pv)/pv*100):null,lb:mode=='week'?'前週':'前月',live:off===0}}
function cmpHTML(r,tot){const c=cmp(r,tot);if(c.pct==null)return `<div class="sub">${c.lb}の記録なし</div>`;return `<div class="sub" style="font-weight:600;color:${c.pct>=0?'#22a06b':'#e5484d'}">${c.lb}${c.live?'同時点':''}比 ${c.pct>=0?'+':''}${c.pct}%（${hm(c.pv)}）</div>`}
function cmpTxt(r,t){const c=cmp(r,t);return c.pct==null?'':`、${c.lb}${c.live?'同時点':''}比${c.pct>=0?'+':''}${c.pct}%`}
function heat(){const m=dayMap(),n=new Date();n.setHours(0,0,0,0);const st=wk(-14),dg=DG()*60,mn=Math.max(1,MN())*60,tk=dk(n);let h='';
for(let i=0;i<105;i++){const d=new Date(st);d.setDate(st.getDate()+i);const k=dk(d),s=m[k]||0,o=s==0?0:s<mn?.25:s<dg*.6?.5:s<dg?.75:1;
h+=`<i style="${d>n?'visibility:hidden':`background:${o?'var(--ac)':'var(--bd)'};opacity:${o||1}`}${k==tk?';outline:2px solid var(--tx)':''}"></i>`}
return `<div class="card"><h2>学習カレンダー（15週間）</h2><div class="hm">${h}</div><div class="sub" style="margin-top:6px">濃いほど長く勉強した日（最低ライン→1日目標で段階表示）／ 縦は月〜日</div></div>`}
function subWeek(){const a=wk(0).getTime(),ls=inR(a,a+6048e5),o=S.subs.filter(s=>s.goal>0);if(!o.length)return '';
return `<div class="card"><h2>科目ごとの週目標</h2>${o.map(s=>{const c=s.color||COL[S.subs.indexOf(s)%8];let sec=sm(ls.filter(l=>{const m=mat(l.mid);return m&&m.sid==s.id}));if(S.timer){const m=mat(S.timer.mid);if(m&&m.sid==s.id)sec+=el()}
return `<div class="lg" style="margin:8px 0 2px"><b style="background:${c}"></b>${s.icon||'📘'} ${esc(s.name)}<em>${hm(sec)} / ${s.goal}時間</em></div><div class="bar" style="margin:0"><i style="width:${Math.min(100,sec/(s.goal*36))}%;background:${c}"></i></div>`}).join('')}</div>`}
function chk(){const dkn=dk(new Date()),wkk=dk(wk(0)),w=weekTotal(),td=todayTotal(),L=[];S.cel=S.cel||{};
if(S.goal&&w>=S.goal*3600&&S.cel.w!==wkk){S.cel.w=wkk;L.push(['🎉','今週の目標を達成！'])}
if(DG()&&td>=DG()*60&&S.cel.d!==dkn){S.cel.d=dkn;L.push(['✨','今日の目標を達成！'])}
const s=streak();if([7,14,30,50,100,200,365].includes(s)&&S.cel.s!==s+'|'+dkn){S.cel.s=s+'|'+dkn;L.push(['🔥',s+'日連続！'])}
if(L.length){save();celebrate(L[0][0],L.map(x=>x[1]).join('<br>'))}}
function celebrate(e,t){const c=$('cel');c.innerHTML=`<div class="cb"><div style="font-size:44px">${e}</div><b>${t}</b></div>`+Array.from({length:16},(_,i)=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*.6}s">${['🎉','✨','⭐','🎊'][i%4]}</i>`).join('');c.style.display='block';clearTimeout(ct);ct=setTimeout(()=>c.style.display='none',3500)}
function del(f){us=JSON.stringify({subs:S.subs,mats:S.mats,logs:S.logs});f();toast('削除しました','元に戻す')}
function toast(m,a){clearTimeout(ut);const t=$('toast');t.innerHTML=`${m}${a?` <button onclick="undo()">${a}</button>`:''}`;t.style.display='flex';ut=setTimeout(()=>t.style.display='none',6000)}
function undo(){if(!us)return;const o=JSON.parse(us);S.subs=o.subs;S.mats=o.mats;S.logs=o.logs;us=null;save();$('toast').style.display='none';render()}
function addSub(){const n=md.ns.trim();if(!n)return;const s={id:Date.now(),name:n,color:COL[S.subs.length%8],icon:'📘'};S.subs.push(s);md.sid=s.id;md.ns='';save();render()}
function addMat(){if(!md.title.trim()){md.msg='教材名を入力してください';render();return}
if(!md.sid){if(!S.subs.length)S.subs.push({id:Date.now(),name:'未分類'});md.sid=S.subs[0].id}
S.mats.push({id:Date.now()+1,sid:+md.sid,title:md.title.trim(),unit:md.unit,isbn:md.isbn,cover:md.cover});if(!S.sel)S.sel=S.mats[0].id;md={sid:md.sid,title:'',unit:md.unit,isbn:'',cover:'',msg:'追加しました',ns:''};save();render()}
function delMat(id){S.mats=S.mats.filter(m=>m.id!=id);S.logs=S.logs.filter(l=>l.mid!=id);if(S.timer&&S.timer.mid==id){S.timer=null;unwake()}save();render()}
async function fetchBook(){const i=md.isbn.replace(/\D/g,'');if(!i)return;md.msg='取得中…';render();
try{const j=await(await fetch('https://api.openbd.jp/v1/get?isbn='+i)).json(),b=j&&j[0];if(!b)throw 0;md.title=b.summary.title||md.title;md.cover=b.summary.cover||('https://ndlsearch.ndl.go.jp/thumbnail/'+i+'.jpg');md.msg='書誌情報を取得しました'}
catch(e){md.msg='自動取得できませんでした。教材名を入力し、写真で表紙を追加できます'}render()}
function photo(inp){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,240/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);md.cover=c.toDataURL('image/jpeg',.7);md.msg='写真を設定しました';render()};im.src=URL.createObjectURL(f)}
function bkData(){return JSON.stringify({app:'studylog',v:2,exportedAt:new Date().toISOString(),subs:S.subs,mats:S.mats,logs:S.logs,goal:S.goal,dgoal:S.dgoal,minDay:S.minDay})}
function exp(){const t=$('bk');t.value=bkData();t.select();try{document.execCommand('copy')}catch(e){}}
function expFile(){const t=$('bk');t.value=bkData();try{const b=new Blob([t.value],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='studylog-'+dk(Date.now())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){}}
async function impFile2(inp){const f=inp.files[0];if(!f)return;$('bk').value=await f.text();imp()}
function imp(){try{const o=JSON.parse($('bk').value);if(!Array.isArray(o.logs)||!Array.isArray(o.mats))throw 0;S={subs:o.subs||[],mats:o.mats,logs:o.logs,goal:o.goal||10,dgoal:o.dgoal,minDay:o.minDay,timer:null,sel:null};save();render()}catch(e){$('bk').value='読み込めませんでした。書き出したデータをそのまま貼り付けてください'}}

function render(){const sh=S.timer&&tab!=='home',mi=$('mini');if(sh){const m=mat(S.timer.mid);mi.innerHTML=`<div><b>${m?ico(m)+' '+esc(m.title):''}</b><span id="mclk">${clk(el())}</span></div><button onclick="toggle()">${S.timer.at?'⏸':'▶'}</button><button class="r" onclick="finish()">終了</button>`}mi.style.display=sh?'flex':'none';document.body.style.paddingTop=sh?'78px':'';$('v').innerHTML={home:vHome,log:vLog,stat:vStat,mat:vMat}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));tick()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
if(S.timer&&S.timer.at)wake();render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
</script></body></html>
