<style>
:root{--bg:#f2f2f7;--card:#ffffff;--surf:#f5f5f7;--tx:#1d1d1f;--sub:#86868b;--ac:#059669;--ac-soft:rgba(5,150,105,.1);--bl:#0284c7;--bl-soft:rgba(2,132,199,.12);--warn:#d97706;--warn-soft:rgba(217,119,6,.13);--err:#dc2626;--err-soft:rgba(220,38,38,.12);--bd:rgba(0,0,0,.075);--sh:0 1px 2px rgba(0,0,0,.03),0 4px 16px rgba(0,0,0,.035);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--card:#1c1c1e;--surf:#2c2c2e;--tx:#f5f5f7;--sub:#98989d;--ac:#10b981;--ac-soft:rgba(16,185,129,.16);--bl:#38bdf8;--bl-soft:rgba(56,189,248,.16);--warn:#f59e0b;--warn-soft:rgba(245,158,11,.18);--err:#ef4444;--err-soft:rgba(239,68,68,.18);--bd:rgba(255,255,255,.09);--sh:0 4px 20px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--card:#1c1c1e;--surf:#2c2c2e;--tx:#f5f5f7;--sub:#98989d;--ac:#10b981;--ac-soft:rgba(16,185,129,.16);--bl:#38bdf8;--bl-soft:rgba(56,189,248,.16);--warn:#f59e0b;--warn-soft:rgba(245,158,11,.18);--err:#ef4444;--err-soft:rgba(239,68,68,.18);--bd:rgba(255,255,255,.09);--sh:0 4px 20px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.45;display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased}
.hdr-wrap{flex:none;background:var(--bg);border-bottom:0.5px solid var(--bd);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 9px;z-index:12}
.hdr{display:flex;align-items:center;gap:9px;max-width:560px;margin:0 auto}
.brand-icon{width:30px;height:30px;background:linear-gradient(145deg,#059669,#10b981);border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 2px 6px rgba(5,150,105,.24)}
.brand-icon svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;fill:none}
.hdr-title{font-size:18px;font-weight:700;letter-spacing:-.025em}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 24px}
#v{max-width:560px;margin:0 auto}
.card{background:var(--card);border:0.5px solid var(--bd);border-radius:20px;padding:18px 16px;margin-bottom:14px;box-shadow:var(--sh)}
h2{font-size:13px;color:var(--sub);margin:0 0 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:.01em}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;transition:transform .1s ease,opacity .15s ease,background .15s ease;letter-spacing:-.01em}
button:active:not(:disabled){transform:scale(.97);opacity:.88}
button.g{background:var(--surf);color:var(--tx);border:0.5px solid var(--bd);font-weight:600}
button.r{background:var(--err);color:#fff}
button.b{background:var(--bl);color:#fff}
button:disabled{opacity:.38;cursor:default}
input,select,textarea{width:100%;padding:10px 12px;border:0.5px solid var(--bd);border-radius:11px;background:var(--surf);margin-bottom:8px;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);background:var(--card)}
.clock{font-size:54px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:2px 0 16px;letter-spacing:-.035em;line-height:1.05}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.bar{height:7px;background:var(--surf);border-radius:999px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:999px;transition:width .25s ease}
.big{font-size:27px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}.sub{color:var(--sub);font-size:12px}

/* iOS HIG準拠 5タブ下部ナビ */
nav{flex:none;display:flex;align-items:stretch;background:var(--card);border-top:0.5px solid var(--bd);padding:4px 6px calc(env(safe-area-inset-bottom,0px) + 2px);z-index:12}
nav button{flex:1;background:none;color:var(--sub);border-radius:0;padding:4px 2px 3px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;letter-spacing:.01em;position:relative}
nav button svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;fill:none;transition:transform .15s ease,stroke-width .15s ease}
nav button.on{color:var(--ac);font-weight:700}
nav button.on svg{stroke-width:2.15;transform:translateY(-0.5px)}
nav button:active{transform:none;opacity:.65}
.nav-bdg{position:absolute;top:2px;left:50%;margin-left:7px;background:var(--err);color:#fff;font-size:9.5px;font-weight:800;min-width:16px;height:16px;padding:0 4px;border-radius:999px;display:none;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;line-height:1}

.seg{display:flex;background:var(--surf);border-radius:10px;padding:2.5px;margin-bottom:12px}
.seg button{flex:1;background:none;color:var(--sub);padding:7px 6px;font-size:12.5px;border-radius:8px;font-weight:600}.seg button.on{background:var(--card);color:var(--tx);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.09),0 0.5px 1px rgba(0,0,0,.04)}
.chart{display:flex;align-items:flex-end;gap:4px;height:146px;margin-top:14px;padding-top:20px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.chart .bwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;min-height:0}
.chart .stk{width:100%;max-width:28px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 2px 2px;overflow:hidden;min-height:2px;background:var(--surf)}
.chart .stk i{display:block;width:100%}
.chart .vl{position:absolute;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:600;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1;pointer-events:none}
.chart .lb{font-size:10px;color:var(--sub);height:16px;margin-top:4px;white-space:nowrap;flex:none}
.nv{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;background:var(--surf);border-radius:11px;padding:3px}.nv button{padding:5px 14px;border-radius:8px;background:var(--card);border:0;box-shadow:0 1px 2px rgba(0,0,0,.06)}.nv b{font-size:13.5px;font-weight:600}
.donut{width:118px;height:118px;border-radius:50%;flex:none;position:relative}.donut:after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--card)}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}
.lg b{width:9px;height:9px;border-radius:3px;flex:none}
.lg .lt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.lg em{margin-left:auto;font-style:normal;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12px}
.cv{width:42px;height:56px;border-radius:6px;position:relative;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.1);border-left:3px solid rgba(0,0,0,.16)}
.cv.has-img{border-left:0;background:var(--surf)!important}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv .spine{font-size:10px;line-height:1.15;padding:3px;text-align:center;word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;opacity:.95}
.cv-btn{cursor:pointer;position:relative}
.cv-btn::after{content:"📷";position:absolute;right:3px;bottom:3px;font-size:11px;background:#000a;color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.it{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:0.5px solid var(--bd);font-size:14px}.it:last-child{border:0}
.it-body{flex:1;min-width:0}
.it .cv{width:36px;height:48px;flex:0 0 36px;border-radius:5px;font-size:12px}
.it button{padding:6px 11px;font-size:12px}.dh{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:14px 0 4px}
textarea{min-height:100px;font-size:13.5px;line-height:1.55}
#mini{flex:none;display:none;align-items:center;gap:8px;background:var(--ac);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;box-shadow:0 2px 10px rgba(0,0,0,.12);z-index:13}
#mini>div{flex:1;min-width:0}#mini b{display:block;font-size:11.5px;opacity:.9;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#mini span{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}#mini button{background:rgba(255,255,255,.22);padding:7px 12px;border-radius:10px}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bk{text-align:left;font-size:11px;min-width:0;display:flex;flex-direction:column;position:relative}
.bk.arc{opacity:.65}
.bk .cv{width:100%;height:auto;aspect-ratio:3/4;border-radius:8px;margin-bottom:5px}
.bk .cv .spine{font-size:11px;padding:6px;-webkit-line-clamp:4}
.bk b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;min-height:2.5em;font-size:11px}
.shelf-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.shelf.locked .shelf-it{cursor:default;opacity:.7}
.shelf.locked .shelf-it.on{opacity:1}
.shelf-it{background:var(--surf);border:1.5px solid transparent;border-radius:13px;padding:6px;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-width:0;transition:border-color .15s,background .15s,box-shadow .15s;position:relative}
.shelf-it.on{border-color:var(--ac);background:var(--card);box-shadow:0 2px 10px rgba(5,150,105,.12)}
.shelf-it .cv{width:100%;height:auto;aspect-ratio:3/4;margin-bottom:5px;border-radius:6px}
.shelf-it span{font-size:10.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--tx)}
.fav-pin{position:absolute;top:4px;right:4px;z-index:2;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.42);color:rgba(255,255,255,.75);border:0;padding:0;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}
.fav-pin.on{color:#fbbf24;background:rgba(0,0,0,.58)}
.arc-tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:4px;background:var(--surf);color:var(--sub);font-weight:600;vertical-align:middle}
.sw{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid transparent;flex:none}
.sw.on{border-color:var(--tx);transform:scale(1.1)}
.ring{width:84px;height:84px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--surf)}.ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}.ring span{position:relative;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;text-align:center;background:var(--surf);border-radius:14px;padding:11px 6px}
.kpis b{display:block;font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px;font-weight:700;letter-spacing:-.02em}
.hm{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-template-columns:repeat(15,1fr);gap:3px}.hm i{aspect-ratio:1;border-radius:3.5px;display:block}
.st{display:flex;gap:1.5px;height:10px;margin:6px 0}.st i{flex:1;border-radius:2px;display:block}
.mlist{margin-top:12px;border-top:0.5px solid var(--bd);padding-top:8px}
.mitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--bd)}
.mitem:last-child{border:0}
.mitem .cv{width:32px;height:42px;flex:0 0 32px;font-size:11px;border-radius:4px}
.mitem-main{flex:1;min-width:0}
.mitem-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.mitem-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mitem-top span{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.mitem-bar{height:5px;background:var(--surf);border-radius:999px;overflow:hidden;margin:4px 0}
.mitem-bar i{display:block;height:100%;border-radius:999px}
.mitem-sub{font-size:11px;color:var(--sub)}
.mo-list{margin-top:12px;border-top:0.5px solid var(--bd);padding-top:8px}
.mo-row{display:flex;align-items:center;gap:10px;padding:8px 8px;border-bottom:0.5px solid var(--bd);cursor:pointer;border-radius:10px;transition:background .12s}
.mo-row:last-child{border:0}
.mo-row.on{background:var(--surf)}
.mo-lbl{width:84px;flex:none;font-size:12px;font-weight:600}
.mo-bar{flex:1;height:7px;background:var(--surf);border-radius:999px;overflow:hidden}
.mo-bar i{display:block;height:100%;background:var(--ac);border-radius:999px}
.mo-val{width:80px;flex:none;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

/* ホームの今日の復習ランチャー */
.srs-home-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.srs-home-cnt{font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.srs-home-cnt small{font-size:12.5px;font-weight:600;color:var(--sub);margin-left:3px}
.srs-pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surf);color:var(--sub)}
.srs-pill.over{background:var(--err-soft);color:var(--err)}
.srs-pill.ok{background:var(--ac-soft);color:var(--ac)}
.srs-pill.bl{background:var(--bl-soft);color:var(--bl)}
.srs-pill.wn{background:var(--warn-soft);color:var(--warn)}

/* 分散学習（SRS）画面 */
.srs-hero{text-align:center;padding:6px 0 2px}
.srs-big{font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums;margin:4px 0 10px}
.srs-big small{font-size:18px;font-weight:700;color:var(--sub);margin-left:3px}
.srs-start{width:100%;padding:14px 16px;font-size:16px;font-weight:700;border-radius:14px;background:linear-gradient(135deg,#059669,#0284c7);color:#fff;box-shadow:0 6px 18px rgba(5,150,105,.24);margin-top:12px}
.srs-start:disabled{background:var(--surf);color:var(--sub);box-shadow:none;opacity:1}
.srs-curve-box{background:var(--surf);border:0.5px solid var(--bd);border-radius:14px;padding:10px 10px 6px;margin-bottom:10px}
.srs-fc{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.srs-fc-d{background:var(--surf);border:0.5px solid var(--bd);border-radius:10px;padding:6px 2px;text-align:center}
.srs-fc-d.tod{background:var(--ac-soft);border-color:var(--ac)}
.srs-fc-d span{display:block;font-size:10px;color:var(--sub);font-weight:600}
.srs-fc-d.tod span,.srs-fc-d.tod b{color:var(--ac)}
.srs-fc-d b{font-size:14px;font-variant-numeric:tabular-nums}
.srs-donut-row{display:flex;align-items:center;gap:16px}
.srs-dwrap{position:relative;width:112px;height:112px;flex:none}
.srs-dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.srs-dc b{font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.srs-dc span{font-size:9.5px;color:var(--sub);font-weight:600;margin-top:2px}
.srs-draft{background:var(--card);border:0.5px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.srs-side{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px}
.srs-side.over{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.srs-mbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:2px}
.srs-mbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 4px;border-radius:10px;background:var(--card);border:0.5px solid var(--bd);color:var(--tx);font-size:11.5px;font-weight:600;cursor:pointer;text-align:center}
.srs-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.srs-thumbs:empty{display:none}
.srs-th{position:relative;aspect-ratio:4/3;border-radius:9px;overflow:hidden;border:0.5px solid var(--bd);background:#111}
.srs-th img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.srs-th-x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;padding:0;background:rgba(0,0,0,.72);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.srs-th-kb{position:absolute;bottom:3px;left:4px;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.68);color:#fff}
.srs-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.srs-tagbtn{padding:6px 12px;border-radius:999px;background:var(--surf);color:var(--sub);border:0.5px solid var(--bd);font-size:12px;font-weight:600}
.srs-tagbtn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.srs-li{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:0.5px solid var(--bd);cursor:pointer}
.srs-li:last-child{border:0}
.srs-li-img{width:54px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--surf);border:0.5px solid var(--bd)}
.srs-li-no{width:54px;height:44px;border-radius:8px;flex:none;background:var(--surf);border:0.5px dashed var(--bd);color:var(--sub);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}
.srs-li-b{flex:1;min-width:0}
.srs-li-t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* 全画面復習オーバーレイ */
#srsRev{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#srsRev.on{display:flex}
.rev-top{flex:none;background:var(--card);border-bottom:0.5px solid var(--bd);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 10px;display:flex;align-items:center;gap:8px}
.rev-prog{flex:1;height:6px;background:var(--surf);border-radius:999px;overflow:hidden}
.rev-prog i{display:block;height:100%;background:var(--ac);transition:width .2s}
.rev-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;max-width:620px;width:100%;margin:0 auto}
.rev-txt{font-size:16.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
.rev-imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.rev-imgs:empty{display:none}
.rev-imgw{background:var(--surf);border:0.5px solid var(--bd);border-radius:12px;overflow:hidden;text-align:center}
.rev-imgw img{max-width:100%;max-height:380px;display:block;margin:0 auto;cursor:zoom-in}
.rev-foot{flex:none;background:var(--card);border-top:0.5px solid var(--bd);padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
.rev-foot-in{max-width:620px;margin:0 auto}
.rev-rates{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
@media(max-width:460px){.rev-rates{grid-template-columns:repeat(2,1fr)}}
.rev-rb{padding:10px 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent}
.rev-rb b{font-size:13.5px}
.rev-rb span{font-size:10.5px;opacity:.88}
.rev-rb.r1{background:var(--err-soft);color:var(--err);border-color:rgba(220,38,38,.3)}
.rev-rb.r2{background:var(--warn-soft);color:var(--warn);border-color:rgba(217,119,6,.3)}
.rev-rb.r3{background:var(--bl-soft);color:var(--bl);border-color:rgba(2,132,199,.3)}
.rev-rb.r4{background:var(--ac-soft);color:var(--ac);border-color:rgba(5,150,105,.3)}

/* 画像マスク（Image Occlusion） */
.occ-stage{position:relative;width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--bd);background:#111;touch-action:none;user-select:none;-webkit-user-select:none}
.occ-stage img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.occ-box{position:absolute;border-radius:4px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;line-height:1;transition:background .18s,border-color .18s,opacity .18s}
.occ-box.ed{background:rgba(245,158,11,.78);border:2px solid #d97706;color:#fff;cursor:pointer}
.occ-box.ed.sel{background:rgba(220,38,38,.82);border:2px solid #fff;box-shadow:0 0 0 2px #dc2626}
.occ-box.draw{background:rgba(5,150,105,.42);border:2px dashed #10b981;pointer-events:none}
.occ-box.tgt{background:#f59e0b;border:2px solid #fff;color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.5);cursor:pointer;font-size:13px}
.occ-box.oth{background:#475569;border:1.5px solid rgba(255,255,255,.35);color:transparent}
.occ-box.rev-tgt{background:rgba(16,185,129,.12);border:2.5px solid #10b981;color:transparent;box-shadow:0 0 0 2px rgba(16,185,129,.28)}
.occ-box.rev-oth{background:rgba(71,85,105,.82);border:1px solid rgba(255,255,255,.25);color:transparent}
.occ-box.rev-oth.peek{background:rgba(71,85,105,.08);border:1px dashed rgba(148,163,184,.55)}

/* ライトボックス */
#srsLb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:none;flex-direction:column}
#srsLb.on{display:flex}
.lb-top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.lb-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:12px}
.lb-stage img{max-width:100%;max-height:100%;transition:transform .15s}

/* 時間帯ブロック（6区分横バー） */
.tz-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tz-row{display:flex;align-items:center;gap:10px}
.tz-lbl{width:96px;flex:none;font-size:12px;font-weight:600;display:flex;align-items:baseline;gap:4px}
.tz-lbl small{font-size:10px;color:var(--sub);font-weight:500;font-variant-numeric:tabular-nums}
.tz-bar{flex:1;height:10px;background:var(--surf);border:0.5px solid var(--bd);border-radius:999px;overflow:hidden}
.tz-bar i{display:block;height:100%;border-radius:999px;background:var(--ac)}
.tz-bar.top i{background:#f59e0b}
.tz-val{width:82px;flex:none;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tz-val small{font-weight:500;color:var(--sub);margin-left:3px}

/* 振り返り：日（週内24時間タイムライン）＆ 週（7週リズム＆スタック） */
.tl-wrap{margin-top:14px;border-top:0.5px solid var(--bd);padding-top:10px}
.tl-axis{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.tl-axis-lbl{width:52px;flex:none}
.tl-axis-ticks{flex:1;position:relative;height:14px}
.tl-axis-ticks span{position:absolute;transform:translateX(-50%);top:0;white-space:nowrap}
.tl-axis-val{width:56px;flex:none;text-align:right}
.tl-row{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:10px;cursor:pointer;transition:background .12s;margin-bottom:2px}
.tl-row.on{background:var(--surf);box-shadow:inset 0 0 0 1.5px var(--ac)}
.tl-day{width:52px;flex:none;font-size:12px;font-weight:700;display:flex;align-items:baseline;gap:3px;font-variant-numeric:tabular-nums}
.tl-day small{font-size:10.5px;color:var(--sub);font-weight:600}
.tl-day.tod{color:var(--ac)}
.tl-day.tod small{color:var(--ac)}
.tl-track{flex:1;height:20px;background:var(--surf);border:0.5px solid var(--bd);border-radius:6px;position:relative;overflow:hidden}
.tl-row.on .tl-track{background:var(--card)}
.tl-grid{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:repeat(4,1fr)}
.tl-grid i{border-right:1px dashed var(--bd);opacity:.65}
.tl-grid i:last-child{border-right:0}
.tl-seg{position:absolute;top:2px;bottom:2px;border-radius:3px;min-width:2px}
.tl-sum{width:56px;flex:none;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tl-detail{margin-top:10px;background:var(--surf);border-radius:13px;padding:12px;border:0.5px solid var(--bd)}
.tl-d-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;font-weight:700}
.tl-log{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--bd);font-size:12.5px}
.tl-log:last-child{border-bottom:0}
.tl-log-tm{width:84px;flex:none;color:var(--sub);font-variant-numeric:tabular-nums;font-size:11.5px}

.wk-wrap{margin-top:14px;border-top:0.5px solid var(--bd);padding-top:10px}
.wk-row{padding:8px 8px;border-radius:11px;cursor:pointer;transition:background .12s;margin-bottom:4px;border:1px solid transparent}
.wk-row.on{background:var(--surf);border-color:var(--ac)}
.wk-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:12.5px}
.wk-lbl{font-weight:700;font-variant-numeric:tabular-nums}
.wk-Meta{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.wk-dots{display:inline-flex;gap:3px;align-items:center}
.wk-dots i{width:13px;height:13px;border-radius:3px;font-style:normal;font-size:8.5px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:var(--surf);color:var(--sub)}
.wk-dots i.on{background:var(--ac);color:#fff}
.wk-bar{height:10px;background:var(--surf);border-radius:6px;overflow:hidden;display:flex;position:relative}
.wk-row.on .wk-bar{background:var(--card)}
.wk-bar i{display:block;height:100%}

/* モーダル共通 */
.mod-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.mod-bg.on{display:flex}
.mod-box{background:var(--card);border:0.5px solid var(--bd);border-radius:20px;padding:16px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;box-shadow:0 12px 34px rgba(0,0,0,.32)}

#cfm{position:fixed;inset:0;z-index:80;background:#0006;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
#cfm .cm-box{background:var(--card);border:0.5px solid var(--bd);border-radius:18px;padding:18px;width:100%;max-width:360px;box-shadow:0 10px 30px #0004}
#cfm .cm-t{font-size:15px;font-weight:700;margin-bottom:6px}
#cfm .cm-m{font-size:13px;color:var(--sub);line-height:1.5;margin-bottom:14px}

<script>
const K='studylog2',DB_NAME='StudyLogDB',DB_STORE='state';
const SRS_DB_NAME='SpacedRepetitionCertExamDB',SRS_UNTAG='未分類',SRS_MAX_IMG=3,SRS_IMG_DIM=1600,SRS_IMG_Q=0.88;
const COL=['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#06b6d4','#f97316','#6366f1','#14b8a6'],DW='日月火水木金土';
let S={subs:[],mats:[],logs:[],goal:14,dgoal:60,minDay:15,timer:null,sel:null,cel:{},pet:{claimedLv:0,viewLv:0},tmrFavOnly:true},dbRef=null,srsDbRef=null,photoTarget=null;
let tab='home',srsSubTab='due',mode='day',off=0,selBucket=null,ed=null,pu=0,md={sid:'',title:'',unit:'ページ',cover:'',color:'',fav:false,msg:'',ns:''},wl,ptxt='',pe=null,es=null,us=null,ut,ct,fmat='all',showAddMat=false,showArcMat=false,showArcProg=false,cfmFn=null;
let petLine='',petAnim=false,petTmr=null,bubVisible=true,bubHideTmr=null;

function srsNewDraft(){return{id:'d_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6),frontText:'',backText:'',frontImages:[],backImages:[]}}
let SRS={cards:[],tags:[],media:{},dueOrder:'shuffle',curveMode:'sawtooth',initTiming:'today',selTag:'',regMode:'normal',occ:{img:'',rects:[],sel:-1,title:'',memo:''},drafts:[srsNewDraft()],activeDraft:0,q:'',fTag:'all',fStat:'all',sort:'nextReviewAsc',editId:null,editFImgs:[],editBImgs:[],queue:[],idx:0,hist:[],ansShown:false,peekAll:false,batchLimit:0,batchDone:0,batchPause:false,sessionStart:null,sessionCount:0};

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),clk=s=>{s=Math.floor(s);return p2(s/3600|0)+':'+p2((s%3600)/60|0)+':'+p2(s%60)};
const hm=s=>{const m=Math.round(s/60);return m>=60?`${m/60|0}時間${m%60?m%60+'分':''}`:`${m}分`};
const hmFull=s=>{const m=Math.round(s/60);return m>=60?`${m/60|0}時間${p2(m%60)}分`:`${m}分`};
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())},tm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
const mat=id=>S.mats.find(m=>m.id==id),sub=id=>S.subs.find(s=>s.id==id);
const activeMats=()=>S.mats.filter(m=>!m.arc);
const favMats=()=>S.mats.filter(m=>!m.arc&&m.fav);
const arcMats=()=>S.mats.filter(m=>m.arc);

function sortedActiveIds(onlyFav=false){
  const pool=onlyFav?favMats():activeMats();
  const poolIds=new Set(pool.map(m=>m.id));
  const recent=[];
  [...S.logs].sort((a,b)=>b.t-a.t).forEach(l=>{if(poolIds.has(l.mid)&&!recent.includes(l.mid))recent.push(l.mid)});
  pool.forEach(m=>{if(!recent.includes(m.id))recent.push(m.id)});
  const favs=recent.filter(id=>{const m=mat(id);return m&&m.fav});
  const rest=recent.filter(id=>{const m=mat(id);return m&&!m.fav});
  return [...favs,...rest];
}
function ensureValidSel(){
  if(S.timer&&mat(S.timer.mid)){S.sel=S.timer.mid;return S.sel}
  const cur=mat(S.sel);
  const favIds=sortedActiveIds(true);
  const allIds=sortedActiveIds(false);
  if(S.tmrFavOnly&&favIds.length){
    if(!cur||cur.arc||!cur.fav)S.sel=favIds[0];
  }else if(allIds.length){
    if(!cur||cur.arc)S.sel=allIds[0];
  }else{
    S.sel=S.mats[0]?S.mats[0].id:null;
  }
  return S.sel;
}

const col=m=>{if(!m)return COL[0];if(m.color)return m.color;const idx=S.mats.findIndex(x=>x.id==m.id);return COL[(idx>=0?idx:0)%COL.length]};
const scol=s=>{if(!s)return COL[0];if(s.color)return s.color;const idx=S.subs.findIndex(x=>x.id==s.id);return COL[(idx>=0?idx:0)%COL.length]};
const ico=m=>{const s=m&&sub(m.sid);return s&&s.icon||'📘'};
const el=()=>{const t=S.timer;return t?t.acc+(t.at?(Date.now()-t.at)/1000:0):0};
const wk=o=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d};
const inR=(a,b)=>S.logs.filter(l=>l.t>=a&&l.t<b),sm=ls=>ls.reduce((x,l)=>x+l.sec,0);

/* IndexedDB: StudyLogDB & SpacedRepetitionCertExamDB（既存データそのまま完全互換） */
function openDB(){
  return new Promise(resolve=>{
    try{
      if(!window.indexedDB){resolve(null);return}
      const req=indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};
      req.onsuccess=e=>resolve(e.target.result);
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null)}
  });
}
function openSrsDB(){
  return new Promise(resolve=>{
    try{
      if(!window.indexedDB){resolve(null);return}
      const req=indexedDB.open(SRS_DB_NAME,2);
      req.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains('cards')){
          const st=db.createObjectStore('cards',{keyPath:'id'});
          st.createIndex('nextReviewDate','nextReviewDate',{unique:false});
          st.createIndex('tag','tag',{unique:false});
        }
        if(!db.objectStoreNames.contains('settings'))db.createObjectStore('settings',{keyPath:'key'});
        if(!db.objectStoreNames.contains('media'))db.createObjectStore('media',{keyPath:'id'});
      };
      req.onsuccess=e=>resolve(e.target.result);
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null)}
  });
}
function srsDbGetAllMedia(){
  return new Promise(res=>{
    if(!srsDbRef||!srsDbRef.objectStoreNames.contains('media')){res({});return}
    try{
      const rq=srsDbRef.transaction('media','readonly').objectStore('media').getAll();
      rq.onsuccess=()=>{const m={};(rq.result||[]).forEach(x=>{if(x&&x.id)m[x.id]=x.dataUrl});res(m)};
      rq.onerror=()=>res({});
    }catch(e){res({})}
  });
}
function srsDbPutMedia(id,dataUrl){
  SRS.media[id]=dataUrl;
  if(!srsDbRef||!srsDbRef.objectStoreNames.contains('media'))return Promise.resolve();
  return new Promise(res=>{
    try{const tx=srsDbRef.transaction('media','readwrite');tx.objectStore('media').put({id,dataUrl});tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}
  });
}
function srsDbDelMedia(id){
  delete SRS.media[id];
  if(!srsDbRef||!srsDbRef.objectStoreNames.contains('media'))return Promise.resolve();
  return new Promise(res=>{
    try{const tx=srsDbRef.transaction('media','readwrite');tx.objectStore('media').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}
  });
}
function srsDbClearMedia(){
  SRS.media={};
  if(!srsDbRef||!srsDbRef.objectStoreNames.contains('media'))return Promise.resolve();
  return new Promise(res=>{
    try{const tx=srsDbRef.transaction('media','readwrite');tx.objectStore('media').clear();tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}
  });
}
function srsDbGetAll(){
  return new Promise(res=>{
    if(!srsDbRef){res([]);return}
    try{
      const rq=srsDbRef.transaction('cards','readonly').objectStore('cards').getAll();
      rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>res([]);
    }catch(e){res([])}

/* =========================================================
 * 分散学習（SRS）コア：4時切替日付・4段階SM-2・べき乗忘却曲線
 * ========================================================= */
function srsPureDate(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function srsToday(dObj){const d=dObj?new Date(dObj.getTime()):new Date();d.setHours(d.getHours()-4);return srsPureDate(d)}
function srsAddDays(ds,n){const p=ds.split('-');const d=new Date(+p[0],+p[1]-1,+p[2],12,0,0);d.setDate(d.getDate()+Number(n));return srsPureDate(d)}
function srsDiffDays(a,b){const pa=a.split('-'),pb=b.split('-');return Math.round((new Date(+pa[0],+pa[1]-1,+pa[2])-new Date(+pb[0],+pb[1]-1,+pb[2]))/864e5)}
function srsGenId(){return 'card_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9)}

function srsCalcSched(card,grade,todayStr,applyFuzz){
  const prevRep=Number(card.repetition||0),prevIv=Number(card.interval||0),prevEF=Number(card.efactor||2.5);
  const lapsedToday=Boolean(card.lapsedTodayDate&&card.lapsedTodayDate===todayStr);
  const savedPre=Number(card.preLapseInterval||0);
  const overdue=(card.nextReviewDate&&todayStr&&card.nextReviewDate<todayStr)?Math.max(0,srsDiffDays(todayStr,card.nextReviewDate)):0;
  let newRep=prevRep,newIv=0,newEF=prevEF,nextPre=savedPre,nextLapsed=card.lapsedTodayDate||null;
  if(grade===1){
    newEF=Math.max(1.3,prevEF-0.20);
    if(prevIv>=10)nextPre=prevIv;
    nextLapsed=todayStr;newRep=0;newIv=0;
  }else if(lapsedToday){
    if(grade===2)newEF=Math.max(1.3,prevEF-0.10);
    else if(grade===4)newEF=Math.min(3.0,prevEF+0.05);
    if(savedPre>=10){
      const ratio=grade===2?0.20:grade===3?0.25:0.30;
      newIv=Math.max(2,Math.round(savedPre*ratio));
    }else newIv=1;
    newRep=1;nextPre=0;
  }else if(grade===2){
    newEF=Math.max(1.3,prevEF-0.15);
    newIv=prevRep===0?1:prevRep===1?Math.max(3,prevIv+1):Math.max(prevIv+1,Math.round(prevIv*1.2));
    newRep=prevRep+1;nextPre=0;
  }else if(grade===3){
    if(prevRep===0)newIv=3;
    else if(prevRep===1){const bonus=overdue>0?Math.round((prevIv+overdue*0.5)*newEF):6;newIv=Math.max(6,bonus)}
    else newIv=Math.max(prevIv+1,Math.round((prevIv+overdue*0.5)*newEF));
    newRep=prevRep+1;nextPre=0;
  }else{
    newEF=Math.min(3.0,prevEF+0.15);
    if(prevRep===0)newIv=4;
    else if(prevRep===1){const bonus=overdue>0?Math.round((prevIv+overdue)*newEF*1.3):10;newIv=Math.max(10,bonus)}
    else newIv=Math.max(prevIv+2,Math.round((prevIv+overdue)*newEF*1.3));
    newRep=prevRep+1;nextPre=0;
  }
  newEF=Math.round(newEF*100)/100;
  if(applyFuzz&&grade!==1&&newIv>=3){
    const d=newIv<7?1:Math.max(1,Math.min(7,Math.round(newIv*0.1)));
    const minIv=Math.max(2,grade>=3&&prevIv>=2?prevIv+1:2);
    const fuzz=Math.floor(Math.random()*(d*2+1))-d;
    newIv=Math.max(minIv,newIv+fuzz);
  }
  if(newIv>365)newIv=365;
  return{repetition:newRep,interval:newIv,efactor:newEF,nextReviewDate:grade===1?todayStr:srsAddDays(todayStr,newIv),lastScore:grade,lastReviewedAt:new Date().toISOString(),preLapseInterval:nextPre,lapsedTodayDate:nextLapsed};
}
function srsDueCards(todayStr){
  return SRS.cards.filter(c=>c.nextReviewDate<=todayStr).sort((a,b)=>{
    const aT=Boolean(a.lastReviewedAt&&srsToday(new Date(a.lastReviewedAt))===todayStr);
    const bT=Boolean(b.lastReviewedAt&&srsToday(new Date(b.lastReviewedAt))===todayStr);
    if(aT!==bT)return aT?1:-1;
    if(aT&&bT)return (a.lastReviewedAt||'')<(b.lastReviewedAt||'')?-1:1;
    if(a.nextReviewDate!==b.nextReviewDate)return a.nextReviewDate<b.nextReviewDate?-1:1;
    return (a.createdAt||'')<(b.createdAt||'')?-1:1;
  });
}
function srsOrderQueue(arr,ord){
  const t=srsToday(),fresh=[],retest=[];
  arr.forEach(c=>{(c.lastReviewedAt&&srsToday(new Date(c.lastReviewedAt))===t?retest:fresh).push(c)});
  if(ord==='shuffle'){for(let i=fresh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fresh[i],fresh[j]]=[fresh[j],fresh[i]]}}
  else if(ord==='efAsc')fresh.sort((a,b)=>(a.efactor||2.5)-(b.efactor||2.5)||(a.interval||0)-(b.interval||0));
  else fresh.sort((a,b)=>((a.nextReviewDate||'')<(b.nextReviewDate||'')?-1:1));
  retest.sort((a,b)=>((a.lastReviewedAt||'')<(b.lastReviewedAt||'')?-1:1));
  return [...fresh,...retest];
}
function srsPowerR(elD,sD){return Math.pow(1+0.5625*(Math.max(0,+elD||0)/Math.max(0.8,+sD||1)),-0.5)}
function srsStabEl(card,todayStr){
  const isLapsed=(card.lastScore===1||(Number(card.interval||0)===0&&Boolean(card.lastReviewedAt)));
  const s=isLapsed?0.5:Math.max(1,Number(card.interval||0)||1);
  let elapsed=0;
  if(card.lastReviewedAt)elapsed=Math.max(0,srsDiffDays(todayStr,srsToday(new Date(card.lastReviewedAt))));
  else if(card.nextReviewDate)elapsed=Math.max(0,s-srsDiffDays(card.nextReviewDate,todayStr));
  return{s,elapsed,isLapsed};
}
function srsEstR(card,todayStr){
  const info=srsStabEl(card,todayStr);
  if(info.isLapsed&&card.lastReviewedAt)return Math.max(0.05,Math.min(0.75,0.48*srsPowerR(info.elapsed,0.5)));
  return Math.max(0.05,Math.min(1,srsPowerR(info.elapsed,info.s)));
}
function srsKb(u){if(!u)return 0;const b=u.length-(u.indexOf(',')+1);return Math.max(1,Math.round(b*3/4/1024))}
function srsCompressImg(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>SRS_IMG_DIM||h>SRS_IMG_DIM){if(w>=h){h=Math.round(h*SRS_IMG_DIM/w);w=SRS_IMG_DIM}else{w=Math.round(w*SRS_IMG_DIM/h);h=SRS_IMG_DIM}}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',SRS_IMG_Q));
      };
      img.onerror=()=>reject();img.src=e.target.result;
    };
    r.onerror=()=>reject();r.readAsDataURL(file);
  });
}

/* SRS SVG曲線生成 */
function srsMainCurveSVG(todayStr){
  const x0=34,x1=316,yTop=16,yBot=126,w=x1-x0,h=yBot-yTop,maxD=30;
  const y80=(yBot-0.8*h).toFixed(1),y50=(yBot-0.5*h).toFixed(1);
  let sv=`<rect x="${x0}" y="${yTop}" width="${w}" height="${(0.2*h).toFixed(1)}" fill="var(--ac-soft)" opacity=".45"/>`;
  sv+=`<line x1="${x0}" y1="${yTop}" x2="${x1}" y2="${yTop}" stroke="var(--bd)" stroke-width="1"/>`;
  sv+=`<line x1="${x0}" y1="${y80}" x2="${x1}" y2="${y80}" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  sv+=`<line x1="${x0}" y1="${y50}" x2="${x1}" y2="${y50}" stroke="var(--bd)" stroke-width="1"/>`;
  sv+=`<line x1="${x0}" y1="${yBot}" x2="${x1}" y2="${yBot}" stroke="var(--bd)" stroke-width="1"/>`;
  sv+=`<text x="2" y="${yTop+4}" font-size="9" font-weight="700" fill="var(--sub)">100%</text>`;
  sv+=`<text x="4" y="${+y80+3}" font-size="9" font-weight="800" fill="var(--warn)">80%</text>`;
  sv+=`<text x="6" y="${+y50+3}" font-size="9" font-weight="700" fill="var(--sub)">50%</text>`;
  sv+=`<text x="12" y="${yBot+3}" font-size="9" font-weight="700" fill="var(--sub)">0%</text>`;
  [0,3,10,21,30].forEach(dv=>{
    const gx=(x0+dv/maxD*w).toFixed(1);
    sv+=`<line x1="${gx}" y1="${yTop}" x2="${gx}" y2="${yBot}" stroke="var(--bd)" stroke-width=".7"/>`;
    sv+=`<text x="${gx}" y="${yBot+14}" font-size="9" font-weight="700" fill="var(--sub)" text-anchor="middle">${dv}日</text>`;
  });
  if(SRS.curveMode==='sawtooth'){
    const nr=[];for(let d=0;d<=maxD;d+=.5){nr.push((d===0?'M ':'L ')+(x0+d/maxD*w).toFixed(1)+' '+(yBot-srsPowerR(d,2)*h).toFixed(1))}
    sv+=`<path d="${nr.join(' ')}" fill="none" stroke="var(--sub)" stroke-width="1.4" stroke-dasharray="3 3" opacity=".55"/>`;
    const stages=[{a:0,b:2,s:2},{a:2,b:8,s:6},{a:8,b:21,s:13},{a:21,b:30,s:38}];
    const sp=[];
    stages.forEach((st,idx)=>{
      const sx=(x0+st.a/maxD*w).toFixed(1);
      sp.push((idx===0?'M ':'L ')+sx+' '+yTop.toFixed(1));
      for(let dt=.25;dt<=st.b-st.a+.001;dt+=.25){
        const cd=Math.min(st.b,st.a+dt);
        sp.push('L '+(x0+cd/maxD*w).toFixed(1)+' '+(yBot-srsPowerR(cd-st.a,st.s)*h).toFixed(1));
      }
    });
    sv+=`<path d="${sp.join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
    const sc=[0,0,0,0];SRS.cards.forEach(c=>{const r=+c.repetition||0;sc[r<=0?0:r===1?1:r===2?2:3]++});
    const offs=[0,20,14,14];
    stages.forEach((st,idx)=>{
      const px=x0+st.a/maxD*w;
      if(idx>0)sv+=`<circle cx="${px.toFixed(1)}" cy="${y80}" r="3.2" fill="var(--warn)" stroke="var(--card)" stroke-width="1.2"/>`;
      const bx=Math.min(x1-16,Math.max(x0+6,px+offs[idx]));
      sv+=`<rect x="${(bx-15).toFixed(1)}" y="${yTop-11}" width="30" height="14" rx="7" fill="var(--card)" stroke="var(--bd)" stroke-width="1"/>`;
      sv+=`<text x="${bx.toFixed(1)}" y="${yTop-1}" font-size="8.5" font-weight="800" fill="var(--tx)" text-anchor="middle">${sc[idx]}枚</text>`;
    });
    SRS.cards.slice(0,36).forEach(c=>{
      const r=+c.repetition||0,st=stages[r<=0?0:r===1?1:r===2?2:3],info=srsStabEl(c,todayStr),rn=srsEstR(c,todayStr);
      const pd=Math.min(maxD,st.a+Math.min(1.2,info.elapsed/info.s)*(st.b-st.a));
      const dc=(c.nextReviewDate<=todayStr||rn<=0.8)?'var(--err)':'var(--ac)';
      sv+=`<circle cx="${(x0+pd/maxD*w).toFixed(1)}" cy="${(yBot-rn*h).toFixed(1)}" r="3" fill="${dc}" stroke="var(--card)" stroke-width="1"/>`;
    });
  }else{
    const src=SRS.cards.length?SRS.cards:[{interval:2,nextReviewDate:todayStr,repetition:0,efactor:2.5}];
    const p1=[],p2=[];
    for(let d=0;d<=maxD;d+=.5){
      let s1=0,s2=0;
      src.forEach(c=>{
        const info=srsStabEl(c,todayStr);
        s1+=srsPowerR(info.elapsed+d,info.s);
        if(c.nextReviewDate&&c.nextReviewDate<=todayStr){const nx=srsCalcSched(c,3,todayStr);s2+=srsPowerR(d,Math.max(3,nx.interval||3))}
        else s2+=srsPowerR(info.elapsed+d,info.s);
      });
      const px=(x0+d/maxD*w).toFixed(1);
      p1.push((d===0?'M ':'L ')+px+' '+(yBot-(s1/src.length)*h).toFixed(1));
      p2.push((d===0?'M ':'L ')+px+' '+(yBot-(s2/src.length)*h).toFixed(1));
    }
    sv+=`<path d="${p1.join(' ')}" fill="none" stroke="var(--warn)" stroke-width="2.2" stroke-linecap="round"/>`;
    sv+=`<path d="${p2.join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 328 150" width="100%" height="150" style="display:block;overflow:visible">${sv}</svg>`;
}

function srsMiniCurveHTML(card){
  const todayStr=srsToday(),info=srsStabEl(card,todayStr),rNow=srsEstR(card,todayStr);
  const hist=Array.isArray(card.reviewHistory)?card.reviewHistory.slice():[];
  const createdDate=card.createdAt?srsToday(new Date(card.createdAt)):null;
  if(!hist.length&&card.lastReviewedAt)hist.push({date:srsToday(new Date(card.lastReviewedAt)),grade:card.lastScore||(card.interval>0?3:1),interval:card.interval||1});
  if(!hist.length&&createdDate)hist.push({date:createdDate,grade:3,interval:1});
  else if(hist.length&&createdDate&&createdDate<hist[0].date&&!hist[0].isInitial)hist.unshift({date:createdDate,grade:3,interval:1,isInitial:true});
  let cursor=0,segs=[];
  hist.forEach((h,i)=>{
    const nx=hist[i+1],span=nx?Math.max(.5,srsDiffDays(nx.date,h.date)):Math.max(0,srsDiffDays(todayStr,h.date));
    segs.push({a:cursor,b:cursor+span,s:(h.grade===1||!h.interval)?.5:Math.max(1,+h.interval),pk:h.grade===1?.48:1});
    cursor+=span;
  });
  const fut=info.isLapsed?3:Math.max(4,Math.round(info.s*1.4)),hor=Math.max(7,Math.min(180,Math.ceil(cursor+fut)));
  const x0=30,x1=308,yTop=10,yBot=72,w=x1-x0,h=yBot-yTop,y80=(yBot-.8*h).toFixed(1);
  let past=[],future=[],boost=[];
  segs.forEach((sg,idx)=>{
    past.push((idx===0?'M ':'L ')+(x0+sg.a/hor*w).toFixed(1)+' '+(yBot-sg.pk*h).toFixed(1));
    if(sg.b>sg.a){for(let k=1;k<=12;k++){const dt=k/12*(sg.b-sg.a);past.push('L '+(x0+(sg.a+dt)/hor*w).toFixed(1)+' '+(yBot-sg.pk*srsPowerR(dt,sg.s)*h).toFixed(1))}}
  });
  const curBase=cursor-info.elapsed,nxGood=srsCalcSched(card,3,todayStr),bS=Math.max(1,nxGood.interval||3);
  for(let f=0;f<=28;f++){
    const dt=f/28*(hor-cursor),d=cursor+dt;
    const r=info.isLapsed?(rNow*srsPowerR(dt,.5)):srsPowerR(Math.max(0,d-curBase),info.s);
    const px=(x0+d/hor*w).toFixed(1);
    future.push((f===0?'M ':'L ')+px+' '+(yBot-r*h).toFixed(1));
    boost.push((f===0?'M ':'L ')+px+' '+(yBot-srsPowerR(dt,bS)*h).toFixed(1));
  }
  const cx=(x0+Math.min(1,cursor/hor)*w).toFixed(1),cy=(yBot-rNow*h).toFixed(1),dc=(info.isLapsed||rNow<=.8)?'var(--err)':'var(--bl)';
  const lbl=info.isLapsed?`再確認待ち・保持率 ${Math.round(rNow*100)}%`:`現在保持率 ${Math.round(rNow*100)}%（反復 ${card.repetition||0}回 / S=${info.s}日）`;
  return `<div class="srs-curve-box" style="margin-top:12px;margin-bottom:0">
    <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:4px"><span>記憶推移（緑点線＝今回◯後の予測）</span><span style="color:${dc}">${lbl}</span></div>
    <svg viewBox="0 0 320 88" width="100%" height="88" style="display:block;overflow:visible">
      <rect x="${x0}" y="${yTop}" width="${w}" height="${(.2*h).toFixed(1)}" fill="var(--ac-soft)" opacity=".45"/>
      <line x1="${x0}" y1="${yTop}" x2="${x1}" y2="${yTop}" stroke="var(--bd)" stroke-width="1"/>
      <line x1="${x0}" y1="${y80}" x2="${x1}" y2="${y80}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="${x0}" y1="${yBot}" x2="${x1}" y2="${yBot}" stroke="var(--bd)" stroke-width="1"/>
      <text x="2" y="${yTop+4}" font-size="8.5" fill="var(--sub)">100%</text><text x="4" y="${+y80+3}" font-size="8.5" font-weight="700" fill="var(--warn)">80%</text><text x="10" y="${yBot+3}" font-size="8.5" fill="var(--sub)">0%</text>
      <text x="${x0}" y="${yBot+12}" font-size="8.5" fill="var(--sub)">0日</text><text x="${x1}" y="${yBot+12}" font-size="8.5" fill="var(--sub)" text-anchor="end">${hor}日</text>
      ${past.length>1?`<path d="${past.join(' ')}" fill="none" stroke="var(--bl)" stroke-width="2" stroke-linecap="round"/>`:''}
      <path d="${future.join(' ')}" fill="none" stroke="${dc}" stroke-width="2" stroke-linecap="round"/>
      <path d="${boost.join(' ')}" fill="none" stroke="var(--ac)" stroke-width="1.8" stroke-dasharray="3 3" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="4" fill="${dc}" stroke="var(--card)" stroke-width="1.4"/>
    </svg></div>`;
}

/* 画像マスク描画＆保存ロジック */
function occPickImg(files){
  const f=files&&[...files].find(x=>x&&x.type&&x.type.startsWith('image/'));if(!f)return;
  srsCompressImg(f).then(u=>{SRS.occ.img=u;SRS.occ.rects=[];SRS.occ.sel=-1;render();toast('画像を読み込みました')}).catch(()=>toast('画像の処理に失敗しました'));
}
function occDropImg(e){e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files)occPickImg(e.dataTransfer.files)}
async function occClipPaste(){
  if(navigator.clipboard&&navigator.clipboard.read){
    try{
      const items=await navigator.clipboard.read();
      for(const it of items){const t=it.types.find(x=>x.startsWith('image/'));if(t){occPickImg([await it.getType(t)]);return}}
      toast('クリップボードに画像がありません');return;
    }catch(_){}
  }
  toast('画像を選択するか、キーボードでペーストしてください');
}
function occUndo(){if(SRS.occ.rects.length){SRS.occ.rects.pop();SRS.occ.sel=-1;render()}}
function occDelSel(){if(SRS.occ.sel>=0){SRS.occ.rects.splice(SRS.occ.sel,1);SRS.occ.sel=-1;render()}}
function occClearRects(){SRS.occ.rects=[];SRS.occ.sel=-1;render()}
function occBindStage(){
  const stg=$('occStg');if(!stg)return;
  let dragging=false,sx=0,sy=0,moved=false;
  const dragEl=$('occDrag');
  const pos=e=>{const r=stg.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}};
  stg.onpointerdown=e=>{
    const hit=e.target.closest('.occ-box.ed');
    if(hit){
      const idx=+hit.dataset.oi;
      SRS.occ.sel=(SRS.occ.sel===idx)?-1:idx;
      render();return;
    }
    e.preventDefault();stg.setPointerCapture(e.pointerId);
    const p=pos(e);sx=p.x;sy=p.y;dragging=true;moved=false;
    if(dragEl){dragEl.style.display='block';dragEl.style.left=(sx*100)+'%';dragEl.style.top=(sy*100)+'%';dragEl.style.width='0%';dragEl.style.height='0%'}
  };
  stg.onpointermove=e=>{
    if(!dragging)return;
    const p=pos(e),x=Math.min(sx,p.x),y=Math.min(sy,p.y),w=Math.abs(p.x-sx),h=Math.abs(p.y-sy);
    if(w>0.015||h>0.015)moved=true;
    if(dragEl){dragEl.style.left=(x*100)+'%';dragEl.style.top=(y*100)+'%';dragEl.style.width=(w*100)+'%';dragEl.style.height=(h*100)+'%'}
  };
  const end=e=>{
    if(!dragging)return;dragging=false;
    if(dragEl)dragEl.style.display='none';
    const p=pos(e),x=Math.min(sx,p.x),y=Math.min(sy,p.y),w=Math.abs(p.x-sx),h=Math.abs(p.y-sy);
    if(moved&&w>=0.025&&h>=0.02){
      SRS.occ.rects.push({x:+x.toFixed(4),y:+y.toFixed(4),w:+w.toFixed(4),h:+h.toFixed(4)});
      SRS.occ.sel=-1;render();
    }
  };
  stg.onpointerup=end;stg.onpointercancel=end;
}
async function occSaveCards(){
  const o=SRS.occ;
  if(!o.img||!o.rects.length){toast('画像とマスクを追加してください');return}
  const imgId='img_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
  await srsDbPutMedia(imgId,o.img);
  const tg=SRS.selTag||SRS_UNTAG,t=srsToday(),initD=SRS.initTiming==='today'?t:srsAddDays(t,1);
  const rectsCopy=o.rects.map(r=>({x:r.x,y:r.y,w:r.w,h:r.h}));
  const ft=(o.title||'').trim(),bt=(o.memo||'').trim();
  for(let idx=0;idx<rectsCopy.length;idx++){
    const card={id:srsGenId(),tag:tg,frontText:ft,frontImages:[],backText:bt,backImages:[],occlusion:{imgId,rects:rectsCopy,target:idx},createdAt:new Date().toISOString(),nextReviewDate:initD,interval:0,repetition:0,efactor:2.5,lastScore:null};
    SRS.cards.push(card);await srsDbPut(card);
  }
  const n=rectsCopy.length;
  SRS.occ={img:'',rects:[],sel:-1,title:'',memo:''};
  toast(`画像マスクから ${n}枚のカードを作成しました`);
  render();
}

    }).join('')}
  </div>`;
}

function srsPushImgs(files,arr,onDone){
  const list=[...files].filter(f=>f&&f.type&&f.type.startsWith('image/'));
  if(!list.length)return;
  const rem=SRS_MAX_IMG-arr.length;
  if(rem<=0){toast(`画像は片面最大${SRS_MAX_IMG}枚までです`);return}
  Promise.all(list.slice(0,rem).map(srsCompressImg)).then(urls=>{
    urls.forEach(u=>arr.push(u));onDone();toast('画像を追加しました');
  }).catch(()=>toast('画像の処理に失敗しました'));
}
function srsPickImgs(files,i,side){const d=SRS.drafts[i];if(!d)return;srsPushImgs(files,side==='f'?d.frontImages:d.backImages,()=>render())}
function srsDropImg(e,i,side,el){e.preventDefault();el.classList.remove('over');if(e.dataTransfer&&e.dataTransfer.files)srsPickImgs(e.dataTransfer.files,i,side)}
function srsPasteEvt(e,i,side){
  const cd=e.clipboardData||window.clipboardData;if(!cd)return;
  const fs=[];
  if(cd.items)for(const it of cd.items){if(it.kind==='file'&&it.type.startsWith('image/')){const f=it.getAsFile();if(f)fs.push(f)}}
  if(!fs.length&&cd.files)for(const f of cd.files){if(f.type.startsWith('image/'))fs.push(f)}
  if(fs.length){
    let hasTxt=false;try{hasTxt=Boolean(cd.getData('text/plain').trim())}catch(_){}
    if(!hasTxt)e.preventDefault();
    if(i==='edit')srsPushImgs(fs,side==='f'?SRS.editFImgs:SRS.editBImgs,()=>srsRenderEditModal());
    else srsPickImgs(fs,i,side);
  }
}
async function srsClipPaste(i,side){
  if(navigator.clipboard&&navigator.clipboard.read){
    try{
      const items=await navigator.clipboard.read(),blobs=[];
      for(const it of items){const t=it.types.find(x=>x.startsWith('image/'));if(t)blobs.push(await it.getType(t))}
      if(!blobs.length){toast('クリップボードに画像がありません');return}
      if(i==='edit')srsPushImgs(blobs,side==='f'?SRS.editFImgs:SRS.editBImgs,()=>srsRenderEditModal());
      else srsPickImgs(blobs,i,side);
      return;
    }catch(_){}
  }
  const ta=$(i==='edit'?(side==='f'?'se_ft':'se_bt'):`sd_${i}_${side}`);
  if(ta)ta.focus();
  toast('テキスト欄でペーストしてください');
}

async function srsSpreadOverdue(days){

  const over=SRS.cards.filter(c=>c.nextReviewDate<t).sort((a,b)=>(a.efactor||2.5)-(b.efactor||2.5)||(a.interval||0)-(b.interval||0));
  if(!over.length)return;
  for(let i=0;i<over.length;i++){
    const dayOff=Math.floor(i*days/over.length);

async function srsRate(g){
  const c=SRS.queue[SRS.idx];if(!c)return;
  const t=srsToday(),tmr=srsAddDays(t,1);
  const buried=[];
  if(c.occlusion&&c.occlusion.imgId){
    const imgId=c.occlusion.imgId;
    for(const other of SRS.cards){
      if(other.id!==c.id&&other.occlusion&&other.occlusion.imgId===imgId&&other.nextReviewDate<=t){
        buried.push({id:other.id,prevDate:other.nextReviewDate});
        other.nextReviewDate=tmr;
        await srsDbPut(other);
      }
    }
    if(buried.length){
      const bIds=new Set(buried.map(x=>x.id));
      const head=SRS.queue.slice(0,SRS.idx+1);
      const tail=SRS.queue.slice(SRS.idx+1).filter(x=>!bIds.has(x.id));
      SRS.queue=head.concat(tail);
    }
  }
  SRS.hist.push({idx:SRS.idx,snap:JSON.parse(JSON.stringify(c)),req:g===1,buried,batchDone:SRS.batchDone});
  if(g===1)SRS.queue.push(c);
  const prevLastAt=c.lastReviewedAt,prevScore=c.lastScore,prevIv=c.interval,prevRep=c.repetition,prevEf=c.efactor;
  const u=srsCalcSched(c,g,t,true);
  if(!Array.isArray(c.reviewHistory))c.reviewHistory=[];
  if(!c.reviewHistory.length){
    const cDate=c.createdAt?srsToday(new Date(c.createdAt)):null;
    const pDate=prevLastAt?srsToday(new Date(prevLastAt)):null;
    if(cDate&&(!pDate||cDate<pDate)&&cDate<t){
      c.reviewHistory.push({date:cDate,timestamp:c.createdAt,grade:3,interval:1,repetition:0,efactor:2.5,isInitial:true});
    }
    if(pDate&&pDate<t){
      c.reviewHistory.push({date:pDate,timestamp:prevLastAt,grade:prevScore||(prevIv>0?3:1),interval:prevIv||1,repetition:prevRep||0,efactor:prevEf||2.5});
    }
  }
  if(!c.firstLearnedDate)c.firstLearnedDate=(c.reviewHistory.length?c.reviewHistory[0].date:t);
  Object.assign(c,u);
  c.reviewHistory.push({date:t,timestamp:u.lastReviewedAt,grade:g,interval:u.interval,repetition:u.repetition,efactor:u.efactor});
  if(c.reviewHistory.length>20)c.reviewHistory=c.reviewHistory.slice(-20);
  await srsDbPut(c);
  SRS.sessionCount++;
  SRS.idx++;SRS.ansShown=false;SRS.peekAll=false;
  if(SRS.batchLimit>0&&SRS.idx<SRS.queue.length){
    SRS.batchDone++;
    if(SRS.batchDone>=SRS.batchLimit)SRS.batchPause=true;
  }
  srsRenderRev();
}
async function srsUndoRev(){
  if(!SRS.hist.length)return;
  const h=SRS.hist.pop();
  if(h.req&&SRS.queue.length>h.idx+1)SRS.queue.pop();
  if(Array.isArray(h.buried)&&h.buried.length){
    for(const b of h.buried){
      const o=SRS.cards.find(x=>x.id===b.id);
      if(o){o.nextReviewDate=b.prevDate;await srsDbPut(o);SRS.queue.push(o)}
    }
  }
  const c=SRS.cards.find(x=>x.id===h.snap.id);
  if(c)Object.assign(c,h.snap);
  for(let i=0;i<SRS.queue.length;i++)if(SRS.queue[i].id===h.snap.id)SRS.queue[i]=c||h.snap;
  await srsDbPut(c||h.snap);
  SRS.idx=h.idx;SRS.ansShown=false;SRS.peekAll=false;SRS.batchPause=false;if(typeof h.batchDone==='number')SRS.batchDone=h.batchDone;SRS.sessionCount=Math.max(0,SRS.sessionCount-1);
  srsRenderRev();
}

  normal:{ico:'',label:''},
  snow:{ico:'❄️',label:'雪の焚き火',rareId:'ermine'},
  fullmoon:{ico:'🌕',label:'満月の焚き火',rareId:'fawn'},

function rollCampWeather(){
  const r=Math.random();
  if(r<0.05)return 'snow';
  if(r<0.10)return 'fullmoon';
  if(r<0.15)return 'firefly';
  return 'normal';
}
const CAMP_SPOTS=[[10,37],[60,42],[69,44],[19,43],[82,32],[56,37],[75,41],[14,47],[64,48],[35,38],[85,45],[6,45]];
function campMultForMin(m){return m>=90?5:m>=60?3.5:m>=30?2:1}
function pickCampSpecies(m,weather){
  const tbl=m>=90?[['bird',12],['squirrel',15],['rabbit',20],['fox',28],['owl',25]]
    :m>=60?[['bird',20],['squirrel',20],['rabbit',25],['fox',25],['owl',10]]
    :m>=30?[['bird',30],['squirrel',30],['rabbit',30],['fox',10]]
    :[['bird',60],['squirrel',40]];
  const wi=CAMP_WEATHER_INFO[weather];
  if(m>=60&&wi&&wi.rareId){
    tbl.push([wi.rareId,m>=90?32:18]);
  }
  let r=Math.random()*tbl.reduce((a,x)=>a+x[1],0);
  for(const [id,w] of tbl){r-=w;if(r<=0)return id}
  return tbl[0][0];
}
function rollCampGuests(t,sec){
  if(!t||!t.camp)return [];
  if(!Array.isArray(t.guests))t.guests=[];
  const curMin=Math.floor(sec/60);
  let lastM=Number(t.lastRollMin)||0;
  if(curMin<=lastM)return [];
  const arrived=[],wi=CAMP_WEATHER_INFO[t.weather||'normal'];
  for(let m=lastM+1;m<=curMin;m++){
    if(t.guests.length>=CAMP_SPOTS.length)break;
    const mult=campMultForMin(m);
    const p=Math.min(0.32,0.035*mult);
    const rareGuarantee=(m===90&&wi&&wi.rareId&&!t.guests.some(g=>g.id===wi.rareId));
    const guarantee=(m===30&&t.guests.length<1)||(m===60&&t.guests.length<3)||(m===90&&t.guests.length<5)||rareGuarantee;
    if(guarantee||Math.random()<p){
      const sp=rareGuarantee?wi.rareId:pickCampSpecies(m,t.weather||'normal');
      const used=new Set(t.guests.map(g=>g.spot));
      let spot=0;while(used.has(spot)&&spot<CAMP_SPOTS.length-1)spot++;
      const g={id:sp,spot,m};
      t.guests.push(g);
      arrived.push(g);
    }
  }
  t.lastRollMin=curMin;
  if(arrived.length)save();
  return arrived;
}

async function applySrsImport(cards,tags,overwrite,media){
  if(overwrite){await srsDbClear();await srsDbClearMedia();SRS.cards=[];SRS.tags=[]}
  if(media&&typeof media==='object'){for(const [mid,u] of Object.entries(media))await srsDbPutMedia(mid,u)}
  (tags||[]).forEach(t=>{if(t&&t!==SRS_UNTAG&&!SRS.tags.includes(t))SRS.tags.push(t)});
  for(const c of (cards||[])){
    if(!c.id)c.id=srsGenId();
    if(c.tag&&c.tag!==SRS_UNTAG&&!SRS.tags.includes(c.tag))SRS.tags.push(c.tag);
    const ix=SRS.cards.findIndex(x=>x.id===c.id);
    if(ix>=0)SRS.cards[ix]=c;else SRS.cards.push(c);
    await srsDbPut(c);
  }
  await srsDbSetSet('tags',SRS.tags);
}

      unwake();
      S={subs:o.subs||[],mats:o.mats,logs:o.logs,goal:o.goal||14,dgoal:o.dgoal??60,minDay:o.minDay??15,cel:o.cel||{},pet:o.pet||null,homeOrder:o.homeOrder||null,tmrFavOnly:o.tmrFavOnly??true,timer:null,sel:o.mats[0]?o.mats[0].id:null};
      ensureColors();save();toast('勉強ログを復元しました');render();return;
    }
    if(Array.isArray(o.cards)){
      await applySrsImport(o.cards,o.tags||[],false,o.media);
      toast(`分散学習カード ${o.cards.length}件を取り込みました`);render();return;
    }
    throw 0;
  }catch(e){toast('データの形式が正しくありません')}
}

/* 全体レンダリング＆ショートカット */
function updateSrsBadge(){
  const n=srsDueCards(srsToday()).length,elB=$('navSrsBdg');
  if(!elB)return;
  elB.textContent=n>99?'99+':String(n);
  elB.style.display=n>0?'inline-flex':'none';
}
function render(){
  const sh=S.timer&&tab!=='home',mi=$('mini');
  if(sh){const m=mat(S.timer.mid);mi.innerHTML=`<div><b>${m?esc(m.title):''}</b><span id="mclk">${clk(el())}</span></div><button onclick="toggle()">${S.timer.at?'⏸':'▶'}</button><button class="r" onclick="finish()">終了</button>`}
  mi.style.display=sh?'flex':'none';
  if($('hdrw'))$('hdrw').style.display=sh?'none':'block';
  $('v').innerHTML={home:vHome,srs:vSrs,log:vLog,stat:vStat,mat:vMat}[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  updateSrsBadge();
  tick();
  if($('rm_pet'))roomStart();else{clearTimeout(roomTmr);cancelAnimationFrame(bubRaf)}
  if($('occStg'))occBindStage();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  const prev=tab;tab=b.dataset.t;
  if(tab!=='log')ed=null;
  if(tab!=='srs'||prev==='srs')srsSubTab='due';
  if(tab==='home'&&prev!=='home')showBubble(4500);
  if(tab==='stat'&&!inR(range().a,range().b).length)jumpLatest();
  render();
  if($('main'))$('main').scrollTo(0,0);
});
document.addEventListener('keydown',e=>{
  if($('srsLb').classList.contains('on')){if(e.key==='Escape')srsCloseLb();return}
  if($('srsRev').classList.contains('on')){
    if(e.key==='Escape'){srsExitRev();return}
    if(SRS.batchPause)return;
    if(!SRS.ansShown&&(e.key===' '||e.key==='Enter')){e.preventDefault();SRS.ansShown=true;srsRenderRev()}
    else if(SRS.ansShown&&e.key>='1'&&e.key<='4'){e.preventDefault();srsRate(+e.key)}
    else if((e.key==='Backspace'||e.key==='z'||e.key==='Z')&&SRS.hist.length){e.preventDefault();srsUndoRev()}
  }
});
document.addEventListener('paste',e=>{
  if(tab==='srs'&&srsSubTab==='reg'&&SRS.regMode==='occ'){
    const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
    const cd=e.clipboardData||window.clipboardData;if(!cd)return;
    const fs=[];if(cd.items)for(const it of cd.items)if(it.kind==='file'&&it.type.startsWith('image/')){const f=it.getAsFile();if(f)fs.push(f)}
    if(fs.length){e.preventDefault();occPickImg(fs)}
  }
});
initStorage();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
</script></body></html>
