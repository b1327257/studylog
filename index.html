<style>
:root{--bg:#f2f2f7;--card:#ffffff;--surf:#f5f5f7;--tx:#1d1d1f;--sub:#86868b;--ac:#059669;--ac-soft:rgba(5,150,105,.1);--bd:rgba(0,0,0,.07);--sh:0 1px 2px rgba(0,0,0,.03),0 4px 16px rgba(0,0,0,.035);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--card:#1c1c1e;--surf:#2c2c2e;--tx:#f5f5f7;--sub:#98989d;--ac:#10b981;--ac-soft:rgba(16,185,129,.16);--bd:rgba(255,255,255,.09);--sh:0 4px 20px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--card:#1c1c1e;--surf:#2c2c2e;--tx:#f5f5f7;--sub:#98989d;--ac:#10b981;--ac-soft:rgba(16,185,129,.16);--bd:rgba(255,255,255,.09);--sh:0 4px 20px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.45;display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased}
.hdr-wrap{flex:none;background:var(--bg);border-bottom:0.5px solid var(--bd);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 9px;z-index:12}
.hdr{display:flex;align-items:center;gap:9px;max-width:560px;margin:0 auto}
.brand-icon{width:30px;height:30px;background:linear-gradient(145deg,#059669,#10b981);border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 2px 6px rgba(5,150,105,.24)}
.brand-icon svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;fill:none}
.hdr-title{font-size:18px;font-weight:700;letter-spacing:-.025em}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 24px}
#v{max-width:560px;margin:0 auto}
.card{background:var(--card);border:0.5px solid var(--bd);border-radius:20px;padding:18px 16px;margin-bottom:14px;box-shadow:var(--sh)}
h2{font-size:13px;color:var(--sub);margin:0 0 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:.01em}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;transition:transform .1s ease,opacity .15s ease,background .15s ease;letter-spacing:-.01em}
button:active:not(:disabled){transform:scale(.97);opacity:.88}
button.g{background:var(--surf);color:var(--tx);border:0.5px solid var(--bd);font-weight:600}
button.r{background:#ef4444;color:#fff}
button:disabled{opacity:.38;cursor:default}
input,select,textarea{width:100%;padding:10px 12px;border:0.5px solid var(--bd);border-radius:11px;background:var(--surf);margin-bottom:8px;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);background:var(--card)}
.clock{font-size:54px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:2px 0 16px;letter-spacing:-.035em;line-height:1.05}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.bar{height:7px;background:var(--surf);border-radius:999px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:999px;transition:width .25s ease}
.big{font-size:27px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}.sub{color:var(--sub);font-size:12px}

/* iOS HIG準拠のミニマル・アイコン付きタブバー（高さ49px＋セーフエリア） */
nav{flex:none;display:flex;align-items:stretch;background:var(--card);border-top:0.5px solid var(--bd);padding:4px 8px calc(env(safe-area-inset-bottom,0px) + 2px);z-index:12}
nav button{flex:1;background:none;color:var(--sub);border-radius:0;padding:4px 2px 3px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;letter-spacing:.01em}
nav button svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;fill:none;transition:transform .15s ease,stroke-width .15s ease}
nav button.on{color:var(--ac);font-weight:700}
nav button.on svg{stroke-width:2.15;transform:translateY(-0.5px)}
nav button:active{transform:none;opacity:.65}

.seg{display:flex;background:var(--surf);border-radius:10px;padding:2.5px;margin-bottom:12px}
.seg button{flex:1;background:none;color:var(--sub);padding:7px 6px;font-size:12.5px;border-radius:8px;font-weight:600}.seg button.on{background:var(--card);color:var(--tx);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.09),0 0.5px 1px rgba(0,0,0,.04)}
.chart{display:flex;align-items:flex-end;gap:4px;height:146px;margin-top:14px;padding-top:20px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.chart .bwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;min-height:0}
.chart .stk{width:100%;max-width:28px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 2px 2px;overflow:hidden;min-height:2px;background:var(--surf)}
.chart .stk i{display:block;width:100%}
.chart .vl{position:absolute;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:600;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1;pointer-events:none}
.chart .lb{font-size:10px;color:var(--sub);height:16px;margin-top:4px;white-space:nowrap;flex:none}
.nv{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;background:var(--surf);border-radius:11px;padding:3px}.nv button{padding:5px 14px;border-radius:8px;background:var(--card);border:0;box-shadow:0 1px 2px rgba(0,0,0,.06)}.nv b{font-size:13.5px;font-weight:600}
.donut{width:118px;height:118px;border-radius:50%;flex:none;position:relative}.donut:after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--card)}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}
.lg b{width:9px;height:9px;border-radius:3px;flex:none}
.lg .lt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.lg em{margin-left:auto;font-style:normal;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12px}
.cv{width:42px;height:56px;border-radius:6px;position:relative;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.1);border-left:3px solid rgba(0,0,0,.16)}
.cv.has-img{border-left:0;background:var(--surf)!important}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv .spine{font-size:10px;line-height:1.15;padding:3px;text-align:center;word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;opacity:.95}
.cv-btn{cursor:pointer;position:relative}
.cv-btn::after{content:"📷";position:absolute;right:3px;bottom:3px;font-size:11px;background:#000a;color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.it{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:0.5px solid var(--bd);font-size:14px}.it:last-child{border:0}
.it-body{flex:1;min-width:0}
.it .cv{width:36px;height:48px;flex:0 0 36px;border-radius:5px;font-size:12px}

function openDB(){
  return new Promise(resolve=>{
    try{
      if(!window.indexedDB){resolve(null);return}
      const req=indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};
      req.onsuccess=e=>resolve(e.target.result);
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null)}
  });
}
function ensureColors(){
  if(!Array.isArray(S.mats))S.mats=[];
  if(!Array.isArray(S.subs))S.subs=[];
  if(!Array.isArray(S.logs))S.logs=[];
  S.mats.forEach((m,i)=>{
    if(!m.color)m.color=COL[i%COL.length];
    if(m.fav==null)m.fav=false;
    if(m.arc==null)m.arc=false;
  });
  S.subs.forEach((s,i)=>{if(!s.color)s.color=COL[i%COL.length]});
  if(S.tmrFavOnly==null)S.tmrFavOnly=true;
  if(!S.pet||typeof S.pet!=='object'){const h0=sm(S.logs)/3600;S.pet={claimedLv:h0>=10?1:calcPetLv(h0),viewLv:0}}
  ensureValidSel();

async function initStorage(){
  let legacy=null;
  try{const raw=localStorage.getItem(K);if(raw)legacy=JSON.parse(raw)}catch(e){}
  dbRef=await openDB();
  if(dbRef){
    const saved=await new Promise(res=>{
      try{
        const tx=dbRef.transaction(DB_STORE,'readonly'),rq=tx.objectStore(DB_STORE).get('main');
        rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);
      }catch(e){res(null)}
    });
    if(saved&&Array.isArray(saved.mats)){
      S={...S,...saved};
    }else if(legacy&&Array.isArray(legacy.mats)){
      S={...S,...legacy};
    }
  }else if(legacy){
    S={...S,...legacy};
  }

  showBubble(4500);

}
function save(){

      const tx=dbRef.transaction(DB_STORE,'readwrite');
      tx.objectStore(DB_STORE).put(S,'main');
    }catch(e){}
  }
  try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}

function petSVG(lv,h,c,sleep,run,opt){
  opt=opt||{};const mood=opt.mood||'normal',type=opt.type||null,cat=opt.cat||null,awake=!sleep&&!run;
  const P={o:'#2b3320',b:c,w:'#ffffff',s:'#fff3d6',p:'#ff9eb5',y:'#fbbf24',g:'#d97706',u:'#bfe6ff',v:'#5aa9f0',n:'#22c55e',r:'#ef4444',k:'#2b3320'};
  const R=(x,y,w,hh,ch,op)=>`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${P[ch]||ch}"${op?` fill-opacity="${op}"`:''}/>`;
  const pts=(a,ch)=>a.map(p=>R(p[0],p[1],1,1,ch)).join('');
  const mp=a=>a.map(p=>[15-p[0],p[1]]);
  const G=rows=>{let s='';rows.forEach((r,y)=>{let x=0;while(x<r.length){const ch=r[x];if(ch==='.'){x++;continue}let e=x;while(e<r.length&&r[e]===ch)e++;s+=R(x,y,e-x,1,ch);x=e}});return s};
  const wing=(big,fill,edge)=>{
    const o=big?[[1,4],[0,5],[0,6],[0,7],[0,8],[0,9],[0,10],[1,11]]:[[1,5],[0,6],[0,7],[0,8],[0,9],[1,10]];
    const f=big?[[1,5],[1,6],[1,7],[1,8],[1,9],[1,10]]:[[1,6],[1,7],[1,8],[1,9]];
    return pts(o,edge)+pts(mp(o),edge)+pts(f,fill)+pts(mp(f),fill)};
  const ey=lv<=2?7:6;
  let eyes;
  if(sleep)eyes=`<g>${R(4,ey+1,2,1,'k')}${R(10,ey+1,2,1,'k')}</g>`;
  else if(run)eyes=`<g>${R(4,ey,2,2,'k')}${R(10,ey,2,2,'k')}${R(4,ey-1,2,1,'k')}${R(10,ey-1,2,1,'k')}</g>`;
  else if(mood==='happy')eyes=`<g>${pts([[4,ey+1],[5,ey],[6,ey+1],[9,ey+1],[10,ey],[11,ey+1]],'k')}</g>`;
  else if(mood==='weak')eyes=`<g class="pt-eye">${R(5,ey,1,2,'k')}${R(10,ey,1,2,'k')}</g>${pts([[5,ey+2],[10,ey+2]],'v')}`;
  else eyes=`<g class="pt-eye">${R(5,ey,1,2,'k')}${R(10,ey,1,2,'k')}</g>`;
  const cc=type==='morning'?'#ffb35c':type==='night'?'#b4a7ff':'p';
  const cheek=pts([[4,8],[11,8]],cc);
  let mouth='';
  if(lv>=2){
    if(sleep)mouth=R(7,8,2,1,'#e11d48');
    else if(run)mouth=R(7,8,2,1,'k');
    else if(mood==='happy')mouth=R(6,8,4,1,'k');
    else if(mood==='hungry')mouth=R(7,8,2,2,'k');
    else if(mood==='weak')mouth=R(7,8,2,1,'k')+pts([[6,9],[9,9]],'k');
    else mouth=R(7,8,2,1,'k');
  }
  let s=R(4,15,8,1,'#000',.16),b='',fx='';
  if(lv===1){
    b=G(PET_SPR.egg);
    for(let x=2;x<=13;x++)b+=R(x,x%2?10:9,1,1,'b');
    b+=pts([[9,5],[10,5],[10,6],[4,11],[5,11]],'b');
    if(h>=3)b+=pts([[7,3],[8,4],[7,5],[8,6]],'o');
    b+=cheek+eyes;
  }else if(lv===2){
    b=G(PET_SPR.hatch)+pts([[7,3],[8,3],[5,2],[6,2],[9,2],[10,2]],'n')+cheek+eyes+mouth;
  }else{
    const big=lv>=5;
    if(lv>=4)b+=wing(big,lv===4?'u':'y',lv===4?'o':'g');
    b+=G(lv===3?PET_SPR.a:PET_SPR.b);
    if(lv===3)b+=[[3,5],[3,6],[4,5]].map(p=>R(p[0],p[1],1,1,'#ffffff',.5)).join('');
    b+=R(6,8,4,1,'w')+R(5,9,6,3,'w');
    b+=pts([[4,14],[5,14],[10,14],[11,14]],'o');
    if(cat==='sci')b+=R(4,ey-1,3,3,'w')+R(9,ey-1,3,3,'w');
    b+=cheek+eyes+mouth;
    if(h>=50)b+=R(4,12,8,1,{sci:'v',lang:'p',soc:'y',edu:'n'}[cat]||'r');
    if(h>=300)b+=R(7,10,2,2,'y');
    if(lv===5&&h<400)b+=R(7,5,2,1,'y');
    if(h>=400&&lv>=5)b+=R(6,3,1,1,'y')+R(9,3,1,1,'y')+R(6,4,4,1,'y')+R(7,4,2,1,'r');
    if(lv===6)b+=R(5,1,6,1,'y');
    if(h>=200)b+=pts([[1,12],[0,13],[1,13],[2,13],[1,14]],'v');
    if(type&&(lv<=4||(lv===5&&h<400))){
      if(type==='morning')b+=pts([[7,2],[8,1],[7,0]],'y');

      else b+=pts([[7,2],[8,2],[8,1],[9,1]],'n');
    }
    if(cat==='sci'){
      const L=[[4,ey+2],[5,ey+2],[6,ey+2],[7,ey],[8,ey],[3,ey-1],[3,ey],[3,ey+1]];
      b+=pts(L,'o')+pts(mp(L),'o');

  }
  if(awake&&lv>=3&&h>=100&&(mood==='normal'||mood==='happy'))b+=pts([[1,0],[0,1],[1,1],[2,1],[1,2]],'y');
  if(awake&&lv>=3&&h>=100&&mood==='normal')b+=pts([[14,1],[13,2],[14,2],[15,2],[14,3]],'y');
  if(awake&&mood==='happy')fx+=pts([[13,0],[15,0],[13,1],[14,1],[15,1],[14,2]],'r');
  if(awake&&mood==='hungry')fx+=pts([[14,2],[14,3]],'v');
  if(sleep)fx+=`<g fill="#2b3320" fill-opacity=".55">${R(0,0,3,1,'k')}${R(1,1,1,1,'k')}${R(0,2,3,1,'k')}</g>`;
  else if(run)fx+=pts([[1,0],[1,1],[1,2],[1,4]],'r');
  return `<svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${s}${b}${fx}</svg>`;
}

function roomGoal(){
  if(S.timer&&S.timer.at)return{x:68,y:22};
  if(petSleeping())return{x:8,y:25};
  return null;
}
function roomMove(x,y,done){
  const el=$('rm_pet'),bob=$('pt_stg');if(!el)return;
  const d=Math.hypot(x-roomPos.x,(y-roomPos.y)*1.3),dur=Math.max(.6,d*.075);
  el.style.transition=`left ${dur}s linear,bottom ${dur}s linear`;
  if(bob)bob.classList.add('pt-walk');
  el.style.left=x+'%';el.style.bottom=y+'%';roomPos={x,y};
  clearTimeout(roomTmr);
  roomTmr=setTimeout(()=>{const b2=$('pt_stg');if(b2)b2.classList.remove('pt-walk');done&&done()},dur*1000+60);
}
function roomWander(){
  if(!$('rm_pet')){clearTimeout(roomTmr);return}
  const g=roomGoal();
  if(g){
    const next=()=>{roomTmr=setTimeout(roomWander,3000)};
    if(Math.abs(g.x-roomPos.x)>1||Math.abs(g.y-roomPos.y)>1)roomMove(g.x,g.y,next);else next();
    return;
  }
  const weak=petMood()==='weak';
  roomMove(3+Math.random()*76,3+Math.random()*22,()=>{roomTmr=setTimeout(roomWander,(weak?7000:2200)+Math.random()*(weak?6000:4500))});
}
let bubRaf=null;
function bubFix(){
  const p=$('rm_pet'),b=$('pt_bub'),r=document.querySelector('.rm');
  if(!p||!b||!r){bubRaf=null;return}
  if(!b.classList.contains('hide')){
    const pr=p.getBoundingClientRect(),rr=r.getBoundingClientRect(),bw=b.offsetWidth,bh=b.offsetHeight;
    const cx=pr.left+pr.width/2;
    const left=Math.max(rr.left+6,Math.min(rr.right-bw-6,cx-bw/2));
    const down=(pr.top-rr.top)<bh+12;
    b.style.left=(left-pr.left)+'px';
    b.style.setProperty('--tx',Math.max(8,Math.min(bw-8,cx-left))+'px');
    b.classList.toggle('dn',down);
  }
  bubRaf=requestAnimationFrame(bubFix);
}
function roomStart(){
  clearTimeout(roomTmr);const el=$('rm_pet');if(!el)return;
  cancelAnimationFrame(bubRaf);bubRaf=requestAnimationFrame(bubFix);
  el.style.transition='none';el.style.left=roomPos.x+'%';el.style.bottom=roomPos.y+'%';
  roomTmr=setTimeout(roomWander,400);
}

function jumpLatest(){

    const w0=wk(0).getTime(),d=new Date(maxT);d.setHours(0,0,0,0);

}
function range(){
  let a,b,bk=[];
  if(mode==='day'){
    a=wk(off);
    for(let i=0;i<7;i++){
      const s=a.getTime()+i*864e5,d=new Date(s);
      bk.push([s,s+864e5,`${d.getMonth()+1}/${d.getDate()}`,DW[d.getDay()]]);
    }
    b=new Date(a.getTime()+6048e5);
    const e=new Date(b-1);
    return{a:a.getTime(),b:b.getTime(),bk,label:`${a.getFullYear()}年${a.getMonth()+1}月${a.getDate()}日〜${e.getMonth()+1}月${e.getDate()}日`};
  }
  if(mode==='week'){
    const endWk=wk(off),startWk=wk(off-6);
    for(let i=0;i<7;i++){
      const w=wk(off-6+i),s=w.getTime(),e=new Date(s+6048e5-1);
      bk.push([s,s+6048e5,`${w.getMonth()+1}/${w.getDate()}`,`${w.getMonth()+1}/${w.getDate()}〜${e.getMonth()+1}/${e.getDate()}`]);
    }
    const e=new Date(endWk.getTime()+6048e5-1);
    return{a:startWk.getTime(),b:endWk.getTime()+6048e5,bk,label:`${startWk.getFullYear()}年${startWk.getMonth()+1}月${startWk.getDate()}日〜${e.getMonth()+1}月${e.getDate()}日`};
  }
  const n=new Date();a=new Date(n.getFullYear(),n.getMonth()+off,1);b=new Date(a.getFullYear(),a.getMonth()+1,1);const dn=Math.round((b-a)/864e5);
  for(let i=0;i<dn;i++)bk.push([new Date(a.getFullYear(),a.getMonth(),i+1).getTime(),new Date(a.getFullYear(),a.getMonth(),i+2).getTime(),(i==0||(i+1)%5==0)?i+1+'':'','']);

}

function weekComparisonView(r,matOrder){
  const bk=r.bk;
  const totals=bk.map(x=>sm(filterLogs(inR(x[0],x[1]))));
  const goalSec=(S.goal||14)*3600;
  const mx=Math.max(...totals,goalSec,1);
  let activeIdx=selBucket;
  if(activeIdx===null||activeIdx<0||activeIdx>=bk.length){
    for(let i=bk.length-1;i>=0;i--){
      if(totals[i]>0){activeIdx=i;break}
    }
    if(activeIdx===null)activeIdx=bk.length-1;
  }
  const dayNames=['月','火','水','木','金','土','日'];
  const rowsHTML=[...bk].map((x,i)=>[x,i]).reverse().map(([x,i])=>{
    const wLogs=filterLogs(inR(x[0],x[1])),tot=totals[i];
    const byM={};wLogs.forEach(l=>byM[l.mid]=(byM[l.mid]||0)+l.sec);
    const segs=matOrder.filter(id=>byM[id]>0).map(id=>`<i style="width:${byM[id]/mx*100}%;background:${col(mat(id))}"></i>`).join('');
    const dots=dayNames.map((dn,di)=>{
      const ds=x[0]+di*864e5,has=filterLogs(inR(ds,ds+864e5)).length>0;
      return `<i class="${has?'on':''}">${dn}</i>`;
    }).join('');
    const isOn=activeIdx===i;
    return `<div class="wk-row ${isOn?'on':''}" onclick="selectBucket(${i})">
      <div class="wk-top">
        <span class="wk-lbl">${x[3]}</span>
        <div class="wk-Meta">
          <span class="wk-dots">${dots}</span>
          <b style="min-width:58px;text-align:right;color:${tot?'var(--tx)':'var(--sub)'}">${tot?hm(tot):'0分'}</b>
        </div>
      </div>
      <div class="wk-bar">${segs}</div>
    </div>`;
  }).join('');

  let detailHTML='';

  return `<div class="wk-wrap">

    ${rowsHTML}
    ${detailHTML}
  </div>`;
}

function monthSummaryList(){
  const n=new Date(),byM={};
  filterLogs(S.logs).forEach(l=>{
    const d=new Date(l.t),k=d.getFullYear()+'-'+p2(d.getMonth()+1);
    if(!byM[k])byM[k]={y:d.getFullYear(),m:d.getMonth(),s:0,days:new Set()};
    byM[k].s+=l.sec;byM[k].days.add(dk(l.t));
  });
  const cur=new Date(n.getFullYear(),n.getMonth()+off,1),curK=cur.getFullYear()+'-'+p2(cur.getMonth()+1);
  if(!byM[curK])byM[curK]={y:cur.getFullYear(),m:cur.getMonth(),s:0,days:new Set()};
  const rows=Object.entries(byM).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12);
  const mx=Math.max(...rows.map(x=>x[1].s),1);
  return `<div class="mo-list"><div class="sub" style="margin-bottom:4px">月別の学習時間（タップで表示月を切替）</div>${rows.map(([k,o])=>{
    const oVal=(o.y-n.getFullYear())*12+(o.m-n.getMonth());
    return `<div class="mo-row ${k===curK?'on':''}" onclick="off=${oVal};ptxt='';render()"><div class="mo-lbl">${o.y}年${o.m+1}月</div><div class="mo-bar"><i style="width:${o.s?Math.max(3,o.s/mx*100):0}%"></i></div><div class="mo-val">${o.s?hm(o.s):'0分'}</div></div>`;
  }).join('')}</div>`;
}

/* 時間帯集計：6区分ブロック（早朝・午前・昼・夕方・夜・深夜）の横バー表示 */
function hours(ls){const h=Array(24).fill(0);ls.filter(l=>!l.nt).forEach(l=>{let c=l.t;const e=l.t+l.sec*1000;while(c<e){const d=new Date(c),n=new Date(c);n.setHours(d.getHours()+1,0,0,0);const k=Math.min(e,n.getTime())-c;h[d.getHours()]+=k/1000;c+=k}});return h}
function timeZoneCard(H){
  const blocks=[
    {name:'早朝',sub:'5-8',hrs:[5,6,7]},
    {name:'午前',sub:'8-12',hrs:[8,9,10,11]},
    {name:'昼',sub:'12-15',hrs:[12,13,14]},
    {name:'夕方',sub:'15-18',hrs:[15,16,17]},
    {name:'夜',sub:'18-22',hrs:[18,19,20,21]},
    {name:'深夜',sub:'22-5',hrs:[22,23,0,1,2,3,4]}
  ].map(b=>({...b,sec:b.hrs.reduce((a,h)=>a+H[h],0)}));
  const tot=blocks.reduce((a,b)=>a+b.sec,0);
  const mx=Math.max(...blocks.map(b=>b.sec),1);
  const topB=tot>0?blocks.reduce((a,b)=>b.sec>a.sec?b:a,blocks[0]):null;
  const hx=Math.max(...H),hi=hx>0?H.indexOf(hx):-1;
  return `<div class="card"><h2><span>時間帯の傾向</span>${hi>=0?`<span style="color:var(--tx)">ピーク ${hi}時台</span>`:''}</h2>${tot?`<div class="tz-list">${blocks.map(b=>{
    const pct=Math.round(b.sec/tot*100),isTop=topB&&b.name===topB.name&&b.sec>0;
    return `<div class="tz-row">
      <div class="tz-lbl"><span>${b.name}</span><small>${b.sub}時</small></div>
      <div class="tz-bar ${isTop?'top':''}"><i style="width:${b.sec?Math.max(3,b.sec/mx*100):0}%"></i></div>
      <div class="tz-val" style="color:${b.sec?'var(--tx)':'var(--sub)'}">${b.sec?hm(b.sec):'0分'}<small>${b.sec?pct+'%':''}</small></div>
    </div>`;
  }).join('')}</div>`:'<div class="sub">時刻付きの学習記録がありません</div>'}</div>`;
}
function perMat(ls){const p={};ls.forEach(l=>{const o=p[l.mid]=p[l.mid]||{s:0,a:0,f:[]};o.s+=l.sec;if(l.amt!=null)o.a+=l.amt;if(l.focus)o.f.push(l.focus)});return Object.entries(p).sort((x,y)=>y[1].s-x[1].s)}
const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'-';

function statMatFilterOptions(){

  }
  return html;
}

  const H=hours(ls);let acc=0;
  const gr=pm.map(([id,o])=>{const f=acc/tot*100;acc+=o.s;return `${col(mat(id))} ${f}% ${acc/tot*100}%`}).join(',');
  return `<div class="card"><div class="seg"><button class="${mode==='day'?'on':''}" onclick="mode='day';off=0;selBucket=null;if(!inR(range().a,range().b).length)jumpLatest();ptxt='';render()">日（週内）</button><button class="${mode==='week'?'on':''}" onclick="mode='week';off=0;selBucket=null;if(!inR(range().a,range().b).length)jumpLatest();ptxt='';render()">週（7週）</button><button class="${mode==='month'?'on':''}" onclick="mode='month';off=0;selBucket=null;if(!inR(range().a,range().b).length)jumpLatest();ptxt='';render()">月</button></div>

${heat()}${prog()}${timeZoneCard(H)}
<div class="card"><h2>分析用プロンプト</h2><select onchange="pu=+this.value;ptxt=''">${['週・月の振り返り','ペース見直し（遅れ・偏りの確認）','時間帯と集中度の分析','試験前の戦略（優先順位と配分）','教材の見直し（効果の比較）','やる気が落ちたときの立て直し'].map((x,i)=>`<option value="${i}" ${pu==i?'selected':''}>${x}</option>`).join('')}</select>
<button onclick="gen()" style="width:100%">作成してコピー</button>${ptxt?`<textarea id="pt" style="margin-top:8px" readonly>${esc(ptxt)}</textarea>`:''}</div>`;
}

function gen(){const r=range(),ls=inR(r.a,r.b),tot=sm(ls),H=hours(ls),pm=perMat(ls);
const day=r.bk.map(x=>{const s=sm(inR(x[0],x[1]));return s?`${x[2]}:${hm(s)}`:''}).filter(Boolean).join('、')||'なし';
const hr=H.map((s,i)=>[i,s]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>`${x[0]}時台:${hm(x[1])}`).join('、')||'なし';
const mt=pm.map(([id,o])=>{const m=mat(id);return `・${m?m.title:'削除済み'}（${m&&sub(m.sid)?sub(m.sid).name:''}）：${hm(o.s)}${o.a?'／'+o.a+(m?m.unit:''):''}／平均集中度${avg(o.f)}（3段階）`}).join('\n')||'なし';
const memo=ls.filter(l=>l.memo).sort((a,b)=>b.t-a.t).slice(0,6).map(l=>`・${dk(l.t)} ${mat(l.mid)?mat(l.mid).title:''}：${l.memo}`).join('\n')||'なし';
const q=['全体を振り返り、良かった点と課題を指摘してください。','目標ペースに対する遅れや教材ごとの偏りを指摘し、立て直し案を出してください。','集中できている時間帯と、そうでない時間帯の傾向を分析し、教材の割り当て方を提案してください。','試験日までの残り期間を想定し、教材ごとの進捗と残り量から、優先順位と時間配分の戦略を提案してください（試験日は私が補足します）。','教材ごとの時間・量・集中度から、効果が高い教材と見直すべき教材を指摘し、継続・縮小・変更の提案をしてください。','最近モチベーションが落ちています。記録から無理のないペースを見直し、再開しやすい小さな行動を提案してください。'][pu];
ptxt=`あなたは学習コーチです。以下は私の勉強記録（${r.label}）の集計です。${q}\n\n【概要】合計${hm(tot)}、平均${hm(tot/r.bk.length)}、連続学習${streak()}日\n【期間別】${day}\n【教材別】\n${mt}\n【教材の進捗】\n${progLines()}\n【時間帯別の上位】${hr}\n【メモ】\n${memo}\n\n【お願い】1.良かった点 2.課題 3.次の1週間の具体的な行動（3つ）を、簡潔に。`;
render();const t=$('pt');if(t){t.select();try{navigator.clipboard.writeText(ptxt).then(()=>toast('コピーしました')).catch(()=>document.execCommand('copy'))}catch(e){try{document.execCommand('copy')}catch(_){}}}}

const GK=[['d','日付',/日付|日|date|day/i],['s','開始時刻',/開始|start/i],['m','教材',/教材|参考書|タイトル|名称|material|title|name/i],['t','時間',/時間|分|duration|time/i],['a','量',/量|ページ|問|amount|page/i],['n','メモ',/メモ|コメント|memo|comment|note/i],['c','科目',/カテゴリ|科目|category|subject/i]];
function csv(t){const d=t.split('\n')[0].includes('\t')?'\t':',',R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const x=t[i];if(q){if(x=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=x}else if(x=='"')q=true;else if(x==d){r.push(c);c=''}else if(x=='\n'||x=='\r'){if(x=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(z=>z.trim()))R.push(r);r=[]}else c+=x}r.push(c);if(r.some(z=>z.trim()))R.push(r);return R}
function pd(d,s){d=(d||'').trim();const m=d.match(/(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})/);if(!m)return null;const k=((s||'')+' '+d).match(/(\d{1,2}):(\d{2})/);return{t:new Date(+m[1],m[2]-1,+m[3],k?+k[1]:12,k?+k[2]:0).getTime(),nt:!k}}
function pdur(v,u){v=(v||'').trim();if(!v)return 0;const m=v.match(/^(\d+):(\d{2})(?::(\d{2}))?$/);if(m)return +m[1]*3600+ +m[2]*60+(m[3]?+m[3]:0);if(/[時分秒]/.test(v)){const h=v.match(/(\d+(?:\.\d+)?)\s*時間/),mi=v.match(/(\d+(?:\.\d+)?)\s*分/),s=v.match(/(\d+(?:\.\d+)?)\s*秒/);return Math.round((h?+h[1]*3600:0)+(mi?+mi[1]*60:0)+(s?+s[1]:0))}return isNaN(+v)?0:Math.round(+v*u)}
function imLoad(text){im.text=text;im.rows=csv(text);im.map={};im.done='';const h=im.rows[0]||[],used=new Set();GK.forEach(([k,,re])=>{const i=h.findIndex((x,j)=>!used.has(j)&&re.test(x));if(i>=0){im.map[k]=i;used.add(i)}});prep();render()}
async function impFile(inp){const f=inp.files[0];if(!f)return;const b=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){t=new TextDecoder('shift_jis').decode(b)}imLoad(t.replace(/^\uFEFF/,''))}
function prep(){const R=im.rows;if(!R||R.length<2){im.out=null;return}const M=im.map,has=k=>M[k]!=null,ok=[];let bad=0;
R.slice(1).forEach(r=>{const dt=pd(has('d')?r[M.d]:'',has('s')?r[M.s]:''),sec=pdur(has('t')?r[M.t]:'',+im.unit);if(!dt||!(sec>0)){bad++;return}ok.push({title:has('m')?(r[M.m]||'').trim():'',t:dt.t,nt:dt.nt,sec,amt:has('a')&&r[M.a]!==''&&r[M.a]!=null&&!isNaN(+r[M.a])?+r[M.a]:null,memo:has('n')?(r[M.n]||'').trim():'',cat:has('c')?(r[M.c]||'').trim():''})});
const ex=new Set(S.logs.map(l=>l.mid+'|'+(l.nt?dk(l.t):l.t)+'|'+l.sec));
im.out=ok.filter(o=>{const m=S.mats.find(x=>x.title==(o.title||'（教材不明）'));return !(m&&ex.has(m.id+'|'+(o.nt?dk(o.t):o.t)+'|'+o.sec))});im.dup=ok.length-im.out.length;im.bad=bad}

S.logs.push({id:uid()+i,mid:m.id,t:o.t,sec:o.sec,amt:o.amt,to:null,fr:null,focus:0,memo:o.memo,nt:o.nt?1:0})});

${im.out?`<div style="margin:8px 0">対象 <b>${im.out.length}件</b>${im.dup?`（重複スキップ ${im.dup}件）`:''}${im.bad?`／除外 ${im.bad}件`:''}</div><div class="sub" style="margin-bottom:8px">${im.out.slice(0,3).map(o=>`${dk(o.t)} ${esc(o.title||'（教材不明）')} ${hm(o.sec)}`).join('<br>')}</div><button onclick="doImport()" style="width:100%" ${im.out.length?'':'disabled'}>取り込む</button>`:''}`:''}</div>`}

function rg(l){if(l.to==null)return null;const b=l.to,a=l.fr!=null?l.fr:(l.amt!=null?b-l.amt+1:b);return[Math.min(a,b),Math.max(a,b)]}
function cov(m){const a0=m.from||1,b0=m.total;if(!b0||b0<a0)return null;const n=b0-a0+1,d=new Array(n+2).fill(0),t14=Date.now()-14*864e5;let amt=0,sec=0,rec=0;
S.logs.forEach(l=>{if(l.mid!=m.id)return;if(l.amt!=null){amt+=l.amt;if(l.amt>0)sec+=l.sec;if(l.t>=t14)rec+=l.amt}const r=rg(l);if(r){const s=Math.max(r[0],a0)-a0,e=Math.min(r[1],b0)-a0;if(e>=s){d[s]++;d[e+1]--}}});
const c=[];let x=0,c1=0,c2=0;for(let i=0;i<n;i++){x+=d[i];c.push(x);if(x>=1)c1++;if(x>=2)c2++}return{n,c,c1,c2,amt,sec,rec,laps:amt/n}}
function pgi(m){const c=cov(m);if(!c)return null;const L=m.laps||1,rem=Math.max(0,c.n*L-c.amt),ls=S.logs.filter(l=>l.mid==m.id),first=ls.length?Math.min(...ls.map(l=>l.t)):Date.now(),span=Math.max(1,Math.min(14,(Date.now()-first)/864e5)),pace=c.rec/span,mpu=c.amt>0?c.sec/c.amt:0,dl=m.dl?Math.ceil((new Date(m.dl+'T23:59:59')-Date.now())/864e5):null;return{...c,L,rem,pace,mpu,dl}}
function pg(m){const c=cov(m);return `<div class="sub" style="font-size:10px"><b style="color:${col(m)}">●</b> ${hm(sm(S.logs.filter(l=>l.mid==m.id)))}${c?' '+Math.round(c.c1/c.n*100)+'%':''}</div>`}

function prog(){
  const allWithTotal=S.mats.filter(m=>m.total).map(m=>[m,pgi(m)]).filter(x=>x[1]);
  if(!allWithTotal.length)return '';
  const arcWithTotal=allWithTotal.filter(([m])=>m.arc);
  const L=allWithTotal.filter(([m])=>showArcProg||!m.arc);
  return `<div class="card"><h2><span>教材の進捗</span>${arcWithTotal.length?`<button class="g" style="padding:3px 8px;font-size:11px" onclick="showArcProg=!showArcProg;render()">${showArcProg?'完了分を隠す':`完了分も表示（${arcWithTotal.length}）`}</button>`:''}</h2>${L.length?L.map(([m,p])=>{const nb=Math.min(p.n,40);let st='';for(let k=0;k<nb;k++){const a=Math.floor(k*p.n/nb),b=Math.floor((k+1)*p.n/nb),w=Math.max(1,b-a);let c1=0,c2=0;for(let i=a;i<b;i++){if(p.c[i]>=1)c1++;if(p.c[i]>=2)c2++}const f=c1/w,g=c2/w>=.5;st+=`<i style="background:${f<.05?'var(--bd)':g?'#059669':col(m)};${f>=.05&&!g?'opacity:'+(.35+.65*f):''}"></i>`}

<div class="sub">カバー率 <b>${Math.round(p.c1/p.n*100)}%</b>（2周以上 ${Math.round(p.c2/p.n*100)}%）／ ${p.laps.toFixed(1)}周（目標${p.L}周）</div>
<div class="sub">残り ${Math.round(p.rem)}${m.unit}${p.mpu?'（約'+hm(p.rem*p.mpu)+'）':''}${p.pace>0?' ／ '+p.pace.toFixed(1)+m.unit+'/日 → '+(p.rem<=0?'達成済み':'予測 '+(fin.getMonth()+1)+'/'+fin.getDate()):''}</div>
${!m.arc&&m.dl&&p.rem>0?`<div class="sub" style="font-weight:600;color:${ok?'#059669':'#e5484d'}">期限 ${m.dl.slice(5).replace('-','/')}（残${Math.max(0,p.dl)}日）：1日 ${(p.rem/Math.max(1,p.dl)).toFixed(1)}${m.unit}必要${ok?'（順調）':'（ペース不足）'}</div>`:''}</div></div></div>`}).join(''):'<div class="sub">進行中の範囲設定済み教材はありません</div>'}</div>`}

function heat(){const m=dayMap(),n=new Date();n.setHours(0,0,0,0);const st=wk(-14),dg=DG()*60,mn=Math.max(1,MN())*60,tk=dk(n);let h='',days=0;

for(let d=new Date(mStart);d<=n;d.setDate(d.getDate()+1)){if((m[dk(d)]||0)>0)days++}
for(let i=0;i<105;i++){const d=new Date(st);d.setDate(st.getDate()+i);const k=dk(d),s=m[k]||0,o=s==0?0:s<mn?.3:s<dg*.6?.55:s<dg?.8:1;
h+=`<i style="${d>n?'visibility:hidden':`background:${o?'var(--ac)':'var(--bd)'};opacity:${o||1}`}${k==tk?';outline:2px solid var(--tx)':''}"></i>`}

function toast(m,a){clearTimeout(ut);const t=$('toast');t.innerHTML=`${m}${a?` <button onclick="undo()">${a}</button>`:''}`;t.style.display='flex';ut=setTimeout(()=>t.style.display='none',6000)}
function undo(){if(!us)return;const o=JSON.parse(us);S.subs=o.subs;S.mats=o.mats;S.logs=o.logs;us=null;ensureValidSel();save();$('toast').style.display='none';render()}
function addSub(){const n=md.ns.trim();if(!n)return;const s={id:uid(),name:n,color:COL[S.subs.length%COL.length],icon:'📘'};S.subs.push(s);md.sid=s.id;md.ns='';save();render()}
function addMat(){if(!md.title.trim()){md.msg='教材名を入力してください';render();return}
if(!md.sid){if(!S.subs.length)S.subs.push({id:uid(),name:'教員免許認定試験',color:COL[0],icon:'📘'});md.sid=S.subs[0].id}
const nm={id:uid(),sid:+md.sid,title:md.title.trim(),unit:md.unit,cover:md.cover,color:md.color||COL[S.mats.length%COL.length],fav:Boolean(md.fav),arc:false};
S.mats.push(nm);if(!S.sel||nm.fav)S.sel=nm.id;ensureValidSel();md={sid:md.sid,title:'',unit:md.unit,cover:'',color:'',fav:false,msg:'',ns:''};showAddMat=false;save();toast('教材を追加しました');render()}
function delMat(id){if(pe==id)pe=null;S.mats=S.mats.filter(m=>m.id!=id);S.logs=S.logs.filter(l=>l.mid!=id);if(S.timer&&S.timer.mid==id){S.timer=null;unwake()}ensureValidSel();save();render()}

/* ハイブリッドJSONバックアップ */
function bkData(){return JSON.stringify({app:'studylog',v:7,exportedAt:new Date().toISOString(),subs:S.subs,mats:S.mats,logs:S.logs,goal:S.goal,dgoal:S.dgoal,minDay:S.minDay,cel:S.cel,pet:S.pet,homeOrder:S.homeOrder,tmrFavOnly:S.tmrFavOnly})}
function exp(){const d=bkData(),t=$('bk');if(t){t.value=d;t.select()}try{navigator.clipboard.writeText(d).then(()=>toast('コピーしました')).catch(()=>document.execCommand('copy'))}catch(e){try{document.execCommand('copy')}catch(_){}}}
async function expFile(){
  const data=bkData(),t=$('bk');if(t)t.value=data;
  const fname='studylog_backup_'+dk(Date.now()).replace(/-/g,'')+'.json';
  const blob=new Blob([data],{type:'application/json'});
  try{
    const file=new File([blob],fname,{type:'application/json'});
    if(location.protocol==='file:'&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:fname});
      return;
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    const a=document.createElement('a'),url=URL.createObjectURL(blob);
    a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){}
}
async function impFile2(inp){const f=inp.files[0];if(!f)return;$('bk').value=await f.text();imp();inp.value=''}
function imp(){
  try{
    const o=JSON.parse($('bk').value);
    if(!Array.isArray(o.logs)||!Array.isArray(o.mats))throw 0;
    unwake();
    S={subs:o.subs||[],mats:o.mats,logs:o.logs,goal:o.goal||14,dgoal:o.dgoal??60,minDay:o.minDay??15,cel:o.cel||{},pet:o.pet||null,homeOrder:o.homeOrder||null,tmrFavOnly:o.tmrFavOnly??true,timer:null,sel:o.mats[0]?o.mats[0].id:null};
    ensureColors();
    save();toast('バックアップを復元しました');render();
  }catch(e){toast('データの形式が正しくありません')}
}

function render(){
  const sh=S.timer&&tab!=='home',mi=$('mini');
  if(sh){const m=mat(S.timer.mid);mi.innerHTML=`<div><b>${m?esc(m.title):''}</b><span id="mclk">${clk(el())}</span></div><button onclick="toggle()">${S.timer.at?'⏸':'▶'}</button><button class="r" onclick="finish()">終了</button>`}
  mi.style.display=sh?'flex':'none';
  if($('hdrw'))$('hdrw').style.display=sh?'none':'block';
  $('v').innerHTML={home:vHome,log:vLog,stat:vStat,mat:vMat}[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  tick();
  if($('rm_pet'))roomStart();else{clearTimeout(roomTmr);cancelAnimationFrame(bubRaf)}
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  const prev=tab;
  tab=b.dataset.t;
  if(tab!=='log')ed=null;
  if(tab==='home'&&prev!=='home')showBubble(4500);
  if(tab==='stat'&&!inR(range().a,range().b).length)jumpLatest();
  render();
  if($('main'))$('main').scrollTo(0,0);
});
