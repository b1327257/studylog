<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2233;--sub:#7a8199;--ac:#059669;--bd:#e4e7f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--tx:#e8eaf3;--sub:#8b92ab;--ac:#10b981;--bd:#2b3042;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--tx:#e8eaf3;--sub:#8b92ab;--ac:#10b981;--bd:#2b3042;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:12px 14px 92px;max-width:560px;margin:0 auto}
.hdr{display:flex;align-items:center;gap:10px;margin:2px 2px 12px}
.brand-icon{width:34px;height:34px;background:#059669;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.brand-icon svg{width:19px;height:19px;stroke:currentColor;stroke-width:2.05;stroke-linecap:round;stroke-linejoin:round;fill:none}
.hdr-title{font-size:20px;font-weight:700;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:14px;color:var(--sub);margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.r{background:#e5484d;color:#fff}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin-bottom:8px}
.clock{font-size:50px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 12px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:26px;font-weight:700}.sub{color:var(--sub);font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;background:none;color:var(--sub);border-radius:0;padding:13px 4px;font-size:13px}nav button.on{color:var(--ac);font-weight:700}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;background:none;color:var(--sub);padding:7px;font-size:13px;border-radius:8px}.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px #0001}
.chart{display:flex;align-items:flex-end;gap:5px;height:148px;margin-top:14px;padding-top:18px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.chart .stk{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden;min-height:2px;background:var(--bd)}
.chart .stk i{display:block;width:100%}
.chart .vl{font-size:9px;color:var(--sub);margin-bottom:3px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.1;text-align:center}
.chart .lb{font-size:10px;color:var(--sub);height:16px;margin-top:4px;white-space:nowrap}
.nv{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.nv button{padding:6px 14px}
.donut{width:124px;height:124px;border-radius:50%;flex:none;position:relative}.donut:after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--card)}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}
.lg b{width:10px;height:10px;border-radius:3px;flex:none}
.lg .lt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.lg em{margin-left:auto;font-style:normal;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12px}
.cv{width:42px;height:56px;border-radius:5px;position:relative;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 2px 5px #0000001a;border-left:4px solid #0000002e}
.cv.has-img{border-left:0;background:var(--bd)!important}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv .spine{font-size:10px;line-height:1.15;padding:3px;text-align:center;word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;opacity:.95}
.cv-btn{cursor:pointer;position:relative}
.cv-btn::after{content:"📷";position:absolute;right:3px;bottom:3px;font-size:11px;background:#000a;color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.it:last-child{border:0}
.it-body{flex:1;min-width:0}
.it .cv{width:36px;height:48px;flex:0 0 36px;border-radius:4px;font-size:12px}
.it button{padding:5px 9px;font-size:12px}.dh{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:12px 0 2px}
textarea{min-height:110px;font-size:12px}
#mini{position:fixed;top:0;left:0;right:0;z-index:12;display:none;align-items:center;gap:8px;background:var(--ac);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px}
#mini>div{flex:1;min-width:0}#mini b{display:block;font-size:12px;opacity:.9;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#mini span{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}#mini button{background:#ffffff33;padding:8px 12px}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bk{text-align:left;font-size:11px;min-width:0;display:flex;flex-direction:column}
.bk .cv{width:100%;height:auto;aspect-ratio:3/4;border-radius:7px;margin-bottom:5px}
.bk .cv .spine{font-size:11px;padding:6px;-webkit-line-clamp:4}
.bk b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;min-height:2.5em;font-size:11px}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.shelf-it{background:var(--bg);border:2px solid transparent;border-radius:10px;padding:6px;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-width:0;transition:border-color .15s}
.shelf-it.on{border-color:var(--ac);background:var(--card);box-shadow:0 2px 8px #00000012}
.shelf-it .cv{width:100%;height:auto;aspect-ratio:3/4;margin-bottom:4px;border-radius:5px}
.shelf-it span{font-size:10px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--tx)}
.sw{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid transparent;flex:none}
.sw.on{border-color:var(--tx);transform:scale(1.1)}
.ring{width:88px;height:88px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--bd)}.ring:before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}.ring span{position:relative;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;text-align:center;background:var(--bg);border-radius:12px;padding:10px 6px}
.kpis b{display:block;font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px}
.hm{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-template-columns:repeat(15,1fr);gap:3px}.hm i{aspect-ratio:1;border-radius:3px;display:block}
.st{display:flex;gap:1px;height:12px;margin:6px 0}.st i{flex:1;border-radius:2px;display:block}
.mlist{margin-top:12px;border-top:1px solid var(--bd);padding-top:8px}
.mitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.mitem:last-child{border:0}
.mitem .cv{width:32px;height:42px;flex:0 0 32px;font-size:11px;border-radius:4px}
.mitem-main{flex:1;min-width:0}
.mitem-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.mitem-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem-top span{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.mitem-bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin:4px 0}
.mitem-bar i{display:block;height:100%;border-radius:4px}
.mitem-sub{font-size:11px;color:var(--sub)}
.mo-list{margin-top:12px;border-top:1px solid var(--bd);padding-top:8px}
.mo-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:8px}
.mo-row:last-child{border:0}
.mo-row.on{background:var(--bg)}
.mo-lbl{width:84px;flex:none;font-size:12px;font-weight:600}
.mo-bar{flex:1;height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.mo-bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.mo-val{width:80px;flex:none;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
#cfm{position:fixed;inset:0;z-index:40;background:#0006;display:none;align-items:center;justify-content:center;padding:20px}
#cfm .cm-box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;width:100%;max-width:340px;box-shadow:0 10px 30px #0004}
#cfm .cm-t{font-size:15px;font-weight:700;margin-bottom:6px}
#cfm .cm-m{font-size:13px;color:var(--sub);line-height:1.5;margin-bottom:14px}
.cat-tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700}
.cat-tag i{width:8px;height:16px;border-radius:3px;display:inline-block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;display:none;align-items:center;gap:10px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;white-space:nowrap}#toast button{padding:4px 10px;background:var(--ac);color:#fff}
#cel{position:fixed;inset:0;z-index:30;display:none;pointer-events:none;overflow:hidden}#cel .cb{position:absolute;left:50%;top:28%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px 26px;text-align:center;box-shadow:0 8px 30px #0004;animation:pop .4s}#cel i{position:absolute;top:-30px;font-style:normal;font-size:22px;animation:fall 2.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
</style></head><body>
<div id="mini"></div>
<header class="hdr">
  <div class="brand-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="13.5" r="7.5"></circle>
      <line x1="10" y1="3" x2="14" y2="3"></line>
      <line x1="12" y1="3" x2="12" y2="6"></line>
      <line x1="17.3" y1="8.2" x2="19.2" y2="6.3"></line>
      <polyline points="12 9.5 12 13.5 15 15.2"></polyline>
    </svg>
  </div>
  <div class="hdr-title">勉強ログ</div>
</header>
<div id="v"></div><div id="toast"></div><div id="cel"></div><div id="cfm" onclick="if(event.target===this)closeCfm()"></div>
<input id="ph" type="file" accept="image/*" style="display:none" onchange="onPhoto(this)">
<nav><button data-t="home">ホーム</button><button data-t="log">記録</button><button data-t="stat">振り返り</button><button data-t="mat">設定</button></nav>
<script>
const K='studylog2',DB_NAME='StudyLogDB',DB_STORE='state';
const COL=['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#06b6d4','#f97316','#6366f1','#14b8a6'],DW='日月火水木金土';
let S={subs:[],mats:[],logs:[],goal:14,dgoal:60,minDay:15,timer:null,sel:null,cel:{}},dbRef=null,photoTarget=null;
let tab='home',mode='week',off=0,ed=null,pu=0,md={sid:'',title:'',unit:'ページ',cover:'',color:'',msg:'',ns:''},wl,ptxt='',pe=null,es=null,us=null,ut,ct,fmat='all',showAddMat=false,cfmFn=null;
let im={text:'',rows:null,map:{},unit:'60',out:null,done:''};

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),clk=s=>{s=Math.floor(s);return p2(s/3600|0)+':'+p2((s%3600)/60|0)+':'+p2(s%60)};
const hm=s=>{const m=Math.round(s/60);return m>=60?`${m/60|0}時間${m%60?m%60+'分':''}`:`${m}分`};
const hmFull=s=>{const m=Math.round(s/60);return m>=60?`${m/60|0}時間${p2(m%60)}分`:`${m}分`};
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())},tm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
const mat=id=>S.mats.find(m=>m.id==id),sub=id=>S.subs.find(s=>s.id==id);
/* 教材ごとに固有カラーを自動割当（個別設定 > 教材インデックス順パレット） */
const col=m=>{
  if(!m)return COL[0];
  if(m.color)return m.color;
  const idx=S.mats.findIndex(x=>x.id==m.id);
  return COL[(idx>=0?idx:0)%COL.length];
};
const scol=s=>{
  if(!s)return COL[0];
  if(s.color)return s.color;
  const idx=S.subs.findIndex(x=>x.id==s.id);
  return COL[(idx>=0?idx:0)%COL.length];
};
const ico=m=>{const s=m&&sub(m.sid);return s&&s.icon||'📘'};
const el=()=>{const t=S.timer;return t?t.acc+(t.at?(Date.now()-t.at)/1000:0):0};
const wk=o=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d};
const inR=(a,b)=>S.logs.filter(l=>l.t>=a&&l.t<b),sm=ls=>ls.reduce((x,l)=>x+l.sec,0);

/* IndexedDB & ストレージ管理 */
function openDB(){
  return new Promise(resolve=>{
    try{
      if(!window.indexedDB){resolve(null);return}
      const req=indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};
      req.onsuccess=e=>resolve(e.target.result);
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null)}
  });
}
function ensureColors(){
  if(!Array.isArray(S.mats))S.mats=[];
  if(!Array.isArray(S.subs))S.subs=[];
  if(!Array.isArray(S.logs))S.logs=[];
  S.mats.forEach((m,i)=>{if(!m.color)m.color=COL[i%COL.length]});
  S.subs.forEach((s,i)=>{if(!s.color)s.color=COL[i%COL.length]});
}
async function initStorage(){
  let legacy=null;
  try{const raw=localStorage.getItem(K);if(raw)legacy=JSON.parse(raw)}catch(e){}
  dbRef=await openDB();
  if(dbRef){
    const saved=await new Promise(res=>{
      try{
        const tx=dbRef.transaction(DB_STORE,'readonly'),rq=tx.objectStore(DB_STORE).get('main');
        rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);
      }catch(e){res(null)}
    });
    if(saved&&Array.isArray(saved.mats)){
      S={...S,...saved};
    }else if(legacy&&Array.isArray(legacy.mats)){
      S={...S,...legacy};
    }
  }else if(legacy){
    S={...S,...legacy};
  }
  ensureColors();
  save();
  if(S.timer&&S.timer.at)wake();
  render();
}
function save(){
  if(dbRef){
    try{
      const tx=dbRef.transaction(DB_STORE,'readwrite');
      tx.objectStore(DB_STORE).put(S,'main');
    }catch(e){}
  }
  try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
}

function weekTotal(){const a=wk(0).getTime();return sm(inR(a,a+6048e5))+(S.timer?el():0)}
function todayTotal(){const d=new Date();d.setHours(0,0,0,0);return sm(inR(d.getTime(),d.getTime()+864e5))+(S.timer?el():0)}
function monthTotal(){const n=new Date(),a=new Date(n.getFullYear(),n.getMonth(),1).getTime();return sm(inR(a,Date.now()+864e5))+(S.timer?el():0)}
function allTotal(){return sm(S.logs)+(S.timer?el():0)}
const DG=()=>S.dgoal==null?60:S.dgoal,MN=()=>S.minDay==null?15:S.minDay;
function dayMap(){const m={};S.logs.forEach(l=>{const k=dk(l.t);m[k]=(m[k]||0)+l.sec});return m}
function streak(){const m=dayMap(),mn=Math.max(1,MN())*60,tk=dk(new Date()),ok=k=>(m[k]||0)+(S.timer&&k==tk?el():0)>=mn;let d=new Date(),n=0;if(!ok(tk))d.setDate(d.getDate()-1);while(n<4000&&ok(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function cover(m,cls='',act=''){
  const has=m&&m.cover,c=col(m),t=m&&m.title?m.title:'';
  return `<div class="cv ${has?'has-img':''} ${cls}" ${act} style="background:${c}">${has?`<img src="${esc(m.cover)}" alt="" onerror="this.remove()">`:`<span class="spine">${esc(t.slice(0,12)||ico(m))}</span>`}</div>`;
}
function opts(sel){return S.subs.map(s=>{const ms=S.mats.filter(m=>m.sid==s.id);return ms.length?`<optgroup label="${s.icon||'📘'} ${esc(s.name)}">${ms.map(m=>`<option value="${m.id}" ${m.id==sel?'selected':''}>${esc(m.title)}</option>`).join('')}</optgroup>`:''}).join('')}
const wake=()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch(e){}};
const unwake=()=>{try{wl&&wl.release();wl=null}catch(e){}};

/* 画像登録・リサイズ圧縮（長辺600px / JPEG 0.78） */
function pickPhoto(target){
  photoTarget=target;
  const inp=$('ph');inp.value='';inp.click();
}
function onPhoto(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{
    URL.revokeObjectURL(url);
    const c=document.createElement('canvas'),maxSide=600,scale=Math.min(1,maxSide/Math.max(img.width,img.height));
    c.width=Math.max(1,Math.round(img.width*scale));
    c.height=Math.max(1,Math.round(img.height*scale));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const dataUrl=c.toDataURL('image/jpeg',0.78);
    if(photoTarget==='new'){
      md.cover=dataUrl;
    }else if(photoTarget){
      const m=mat(photoTarget);
      if(m){m.cover=dataUrl;save()}
    }
    photoTarget=null;
    render();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);photoTarget=null};
  img.src=url;
}
function clearCover(target){
  if(target==='new'){md.cover='';render();return}
  const m=mat(target);if(!m)return;
  askDel('表紙画像を削除しますか？',`「${m.title}」の表紙画像を削除します。`,()=>{m.cover='';save();render()});
}

/* タイマー */
function toggle(){const t=S.timer;if(!t){const mid=S.sel||(S.mats[0]&&S.mats[0].id);if(!mid)return;S.sel=mid;S.timer={mid,acc:0,at:Date.now(),st:Date.now()};wake()}
else if(t.at){t.acc=el();t.at=null;unwake()}else{t.at=Date.now();wake()}save();render()}
function finish(){const t=S.timer,s=Math.round(el());S.timer=null;unwake();if(s>=1){ed={id:null,fin:1,mid:t.mid,t:t.st,sec:s,amt:'',fr:'',to:'',focus:0,memo:''};tab='log'}save();render()}
function tick(){if($('clock'))$('clock').textContent=clk(el());if($('mclk'))$('mclk').textContent=clk(el());
if($('gp')){const w=weekTotal(),g=S.goal*3600,td=todayTotal(),dg=DG()*60,mn=Math.max(1,MN())*60,p=Math.min(100,w/g*100);
$('rg').style.background=`conic-gradient(${p>=100?'#059669':'var(--ac)'} ${p}%,var(--bd) 0)`;$('gt').textContent=hmFull(w);$('gr').textContent=Math.round(w/g*100)+'%';
if($('kpi_td'))$('kpi_td').textContent=hm(td);
if($('kpi_mo'))$('kpi_mo').textContent=Math.round(monthTotal()/3600)+'時間';
if($('kpi_al'))$('kpi_al').textContent=Math.round(allTotal()/3600)+'時間';
$('gp').style.width=(dg?Math.min(100,td/dg*100):0)+'%';$('dg').textContent=dg?`${hm(td)} / ${hm(dg)}`:'未設定';
$('st_num').textContent=streak();
$('ml').textContent=td>=mn?'✓ 今日の連続日数キープ済み':`あと${Math.ceil((mn-td)/60)}分で連続キープ`}
chk()}
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();if(S.timer&&S.timer.at)wake()}});
function setGoal(v){S.goal=Math.max(.5,+v||1);if($('gl_lbl'))$('gl_lbl').textContent=S.goal;save();tick()}
function setDGoal(v){S.dgoal=Math.max(0,+v||0);save();tick()}
function setMinDay(v){S.minDay=Math.max(0,+v||0);save();tick()}

function selectMat(id){if(S.timer)return;S.sel=id;save();render()}
function shelfHTML(selId,onSelectFn){
  if(!S.mats.length)return '<div class="sub" style="margin-bottom:10px">「設定」タブから教材を追加してください</div>';
  const order=[];
  [...S.logs].sort((a,b)=>b.t-a.t).forEach(l=>{if(mat(l.mid)&&!order.includes(l.mid))order.push(l.mid)});
  S.mats.forEach(m=>{if(!order.includes(m.id))order.push(m.id)});
  return `<div class="shelf">${order.map(id=>{const m=mat(id);return `<div class="shelf-it ${selId==id?'on':''}" onclick="${onSelectFn}(${id})">${cover(m)}<span>${esc(m.title)}</span></div>`}).join('')}</div>`;
}

/* ホーム */
function vHome(){const t=S.timer,run=t&&t.at,curId=t?t.mid:(S.sel||(S.mats[0]&&S.mats[0].id)),cur=mat(curId);
const wStart=wk(0),wEnd=new Date(wStart.getTime()+6048e5-1);
return `<div class="card"><h2><span>今週の目標</span><span>${wStart.getMonth()+1}/${wStart.getDate()}〜${wEnd.getMonth()+1}/${wEnd.getDate()}</span></h2>
<div class="row" style="align-items:center;margin-bottom:10px"><div class="ring" id="rg" style="flex:none"><span id="gr">0%</span></div><div style="flex:1"><div class="sub">目標 <span id="gl_lbl">${S.goal}</span>時間 ／ 連続 <span id="st_num">${streak()}</span>日</div><div class="big" id="gt">0分</div><div class="sub" id="ml" style="margin-top:2px"></div></div></div>
<div class="kpis"><div><span class="sub">今日</span><b id="kpi_td">0分</b></div><div><span class="sub">今月</span><b id="kpi_mo">0時間</b></div><div><span class="sub">累計</span><b id="kpi_al">0時間</b></div></div>
<div class="sub">今日の目標 <span id="dg"></span></div><div class="bar"><i id="gp" style="background:#f59e0b"></i></div>
<div class="row" style="margin-top:10px"><div><div class="sub">週目標（時間）</div><input type="number" min="0.5" step="0.5" value="${S.goal}" oninput="setGoal(this.value)" style="margin:0"></div><div><div class="sub">1日目標（分）</div><input type="number" min="0" step="5" value="${DG()}" oninput="setDGoal(this.value)" style="margin:0"></div><div><div class="sub">最低ライン（分）</div><input type="number" min="0" step="5" value="${MN()}" oninput="setMinDay(this.value)" style="margin:0"></div></div></div>${subWeek()}
<div class="card"><h2><span>タイマー</span>${cur?`<span style="color:${col(cur)}">● ${esc(cur.title)}</span>`:''}</h2><div class="clock" id="clock">00:00:00</div>
${shelfHTML(curId,'selectMat')}
<div class="row"><button onclick="toggle()" ${S.mats.length?'':'disabled'}>${run?'一時停止':t?'再開':'スタート'}</button>${t?'<button class="r" onclick="finish()">終了して記録</button>':'<button class="g" onclick="openManualLog()">手動で記録</button>'}</div></div>`}

/* 記録 */
function setT(d,t){if(t)ed.nt=0;d=d||dk(ed.t);t=t||tm(ed.t);ed.t=new Date(d+'T'+t).getTime()||ed.t}
function selEdMat(id){ed.mid=id;render()}
function vForm(){const e=ed,m=mat(e.mid),pv=prevTo();
return `<div class="card"><h2>${e.id?'記録を編集':e.fin?'記録を保存':'教材を選んで記録'}</h2>
${shelfHTML(e.mid,'selEdMat')}
<div class="row"><input type="date" value="${dk(e.t)}" oninput="setT(this.value,null)"><input type="time" value="${tm(e.t)}" oninput="setT(null,this.value)"></div>
<div class="sub" style="margin-bottom:4px">学習時間（分）</div>
<input type="number" min="0" placeholder="分" value="${Math.round(e.sec/60)}" oninput="ed.sec=+this.value*60">
<div class="sub" style="margin-bottom:4px">量（${m?m.unit:''}）</div>
<div class="row" style="align-items:center;margin-bottom:8px">${[-5,-1].map(d=>`<button type="button" class="g" style="flex:none;padding:10px" onclick="stp(${d})">${d}</button>`).join('')}<input id="ed_amt" type="number" min="0" value="${e.amt??''}" oninput="onAmt(this.value)" style="margin:0;text-align:center">${[1,5].map(d=>`<button type="button" class="g" style="flex:none;padding:10px" onclick="stp(${d})">＋${d}</button>`).join('')}</div>
<div class="row"><input id="ed_fr" type="number" placeholder="開始位置${pv!=null?'（'+(pv+1)+'）':''}" value="${e.fr??''}" oninput="setFr(this.value)"><input id="ed_to" type="number" placeholder="終了位置" value="${e.to??''}" oninput="setTo(this.value)"></div>
<div class="sub" style="margin-bottom:4px">集中度</div><div class="seg">${[1,2,3].map(n=>`<button type="button" class="${e.focus==n?'on':''}" onclick="ed.focus=ed.focus==${n}?0:${n};render()">${['△ いまいち','○ ふつう','◎ 集中'][n-1]}</button>`).join('')}</div>
<input placeholder="メモ" value="${esc(e.memo||'')}" oninput="ed.memo=this.value">
<div class="row"><button onclick="saveEd()">保存</button><button class="g" onclick="ed=null;render()">キャンセル</button></div>${e.id?`<button type="button" class="g" style="width:100%;margin-top:8px;color:#e5484d;border-color:#e5484d44" onclick="reqDelLog(${e.id})">この記録を削除</button>`:""}</div>`}
function prevTo(){const m=mat(ed.mid),ls=S.logs.filter(x=>x.mid==ed.mid&&x.to!=null&&x.id!=ed.id&&x.t<=ed.t);return ls.length?Math.max(...ls.map(x=>x.to)):(m&&(m.from>1||m.total)?(m.from||1)-1:null)}
function stp(d){
  const next=Math.max(0,(+ed.amt||0)+d);
  ed.amt=next;
  const pv=prevTo(),fr=(ed.fr!==''&&ed.fr!=null)?+ed.fr:(pv!=null?pv+1:null);
  if(fr!=null&&next>0){ed.to=fr+next-1;if($('ed_to'))$('ed_to').value=ed.to}
  if($('ed_amt'))$('ed_amt').value=ed.amt;
}
function onAmt(v){
  ed.amt=v;
  if(v!==''&&+v>0&&(ed.fr!==''&&ed.fr!=null)){
    ed.to=+ed.fr+(+v)-1;
    if($('ed_to'))$('ed_to').value=ed.to;
  }
}
function rc(){const pv=prevTo(),fr=ed.fr!==''&&ed.fr!=null?+ed.fr:(pv!=null?pv+1:null);if(fr!=null&&ed.to!==''&&ed.to!=null){ed.amt=Math.max(0,+ed.to-fr+1);if($('ed_amt'))$('ed_amt').value=ed.amt}}
function setTo(v){ed.to=v;rc()}
function setFr(v){ed.fr=v;rc()}
let _u=0;const uid=()=>{_u=Math.max(_u+1,Date.now());return _u};
function resFr(e){if(e.to===''||e.to==null)return null;if(e.fr!==''&&e.fr!=null)return +e.fr;if(e.amt!==''&&e.amt!=null&&+e.amt>0)return +e.to-+e.amt+1;const pv=prevTo();if(pv!=null)return pv+1;return null}

/* 振り返り（Studyplus風の教材色分け積み上げグラフ＋期間自動ジャンプ＋教材別マトリクス表） */
function jumpLatest(){
  if(!S.logs.length)return;
  const maxT=Math.max(...S.logs.map(l=>l.t));
  if(mode==='day'){
    const w0=wk(0).getTime(),d=new Date(maxT);d.setHours(0,0,0,0);
    const wMax=d.getTime()-((d.getDay()+6)%7)*864e5;
    off=Math.round((wMax-w0)/6048e5);
  }else if(mode==='week'){
    const w0=wk(0).getTime(),d=new Date(maxT);d.setHours(0,0,0,0);
    const wMax=d.getTime()-((d.getDay()+6)%7)*864e5;
    off=Math.min(0,Math.round((wMax-w0)/6048e5));
  }else{
    const n=new Date(),d=new Date(maxT);
    off=(d.getFullYear()-n.getFullYear())*12+(d.getMonth()-n.getMonth());
  }
}
function range(){
  let a,b,bk=[];
  if(mode==='day'){
    /* 日モード：1週間分の7日間推移 */
    a=wk(off);
    for(let i=0;i<7;i++){
      const s=a.getTime()+i*864e5,d=new Date(s);
      bk.push([s,s+864e5,`${d.getMonth()+1}/${d.getDate()}`,DW[d.getDay()]]);
    }
    b=new Date(a.getTime()+6048e5);
    const e=new Date(b-1);
    return{a:a.getTime(),b:b.getTime(),bk,label:`${a.getFullYear()}年${a.getMonth()+1}月${a.getDate()}日〜${e.getMonth()+1}月${e.getDate()}日`};
  }
  if(mode==='week'){
    /* 週モード：直近7週間分の週次推移（Studyplus風） */
    const endWk=wk(off),startWk=wk(off-6);
    for(let i=0;i<7;i++){
      const w=wk(off-6+i),s=w.getTime();
      bk.push([s,s+6048e5,`${w.getMonth()+1}/${w.getDate()}`,'']);
    }
    const e=new Date(endWk.getTime()+6048e5-1);
    return{a:startWk.getTime(),b:endWk.getTime()+6048e5,bk,label:`${startWk.getFullYear()}年${startWk.getMonth()+1}月${startWk.getDate()}日〜${e.getMonth()+1}月${e.getDate()}日`};
  }
  /* 月モード：月内の日別推移 */
  const n=new Date();a=new Date(n.getFullYear(),n.getMonth()+off,1);b=new Date(a.getFullYear(),a.getMonth()+1,1);const dn=Math.round((b-a)/864e5);
  for(let i=0;i<dn;i++)bk.push([new Date(a.getFullYear(),a.getMonth(),i+1).getTime(),new Date(a.getFullYear(),a.getMonth(),i+2).getTime(),(i==0||(i+1)%5==0)?i+1+'':'','']);
  return{a:a.getTime(),b:b.getTime(),bk,label:`${a.getFullYear()}年${a.getMonth()+1}月`};
}
function filterLogs(ls){return fmat==='all'?ls:ls.filter(l=>l.mid==fmat)}
function stackedBars(bk,matOrder){
  const totals=bk.map(x=>sm(filterLogs(inR(x[0],x[1]))));
  const mx=Math.max(...totals,1);
  return `<div class="chart">${bk.map((x,i)=>{
    const ls=filterLogs(inR(x[0],x[1])),t=totals[i];
    const byM={};ls.forEach(l=>byM[l.mid]=(byM[l.mid]||0)+l.sec);
    const segs=matOrder.filter(id=>byM[id]>0).map(id=>`<i style="height:${byM[id]/t*100}%;background:${col(mat(id))}"></i>`).join('');
    const hPct=t?Math.max(4,t/mx*100):2;
    const showLbl=t>0&&(bk.length<=7||t===mx);
    return `<div class="col"><div class="vl">${showLbl?hm(t):''}</div><div class="stk" style="height:${hPct}%;${t?'':'opacity:.25'}">${segs}</div><div class="lb">${x[2]}</div></div>`;
  }).join('')}</div>`;
}
function matSummaryList(pm,tot,ls){

    const m=mat(id),pct=tot?Math.round(o.s/tot*100):0,cnt=ls.filter(l=>l.mid==id).length;
    return `<div class="mitem">${cover(m)}<div class="mitem-main"><div class="mitem-top"><b>${esc(m?m.title:'削除済み')}</b><span>${hm(o.s)}</span></div><div class="mitem-bar"><i style="width:${Math.max(2,pct)}%;background:${col(m)}"></i></div><div class="mitem-sub">${pct}% ／ ${cnt}回${o.a?' ／ '+o.a+(m?m.unit:''):''}</div></div></div>`;
  }).join('')}</div>`;
}
function monthSummaryList(){
  const n=new Date(),byM={};
  filterLogs(S.logs).forEach(l=>{
    const d=new Date(l.t),k=d.getFullYear()+'-'+p2(d.getMonth()+1);
    if(!byM[k])byM[k]={y:d.getFullYear(),m:d.getMonth(),s:0,days:new Set()};
    byM[k].s+=l.sec;byM[k].days.add(dk(l.t));
  });
  const cur=new Date(n.getFullYear(),n.getMonth()+off,1),curK=cur.getFullYear()+'-'+p2(cur.getMonth()+1);
  if(!byM[curK])byM[curK]={y:cur.getFullYear(),m:cur.getMonth(),s:0,days:new Set()};
  const rows=Object.entries(byM).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12);
  const mx=Math.max(...rows.map(x=>x[1].s),1);
  return `<div class="mo-list"><div class="sub" style="margin-bottom:4px">月別の学習時間（タップで表示月を切替）</div>${rows.map(([k,o])=>{
    const oVal=(o.y-n.getFullYear())*12+(o.m-n.getMonth());
    return `<div class="mo-row ${k===curK?'on':''}" onclick="off=${oVal};ptxt='';render()"><div class="mo-lbl">${o.y}年${o.m+1}月</div><div class="mo-bar"><i style="width:${o.s?Math.max(3,o.s/mx*100):0}%"></i></div><div class="mo-val">${o.s?hm(o.s):'0分'}</div></div>`;
  }).join('')}</div>`;
}
function hours(ls){const h=Array(24).fill(0);ls.filter(l=>!l.nt).forEach(l=>{let c=l.t;const e=l.t+l.sec*1000;while(c<e){const d=new Date(c),n=new Date(c);n.setHours(d.getHours()+1,0,0,0);const k=Math.min(e,n.getTime())-c;h[d.getHours()]+=k/1000;c+=k}});return h}
function bars(v,lb,hi){const mx=Math.max(...v,1);return `<div class="chart" style="height:110px;padding-top:4px">${v.map((x,i)=>`<div class="col"><div class="stk" style="height:${x?Math.max(4,x/mx*100):2}%;background:${hi===i?'#f59e0b':'var(--ac)'};${x?'':'opacity:.2'}"></div><div class="lb">${lb[i]}</div></div>`).join('')}</div>`}
function perMat(ls){const p={};ls.forEach(l=>{const o=p[l.mid]=p[l.mid]||{s:0,a:0,f:[]};o.s+=l.sec;if(l.amt!=null)o.a+=l.amt;if(l.focus)o.f.push(l.focus)});return Object.entries(p).sort((x,y)=>y[1].s-x[1].s)}
const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'-';

/* CSV・表インポート */
const GK=[['d','日付',/日付|日|date|day/i],['s','開始時刻',/開始|start/i],['m','教材',/教材|参考書|タイトル|名称|material|title|name/i],['t','時間',/時間|分|duration|time/i],['a','量',/量|ページ|問|amount|page/i],['n','メモ',/メモ|コメント|memo|comment|note/i],['c','科目',/カテゴリ|科目|category|subject/i]];
function csv(t){const d=t.split('\n')[0].includes('\t')?'\t':',',R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const x=t[i];if(q){if(x=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=x}else if(x=='"')q=true;else if(x==d){r.push(c);c=''}else if(x=='\n'||x=='\r'){if(x=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(z=>z.trim()))R.push(r);r=[]}else c+=x}r.push(c);if(r.some(z=>z.trim()))R.push(r);return R}
function pd(d,s){d=(d||'').trim();const m=d.match(/(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})/);if(!m)return null;const k=((s||'')+' '+d).match(/(\d{1,2}):(\d{2})/);return{t:new Date(+m[1],m[2]-1,+m[3],k?+k[1]:12,k?+k[2]:0).getTime(),nt:!k}}
function pdur(v,u){v=(v||'').trim();if(!v)return 0;const m=v.match(/^(\d+):(\d{2})(?::(\d{2}))?$/);if(m)return +m[1]*3600+ +m[2]*60+(m[3]?+m[3]:0);if(/[時分秒]/.test(v)){const h=v.match(/(\d+(?:\.\d+)?)\s*時間/),mi=v.match(/(\d+(?:\.\d+)?)\s*分/),s=v.match(/(\d+(?:\.\d+)?)\s*秒/);return Math.round((h?+h[1]*3600:0)+(mi?+mi[1]*60:0)+(s?+s[1]:0))}return isNaN(+v)?0:Math.round(+v*u)}
function imLoad(text){im.text=text;im.rows=csv(text);im.map={};im.done='';const h=im.rows[0]||[],used=new Set();GK.forEach(([k,,re])=>{const i=h.findIndex((x,j)=>!used.has(j)&&re.test(x));if(i>=0){im.map[k]=i;used.add(i)}});prep();render()}
async function impFile(inp){const f=inp.files[0];if(!f)return;const b=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){t=new TextDecoder('shift_jis').decode(b)}imLoad(t.replace(/^\uFEFF/,''))}
function prep(){const R=im.rows;if(!R||R.length<2){im.out=null;return}const M=im.map,has=k=>M[k]!=null,ok=[];let bad=0;
R.slice(1).forEach(r=>{const dt=pd(has('d')?r[M.d]:'',has('s')?r[M.s]:''),sec=pdur(has('t')?r[M.t]:'',+im.unit);if(!dt||!(sec>0)){bad++;return}ok.push({title:has('m')?(r[M.m]||'').trim():'',t:dt.t,nt:dt.nt,sec,amt:has('a')&&r[M.a]!==''&&r[M.a]!=null&&!isNaN(+r[M.a])?+r[M.a]:null,memo:has('n')?(r[M.n]||'').trim():'',cat:has('c')?(r[M.c]||'').trim():''})});
const ex=new Set(S.logs.map(l=>l.mid+'|'+(l.nt?dk(l.t):l.t)+'|'+l.sec));
im.out=ok.filter(o=>{const m=S.mats.find(x=>x.title==(o.title||'（教材不明）'));return !(m&&ex.has(m.id+'|'+(o.nt?dk(o.t):o.t)+'|'+o.sec))});im.dup=ok.length-im.out.length;im.bad=bad}
function doImport(){if(!im.out||!im.out.length)return;
im.out.forEach((o,i)=>{const title=o.title||'（教材不明）';let m=S.mats.find(x=>x.title==title);if(!m){const cn=o.cat||(title.includes('高校入試')?'カテゴリなし':'教員免許認定試験');let sb=S.subs.find(s=>s.name==cn);if(!sb){sb={id:uid(),name:cn,color:COL[S.subs.length%COL.length],icon:'📘'};S.subs.push(sb)}m={id:uid(),sid:sb.id,title,unit:'ページ',cover:'',color:COL[S.mats.length%COL.length]};S.mats.push(m)}
S.logs.push({id:uid()+i,mid:m.id,t:o.t,sec:o.sec,amt:o.amt,to:null,fr:null,focus:0,memo:o.memo,nt:o.nt?1:0})});
if(!S.sel&&S.mats.length)S.sel=S.mats[0].id;const n=im.out.length;im={text:'',rows:null,map:{},unit:'60',out:null,done:n+'件を取り込みました'};save();render()}
function vImp(){const R=im.rows,h=R?R[0]:[];
return `<div class="card"><h2>データ取り込み（CSV・TSV）</h2>${im.done?`<div style="margin-bottom:8px"><b>${im.done}</b></div>`:''}
<button class="g" onclick="$('imf').click()" style="width:100%;margin-bottom:8px">ファイルを選択</button><input id="imf" type="file" accept=".csv,.tsv,.txt,text/*" style="display:none" onchange="impFile(this)">
<textarea placeholder="CSVまたは表データを貼り付け（1行目は見出し）" oninput="im.text=this.value">${esc(im.text)}</textarea>
<button class="g" onclick="imLoad(im.text)" style="width:100%;margin-bottom:8px">読み込んで確認</button>
${R?`<div class="sub" style="margin-bottom:4px">列の割り当て</div>${GK.map(([k,lb])=>`<div class="row" style="align-items:center"><div class="sub" style="flex:none;width:110px">${lb}</div><select onchange="im.map['${k}']=this.value===''?null:+this.value;prep();render()"><option value="">なし</option>${h.map((x,i)=>`<option value="${i}" ${im.map[k]===i?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`).join('')}
<div class="row" style="align-items:center"><div class="sub" style="flex:none;width:110px">時間の単位</div><select onchange="im.unit=this.value;prep();render()">${[['60','分'],['1','秒'],['3600','時間']].map(([v,l])=>`<option value="${v}" ${im.unit==v?'selected':''}>${l}</option>`).join('')}</select></div>
${im.out?`<div style="margin:8px 0">対象 <b>${im.out.length}件</b>${im.dup?`（重複スキップ ${im.dup}件）`:''}${im.bad?`／除外 ${im.bad}件`:''}</div><div class="sub" style="margin-bottom:8px">${im.out.slice(0,3).map(o=>`${dk(o.t)} ${esc(o.title||'（教材不明）')} ${hm(o.sec)}`).join('<br>')}</div><button onclick="doImport()" style="width:100%" ${im.out.length?'':'disabled'}>取り込む</button>`:''}`:''}</div>`}

/* 教材編集・色変更・進捗計算 */
function rg(l){if(l.to==null)return null;const b=l.to,a=l.fr!=null?l.fr:(l.amt!=null?b-l.amt+1:b);return[Math.min(a,b),Math.max(a,b)]}
function cov(m){const a0=m.from||1,b0=m.total;if(!b0||b0<a0)return null;const n=b0-a0+1,d=new Array(n+2).fill(0),t14=Date.now()-14*864e5;let amt=0,sec=0,rec=0;
S.logs.forEach(l=>{if(l.mid!=m.id)return;if(l.amt!=null){amt+=l.amt;if(l.amt>0)sec+=l.sec;if(l.t>=t14)rec+=l.amt}const r=rg(l);if(r){const s=Math.max(r[0],a0)-a0,e=Math.min(r[1],b0)-a0;if(e>=s){d[s]++;d[e+1]--}}});
const c=[];let x=0,c1=0,c2=0;for(let i=0;i<n;i++){x+=d[i];c.push(x);if(x>=1)c1++;if(x>=2)c2++}return{n,c,c1,c2,amt,sec,rec,laps:amt/n}}
function pgi(m){const c=cov(m);if(!c)return null;const L=m.laps||1,rem=Math.max(0,c.n*L-c.amt),ls=S.logs.filter(l=>l.mid==m.id),first=ls.length?Math.min(...ls.map(l=>l.t)):Date.now(),span=Math.max(1,Math.min(14,(Date.now()-first)/864e5)),pace=c.rec/span,mpu=c.amt>0?c.sec/c.amt:0,dl=m.dl?Math.ceil((new Date(m.dl+'T23:59:59')-Date.now())/864e5):null;return{...c,L,rem,pace,mpu,dl}}
function pg(m){const c=cov(m);return `<div class="sub" style="font-size:10px"><b style="color:${col(m)}">●</b> ${hm(sm(S.logs.filter(l=>l.mid==m.id)))}${c?' '+Math.round(c.c1/c.n*100)+'%':''}</div>`}
function setM(k,v){const m=mat(pe);if(!m)return;if(k==='title'||k==='unit'||k==='dl'||k==='color')m[k]=v;else if(k==='sid')m.sid=+v;else m[k]=v===''?null:+v;save();if(k==='color'||k==='sid')render()}
function vPe(){const m=pe&&mat(pe);if(!m)return '';const mc=col(m);return `<div class="card"><h2>教材の編集・色・進捗設定</h2>
<div class="row" style="align-items:flex-start;gap:12px;margin-bottom:8px">

  </div>
</div>
<div class="row"><div><div class="sub">開始位置</div><input type="number" min="0" value="${m.from??''}" placeholder="1" oninput="setM('from',this.value)"></div><div><div class="sub">終了位置（全体量）</div><input type="number" min="1" value="${m.total??''}" oninput="setM('total',this.value)"></div></div>

function prog(){const L=S.mats.filter(m=>m.total).map(m=>[m,pgi(m)]).filter(x=>x[1]);
if(!L.length)return '';
return `<div class="card"><h2>教材の進捗</h2>${L.map(([m,p])=>{const nb=Math.min(p.n,40);let st='';for(let k=0;k<nb;k++){const a=Math.floor(k*p.n/nb),b=Math.floor((k+1)*p.n/nb),w=Math.max(1,b-a);let c1=0,c2=0;for(let i=a;i<b;i++){if(p.c[i]>=1)c1++;if(p.c[i]>=2)c2++}const f=c1/w,g=c2/w>=.5;st+=`<i style="background:${f<.05?'var(--bd)':g?'#059669':col(m)};${f>=.05&&!g?'opacity:'+(.35+.65*f):''}"></i>`}
const fin=p.pace>0?new Date(Date.now()+p.rem/p.pace*864e5):null,ok=p.pace*Math.max(0,p.dl)>=p.rem;
return `<div style="margin:12px 0 16px"><div class="row" style="align-items:center;gap:10px">${cover(m)}<div style="flex:1"><div><b>${esc(m.title)}</b> <span class="sub">${m.from||1}〜${m.total}${m.unit}</span></div><div class="st">${st}</div>
<div class="sub">カバー率 <b>${Math.round(p.c1/p.n*100)}%</b>（2周以上 ${Math.round(p.c2/p.n*100)}%）／ ${p.laps.toFixed(1)}周（目標${p.L}周）</div>
<div class="sub">残り ${Math.round(p.rem)}${m.unit}${p.mpu?'（約'+hm(p.rem*p.mpu)+'）':''}${p.pace>0?' ／ '+p.pace.toFixed(1)+m.unit+'/日 → '+(p.rem<=0?'達成済み':'予測 '+(fin.getMonth()+1)+'/'+fin.getDate()):''}</div>
${m.dl&&p.rem>0?`<div class="sub" style="font-weight:600;color:${ok?'#059669':'#e5484d'}">期限 ${m.dl.slice(5).replace('-','/')}（残${Math.max(0,p.dl)}日）：1日 ${(p.rem/Math.max(1,p.dl)).toFixed(1)}${m.unit}必要${ok?'（順調）':'（ペース不足）'}</div>`:''}</div></div></div>`}).join('')}</div>`}

function progLines(){const o=S.mats.filter(m=>m.total).map(m=>[m,pgi(m)]).filter(x=>x[1]);if(!o.length)return 'なし（範囲未設定）';return o.map(([m,p])=>`・${m.title}：範囲${m.from||1}〜${m.total}${m.unit}、カバー率${Math.round(p.c1/p.n*100)}%、${p.laps.toFixed(1)}周（目標${p.L}周）、残り${Math.round(p.rem)}${m.unit}${p.pace>0?'、最近'+p.pace.toFixed(1)+m.unit+'/日':''}${m.dl?'、期限'+m.dl:''}`).join('\n')}
function fb(){const t0=Date.now()-60*864e5,B=Array.from({length:8},()=>[]);S.logs.forEach(l=>{if(l.focus&&!l.nt&&l.t>=t0)B[Math.floor(new Date(l.t).getHours()/3)].push(l.focus)});return B}
const av2=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function fLines(){return fb().map((a,i)=>a.length?`${i*3}〜${i*3+3}時:平均${av2(a).toFixed(1)}（${a.length}回）`:'').filter(Boolean).join('、')||'集中度の記録なし'}
function fcard(){const B=fb(),av=B.map(av2);if(!B.some(a=>a.length))return '';let bi=-1,bv=0;av.forEach((v,i)=>{if(B[i].length>=2&&v>bv){bv=v;bi=i}});
return `<div class="card"><h2>時間帯ごとの集中度（直近60日）</h2>${bi>=0?`<div><b>高集中時間帯：${bi*3}〜${bi*3+3}時（平均 ${bv.toFixed(1)} / 3）</b></div>`:''}${bars(av,av.map((_,i)=>i*3+'' ),bi)}</div>`}

function heat(){const m=dayMap(),n=new Date();n.setHours(0,0,0,0);const st=wk(-14),dg=DG()*60,mn=Math.max(1,MN())*60,tk=dk(n);let h='',days=0;
const mStart=new Date(n.getFullYear(),n.getMonth(),1),mEnd=new Date(n.getFullYear(),n.getMonth()+1,0);
for(let d=new Date(mStart);d<=n;d.setDate(d.getDate()+1)){if((m[dk(d)]||0)>0)days++}
for(let i=0;i<105;i++){const d=new Date(st);d.setDate(st.getDate()+i);const k=dk(d),s=m[k]||0,o=s==0?0:s<mn?.3:s<dg*.6?.55:s<dg?.8:1;
h+=`<i style="${d>n?'visibility:hidden':`background:${o?'var(--ac)':'var(--bd)'};opacity:${o||1}`}${k==tk?';outline:2px solid var(--tx)':''}"></i>`}

const nm={id:uid(),sid:+md.sid,title:md.title.trim(),unit:md.unit,cover:md.cover,color:md.color||COL[S.mats.length%COL.length]};
S.mats.push(nm);if(!S.sel)S.sel=nm.id;md={sid:md.sid,title:'',unit:md.unit,cover:'',color:'',msg:'',ns:''};showAddMat=false;save();toast('教材を追加しました');render()}
function delMat(id){if(pe==id)pe=null;S.mats=S.mats.filter(m=>m.id!=id);S.logs=S.logs.filter(l=>l.mid!=id);if(S.timer&&S.timer.mid==id){S.timer=null;unwake()}if(S.sel==id)S.sel=S.mats[0]?S.mats[0].id:null;save();render()}

/* ハイブリッドJSONバックアップ */
function bkData(){return JSON.stringify({app:'studylog',v:4,exportedAt:new Date().toISOString(),subs:S.subs,mats:S.mats,logs:S.logs,goal:S.goal,dgoal:S.dgoal,minDay:S.minDay,cel:S.cel})}
function exp(){const d=bkData(),t=$('bk');if(t){t.value=d;t.select()}try{navigator.clipboard.writeText(d).then(()=>toast('コピーしました')).catch(()=>document.execCommand('copy'))}catch(e){try{document.execCommand('copy')}catch(_){}}}
async function expFile(){
  const data=bkData(),t=$('bk');if(t)t.value=data;
  const fname='studylog_backup_'+dk(Date.now()).replace(/-/g,'')+'.json';
  const blob=new Blob([data],{type:'application/json'});
  try{
    const file=new File([blob],fname,{type:'application/json'});
    if(location.protocol==='file:'&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:fname});
      return;
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    const a=document.createElement('a'),url=URL.createObjectURL(blob);
    a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){}
}
async function impFile2(inp){const f=inp.files[0];if(!f)return;$('bk').value=await f.text();imp();inp.value=''}
function imp(){
  try{
    const o=JSON.parse($('bk').value);
    if(!Array.isArray(o.logs)||!Array.isArray(o.mats))throw 0;
    unwake();
    S={subs:o.subs||[],mats:o.mats,logs:o.logs,goal:o.goal||14,dgoal:o.dgoal??60,minDay:o.minDay??15,cel:o.cel||{},timer:null,sel:o.mats[0]?o.mats[0].id:null};
    ensureColors();
    save();toast('バックアップを復元しました');render();
  }catch(e){toast('データの形式が正しくありません')}
}

function render(){
  const sh=S.timer&&tab!=='home',mi=$('mini');
  if(sh){const m=mat(S.timer.mid);mi.innerHTML=`<div><b>${m?esc(m.title):''}</b><span id="mclk">${clk(el())}</span></div><button onclick="toggle()">${S.timer.at?'⏸':'▶'}</button><button class="r" onclick="finish()">終了</button>`}
  mi.style.display=sh?'flex':'none';
  document.body.style.paddingTop=sh?'78px':'12px';
  $('v').innerHTML={home:vHome,log:vLog,stat:vStat,mat:vMat}[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  tick();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  if(tab==='stat'&&!inR(range().a,range().b).length)jumpLatest();
  render();
});
