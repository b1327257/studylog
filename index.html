<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2233;--sub:#7a8199;--ac:#4f6bed;--bd:#e4e7f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--tx:#e8eaf3;--sub:#8b92ab;--ac:#7c93ff;--bd:#2b3042;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--tx:#e8eaf3;--sub:#8b92ab;--ac:#7c93ff;--bd:#2b3042;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:14px 14px 90px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:14px;color:var(--sub);margin:0 0 10px;font-weight:600}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.r{background:#e5484d}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin-bottom:8px}
.clock{font-size:52px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 12px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:26px;font-weight:700}.sub{color:var(--sub);font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;background:none;color:var(--sub);border-radius:0;padding:14px 4px;font-size:13px}nav button.on{color:var(--ac)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;background:none;color:var(--sub);padding:8px}.seg button.on{background:var(--card);color:var(--tx)}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.chart i{width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}.chart span{font-size:10px;color:var(--sub);height:14px;white-space:nowrap}
.nv{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.nv button{padding:6px 14px}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative}.donut:after{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--card)}
.lg{display:flex;align-items:center;gap:6px;font-size:13px;margin:5px 0}.lg b{width:10px;height:10px;border-radius:3px;flex:none}.lg em{margin-left:auto;font-style:normal;color:var(--sub);white-space:nowrap}
.cv{width:44px;height:58px;border-radius:6px;position:relative;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;box-shadow:0 2px 6px #00000018}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv-btn{cursor:pointer;position:relative}
.cv-btn::after{content:"📷";position:absolute;right:4px;bottom:4px;font-size:12px;background:#0009;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.it:last-child{border:0}
.it>div:nth-child(2),.it>div:nth-child(1):not(.cv){min-width:0}.it>div:nth-child(2){flex:1}
.it button{padding:5px 9px;font-size:12px}.dh{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:12px 0 2px}
textarea{min-height:110px;font-size:12px}
#mini{position:fixed;top:0;left:0;right:0;z-index:5;display:none;align-items:center;gap:8px;background:var(--ac);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px}
#mini>div{flex:1;min-width:0}#mini b{display:block;font-size:12px;opacity:.9;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#mini span{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}#mini button{background:#ffffff33;padding:8px 12px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bk{text-align:center;font-size:12px;min-width:0}.bk .cv{width:100%;height:auto;aspect-ratio:3/4;font-size:34px;border-radius:10px;margin-bottom:6px}.bk b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qk{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}.qk button{flex:none;display:flex;align-items:center;gap:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:6px 10px;max-width:75%}
.qk .cv{width:26px;height:34px;font-size:14px;border-radius:4px}
.sw{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid var(--bd)}
.ring{width:92px;height:92px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--bd)}.ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}.ring span{position:relative}
.hm{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-template-columns:repeat(15,1fr);gap:3px}.hm i{aspect-ratio:1;border-radius:3px;display:block}
.st{display:flex;gap:1px;height:14px;margin:6px 0}.st i{flex:1;border-radius:2px;display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;display:none;align-items:center;gap:10px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;white-space:nowrap}#toast button{padding:4px 10px;background:var(--ac);color:#fff}
#cel{position:fixed;inset:0;z-index:30;display:none;pointer-events:none;overflow:hidden}#cel .cb{position:absolute;left:50%;top:28%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px 26px;text-align:center;box-shadow:0 8px 30px #0004;animation:pop .4s}#cel i{position:absolute;top:-30px;font-style:normal;font-size:22px;animation:fall 2.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
</style></head><body>

<script>
const K='studylog2',DB_NAME='StudyLogDB',DB_STORE='state',COL=['#4f6bed','#e5484d','#22a06b','#f59f00','#9c5de4','#0ea5b7','#e8590c','#7a8199'],DW='日月火水木金土';
let S={subs:[],mats:[],logs:[],goal:10,dgoal:60,minDay:15,timer:null,sel:null,cel:{}},dbRef=null,photoTarget=null;
let tab='home',mode='week',off=0,ed=null,pu=0,md={sid:'',title:'',unit:'ページ',cover:'',msg:'',ns:''},wl,ptxt='',pe=null,es=null,us=null,ut,ct;
let im={text:'',rows:null,map:{},unit:'60',out:null,done:''};

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),clk=s=>{s=Math.floor(s);return p2(s/3600|0)+':'+p2((s%3600)/60|0)+':'+p2(s%60)};
const hm=s=>{const m=Math.round(s/60);return m>=60?`${m/60|0}時間${m%60}分`:`${m}分`};
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())},tm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
const mat=id=>S.mats.find(m=>m.id==id),sub=id=>S.subs.find(s=>s.id==id);

/* IndexedDB & ストレージ管理 */
function openDB(){
  return new Promise(resolve=>{
    try {
      if(!window.indexedDB){resolve(null);return}
      const req=indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};
      req.onsuccess=e=>resolve(e.target.result);
      req.onerror=()=>resolve(null);
    } catch(e) { resolve(null); }
  });
}
async function initStorage(){
  let legacy=null;
  try{const raw=localStorage.getItem(K);if(raw)legacy=JSON.parse(raw)}catch(e){}
  dbRef=await openDB();
  if(dbRef){
    const saved=await new Promise(res=>{
      try{
        const tx=dbRef.transaction(DB_STORE,'readonly'),rq=tx.objectStore(DB_STORE).get('main');
        rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);
      }catch(e){res(null)}
    });
    if(saved&&Array.isArray(saved.mats)){
      S={...S,...saved};
    }else if(legacy&&Array.isArray(legacy.mats)){
      S={...S,...legacy};
      save();
    }
  }else if(legacy){
    S={...S,...legacy};
  }
  if(S.timer&&S.timer.at)wake();
  render();
}
function save(){
  if(dbRef){
    try{
      const tx=dbRef.transaction(DB_STORE,'readwrite');
      tx.objectStore(DB_STORE).put(S,'main');
    }catch(e){}
  }
  try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
}

/* 画像登録・リサイズ圧縮（長辺600px / JPEG 0.78） */
function pickPhoto(target){

function onPhoto(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{
    URL.revokeObjectURL(url);
    const c=document.createElement('canvas'),maxSide=600,scale=Math.min(1,maxSide/Math.max(img.width,img.height));
    c.width=Math.max(1,Math.round(img.width*scale));

    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const dataUrl=c.toDataURL('image/jpeg',0.78);

function range(){let a,b,bk=[];
if(mode==='week'){a=wk(off);for(let i=0;i<7;i++)bk.push([a.getTime()+i*864e5,a.getTime()+(i+1)*864e5,'月火水木金土日'[i]]);b=new Date(a.getTime()+6048e5);const e=new Date(b-1);return{a:a.getTime(),b:b.getTime(),bk,label:`${a.getMonth()+1}/${a.getDate()}〜${e.getMonth()+1}/${e.getDate()}`}}

for(let i=0;i<dn;i++)bk.push([new Date(a.getFullYear(),a.getMonth(),i+1).getTime(),new Date(a.getFullYear(),a.getMonth(),i+2).getTime(),(i==0||(i+1)%5==0)?i+1:'']);
return{a:a.getTime(),b:b.getTime(),bk,label:`${a.getFullYear()}年${a.getMonth()+1}月`}}
function hours(ls){const h=Array(24).fill(0);ls.filter(l=>!l.nt).forEach(l=>{let c=l.t;const e=l.t+l.sec*1000;while(c<e){const d=new Date(c),n=new Date(c);n.setHours(d.getHours()+1,0,0,0);const k=Math.min(e,n.getTime())-c;h[d.getHours()]+=k/1000;c+=k}});return h}

/* CSV・表インポート */
const GK=[['d','日付',/日付|日|date|day/i],['s','開始時刻',/開始|start/i],['m','教材',/教材|参考書|タイトル|名称|material|title|name/i],['t','時間',/時間|分|duration|time/i],['a','量',/量|ページ|問|amount|page/i],['n','メモ',/メモ|コメント|memo|comment|note/i],['c','科目',/カテゴリ|科目|category|subject/i]];
function csv(t){const d=t.split('\n')[0].includes('\t')?'\t':',',R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const x=t[i];if(q){if(x=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=x}else if(x=='"')q=true;else if(x==d){r.push(c);c=''}else if(x=='\n'||x=='\r'){if(x=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(z=>z.trim()))R.push(r);r=[]}else c+=x}r.push(c);if(r.some(z=>z.trim()))R.push(r);return R}
function pd(d,s){d=(d||'').trim();const m=d.match(/(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})/);if(!m)return null;const k=((s||'')+' '+d).match(/(\d{1,2}):(\d{2})/);return{t:new Date(+m[1],m[2]-1,+m[3],k?+k[1]:12,k?+k[2]:0).getTime(),nt:!k}}
function pdur(v,u){v=(v||'').trim();if(!v)return 0;const m=v.match(/^(\d+):(\d{2})(?::(\d{2}))?$/);if(m)return +m[1]*3600+ +m[2]*60+(m[3]?+m[3]:0);if(/[時分秒]/.test(v)){const h=v.match(/(\d+(?:\.\d+)?)\s*時間/),mi=v.match(/(\d+(?:\.\d+)?)\s*分/),s=v.match(/(\d+(?:\.\d+)?)\s*秒/);return Math.round((h?+h[1]*3600:0)+(mi?+mi[1]*60:0)+(s?+s[1]:0))}return isNaN(+v)?0:Math.round(+v*u)}
function imLoad(text){im.text=text;im.rows=csv(text);im.map={};im.done='';const h=im.rows[0]||[],used=new Set();GK.forEach(([k,,re])=>{const i=h.findIndex((x,j)=>!used.has(j)&&re.test(x));if(i>=0){im.map[k]=i;used.add(i)}});prep();render()}
async function impFile(inp){const f=inp.files[0];if(!f)return;const b=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){t=new TextDecoder('shift_jis').decode(b)}imLoad(t.replace(/^\uFEFF/,''))}
function prep(){const R=im.rows;if(!R||R.length<2){im.out=null;return}const M=im.map,has=k=>M[k]!=null,ok=[];let bad=0;
R.slice(1).forEach(r=>{const dt=pd(has('d')?r[M.d]:'',has('s')?r[M.s]:''),sec=pdur(has('t')?r[M.t]:'',+im.unit);if(!dt||!(sec>0)){bad++;return}ok.push({title:has('m')?(r[M.m]||'').trim():'',t:dt.t,nt:dt.nt,sec,amt:has('a')&&r[M.a]!==''&&r[M.a]!=null&&!isNaN(+r[M.a])?+r[M.a]:null,memo:has('n')?(r[M.n]||'').trim():'',cat:has('c')?(r[M.c]||'').trim():''})});
const ex=new Set(S.logs.map(l=>l.mid+'|'+(l.nt?dk(l.t):l.t)+'|'+l.sec));
im.out=ok.filter(o=>{const m=S.mats.find(x=>x.title==(o.title||'（教材不明）'));return !(m&&ex.has(m.id+'|'+(o.nt?dk(o.t):o.t)+'|'+o.sec))});im.dup=ok.length-im.out.length;im.bad=bad}
function doImport(){if(!im.out||!im.out.length)return;
im.out.forEach((o,i)=>{const title=o.title||'（教材不明）';let m=S.mats.find(x=>x.title==title);if(!m){const cn=o.cat||'取込データ';let sb=S.subs.find(s=>s.name==cn);if(!sb){sb={id:uid(),name:cn,color:COL[S.subs.length%8],icon:'📘'};S.subs.push(sb)}m={id:uid(),sid:sb.id,title,unit:'ページ',cover:''};S.mats.push(m)}
S.logs.push({id:uid()+i,mid:m.id,t:o.t,sec:o.sec,amt:o.amt,to:null,fr:null,focus:0,memo:o.memo,nt:o.nt?1:0})});
if(!S.sel&&S.mats.length)S.sel=S.mats[0].id;const n=im.out.length;im={text:'',rows:null,map:{},unit:'60',out:null,done:n+'件を取り込みました'};save();render()}
function vImp(){const R=im.rows,h=R?R[0]:[];
return `<div class="card"><h2>データ取り込み（CSV・TSV）</h2>${im.done?`<div style="margin-bottom:8px"><b>${im.done}</b></div>`:''}
<button class="g" onclick="$('imf').click()" style="width:100%;margin-bottom:8px">ファイルを選択</button><input id="imf" type="file" accept=".csv,.tsv,.txt,text/*" style="display:none" onchange="impFile(this)">
<textarea placeholder="CSVまたは表データを貼り付け（1行目は見出し）" oninput="im.text=this.value">${esc(im.text)}</textarea>

${R?`<div class="sub" style="margin-bottom:4px">列の割り当て</div>${GK.map(([k,lb])=>`<div class="row" style="align-items:center"><div class="sub" style="flex:none;width:110px">${lb}</div><select onchange="im.map['${k}']=this.value===''?null:+this.value;prep();render()"><option value="">なし</option>${h.map((x,i)=>`<option value="${i}" ${im.map[k]===i?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`).join('')}
<div class="row" style="align-items:center"><div class="sub" style="flex:none;width:110px">時間の単位</div><select onchange="im.unit=this.value;prep();render()">${[['60','分'],['1','秒'],['3600','時間']].map(([v,l])=>`<option value="${v}" ${im.unit==v?'selected':''}>${l}</option>`).join('')}</select></div>
${im.out?`<div style="margin:8px 0">対象 <b>${im.out.length}件</b>${im.dup?`（重複スキップ ${im.dup}件）`:''}${im.bad?`／除外 ${im.bad}件`:''}</div><div class="sub" style="margin-bottom:8px">${im.out.slice(0,3).map(o=>`${dk(o.t)} ${esc(o.title||'（教材不明）')} ${hm(o.sec)}`).join('<br>')}</div><button onclick="doImport()" style="width:100%" ${im.out.length?'':'disabled'}>取り込む</button>`:''}`:''}</div>`}

/* 教材編集・進捗計算 */
function rg(l){if(l.to==null)return null;const b=l.to,a=l.fr!=null?l.fr:(l.amt!=null?b-l.amt+1:b);return[Math.min(a,b),Math.max(a,b)]}
function cov(m){const a0=m.from||1,b0=m.total;if(!b0||b0<a0)return null;const n=b0-a0+1,d=new Array(n+2).fill(0),t14=Date.now()-14*864e5;let amt=0,sec=0,rec=0;
S.logs.forEach(l=>{if(l.mid!=m.id)return;if(l.amt!=null){amt+=l.amt;if(l.amt>0)sec+=l.sec;if(l.t>=t14)rec+=l.amt}const r=rg(l);if(r){const s=Math.max(r[0],a0)-a0,e=Math.min(r[1],b0)-a0;if(e>=s){d[s]++;d[e+1]--}}});
const c=[];let x=0,c1=0,c2=0;for(let i=0;i<n;i++){x+=d[i];c.push(x);if(x>=1)c1++;if(x>=2)c2++}return{n,c,c1,c2,amt,sec,rec,laps:amt/n}}
function pgi(m){const c=cov(m);if(!c)return null;const L=m.laps||1,rem=Math.max(0,c.n*L-c.amt),ls=S.logs.filter(l=>l.mid==m.id),first=ls.length?Math.min(...ls.map(l=>l.t)):Date.now(),span=Math.max(1,Math.min(14,(Date.now()-first)/864e5)),pace=c.rec/span,mpu=c.amt>0?c.sec/c.amt:0,dl=m.dl?Math.ceil((new Date(m.dl+'T23:59:59')-Date.now())/864e5):null;return{...c,L,rem,pace,mpu,dl}}
function pg(m){const c=cov(m);return `<div class="sub">${hm(sm(S.logs.filter(l=>l.mid==m.id)))}${c?' ／ '+Math.round(c.c1/c.n*100)+'%':''}</div>`}
function setM(k,v){const m=mat(pe);if(!m)return;if(k==='title'||k==='unit'||k==='dl')m[k]=v;else if(k==='sid')m.sid=+v;else m[k]=v===''?null:+v;save()}
function vPe(){const m=pe&&mat(pe);if(!m)return '';return `<div class="card"><h2>教材の編集・進捗設定</h2>
<div class="row" style="align-items:flex-start;gap:12px;margin-bottom:8px">

    <input value="${esc(m.title)}" placeholder="教材名" oninput="setM('title',this.value)">
    <select style="margin-bottom:0" onchange="setM('unit',this.value)">${['ページ','問','章','単元','回'].map(u=>`<option ${m.unit==u?'selected':''}>${u}</option>`).join('')}</select>
  </div>
</div>
<div class="row"><div><div class="sub">開始位置</div><input type="number" min="0" value="${m.from??''}" placeholder="1" oninput="setM('from',this.value)"></div><div><div class="sub">終了位置（全体量）</div><input type="number" min="1" value="${m.total??''}" oninput="setM('total',this.value)"></div></div>
<div class="row"><div><div class="sub">目標周回数</div><input type="number" min="1" step="1" value="${m.laps??1}" oninput="setM('laps',this.value)"></div><div><div class="sub">目標期限</div><input type="date" value="${m.dl||''}" oninput="setM('dl',this.value)"></div></div>
<button onclick="pe=null;render()" style="width:100%">完了</button></div>`}

function prog(){const L=S.mats.filter(m=>m.total).map(m=>[m,pgi(m)]).filter(x=>x[1]);
if(!L.length)return `<div class="card"><h2>教材の進捗</h2><div class="sub">「設定」タブの教材一覧で「編集」から全体量や期限を設定すると進捗が表示されます</div></div>`;
return `<div class="card"><h2>教材の進捗</h2>${L.map(([m,p])=>{const nb=Math.min(p.n,40);let st='';for(let k=0;k<nb;k++){const a=Math.floor(k*p.n/nb),b=Math.floor((k+1)*p.n/nb),w=Math.max(1,b-a);let c1=0,c2=0;for(let i=a;i<b;i++){if(p.c[i]>=1)c1++;if(p.c[i]>=2)c2++}const f=c1/w,g=c2/w>=.5;st+=`<i style="background:${f<.05?'var(--bd)':g?'#22a06b':'var(--ac)'};${f>=.05&&!g?'opacity:'+(.35+.65*f):''}"></i>`}
const fin=p.pace>0?new Date(Date.now()+p.rem/p.pace*864e5):null,ok=p.pace*Math.max(0,p.dl)>=p.rem;
return `<div style="margin:12px 0 16px"><div class="row" style="align-items:center;gap:10px">${cover(m)}<div style="flex:1"><div><b>${esc(m.title)}</b> <span class="sub">${m.from||1}〜${m.total}${m.unit}</span></div><div class="st">${st}</div>
<div class="sub">カバー率 <b>${Math.round(p.c1/p.n*100)}%</b>（2周以上 ${Math.round(p.c2/p.n*100)}%）／ ${p.laps.toFixed(1)}周（目標${p.L}周）</div>
<div class="sub">残り ${Math.round(p.rem)}${m.unit}${p.mpu?'（約'+hm(p.rem*p.mpu)+'）':''}${p.pace>0?' ／ '+p.pace.toFixed(1)+m.unit+'/日 → '+(p.rem<=0?'達成済み':'予測 '+(fin.getMonth()+1)+'/'+fin.getDate()):''}</div>
${m.dl&&p.rem>0?`<div class="sub" style="font-weight:600;color:${ok?'#22a06b':'#e5484d'}">期限 ${m.dl.slice(5).replace('-','/')}（残${Math.max(0,p.dl)}日）：1日 ${(p.rem/Math.max(1,p.dl)).toFixed(1)}${m.unit}必要${ok?'（順調）':'（ペース不足）'}</div>`:''}</div></div></div>`}).join('')}</div>`}

function progLines(){const o=S.mats.filter(m=>m.total).map(m=>[m,pgi(m)]).filter(x=>x[1]);if(!o.length)return 'なし（範囲未設定）';return o.map(([m,p])=>`・${m.title}：範囲${m.from||1}〜${m.total}${m.unit}、カバー率${Math.round(p.c1/p.n*100)}%、${p.laps.toFixed(1)}周（目標${p.L}周）、残り${Math.round(p.rem)}${m.unit}${p.pace>0?'、最近'+p.pace.toFixed(1)+m.unit+'/日':''}${m.dl?'、期限'+m.dl:''}`).join('\n')}
function fb(){const t0=Date.now()-60*864e5,B=Array.from({length:8},()=>[]);S.logs.forEach(l=>{if(l.focus&&!l.nt&&l.t>=t0)B[Math.floor(new Date(l.t).getHours()/3)].push(l.focus)});return B}
const av2=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function fLines(){return fb().map((a,i)=>a.length?`${i*3}〜${i*3+3}時:平均${av2(a).toFixed(1)}（${a.length}回）`:'').filter(Boolean).join('、')||'集中度の記録なし'}
function fcard(){const B=fb(),av=B.map(av2);let bi=-1,bv=0;av.forEach((v,i)=>{if(B[i].length>=2&&v>bv){bv=v;bi=i}});
return `<div class="card"><h2>時間帯ごとの集中度（直近60日）</h2>${B.some(a=>a.length)?(bi>=0?`<div><b>高集中時間帯：${bi*3}〜${bi*3+3}時（平均 ${bv.toFixed(1)} / 3）</b></div>`:'')+`<div class="chart">${av.map((v,i)=>`<div><i style="height:${v/3*100}%;${B[i].length<2?'opacity:.3':''}${i==bi?';background:#f59f00':''}"></i><span>${i*3}</span></div>`).join('')}</div>`:'<div class="sub">集中度つきの記録がありません</div>'}</div>`}

function cmp(r,tot){const so=off;off=so-1;const pr=range();off=so;const cut=off===0?Math.min(pr.b,pr.a+(Date.now()-r.a)):pr.b,pv=sm(inR(pr.a,cut));return{pv,pct:pv>0?Math.round((tot-pv)/pv*100):null,lb:mode=='week'?'前週':'前月',live:off===0}}
function cmpHTML(r,tot){const c=cmp(r,tot);if(c.pct==null)return `<div class="sub">${c.lb}の記録なし</div>`;return `<div class="sub" style="font-weight:600;color:${c.pct>=0?'#22a06b':'#e5484d'}">${c.lb}${c.live?'同時点':''}比 ${c.pct>=0?'+':''}${c.pct}%（${hm(c.pv)}）</div>`}
function cmpTxt(r,t){const c=cmp(r,t);return c.pct==null?'':`、${c.lb}${c.live?'同時点':''}比${c.pct>=0?'+':''}${c.pct}%`}
function heat(){const m=dayMap(),n=new Date();n.setHours(0,0,0,0);const st=wk(-14),dg=DG()*60,mn=Math.max(1,MN())*60,tk=dk(n);let h='';
for(let i=0;i<105;i++){const d=new Date(st);d.setDate(st.getDate()+i);const k=dk(d),s=m[k]||0,o=s==0?0:s<mn?.25:s<dg*.6?.5:s<dg?.75:1;
h+=`<i style="${d>n?'visibility:hidden':`background:${o?'var(--ac)':'var(--bd)'};opacity:${o||1}`}${k==tk?';outline:2px solid var(--tx)':''}"></i>`}
return `<div class="card"><h2>学習カレンダー（15週間）</h2><div class="hm">${h}</div></div>`}
function subWeek(){const a=wk(0).getTime(),ls=inR(a,a+6048e5),o=S.subs.filter(s=>s.goal>0);if(!o.length)return '';
return `<div class="card"><h2>科目ごとの週目標</h2>${o.map(s=>{const c=s.color||COL[S.subs.indexOf(s)%8];let sec=sm(ls.filter(l=>{const m=mat(l.mid);return m&&m.sid==s.id}));if(S.timer){const m=mat(S.timer.mid);if(m&&m.sid==s.id)sec+=el()}
return `<div class="lg" style="margin:8px 0 2px"><b style="background:${c}"></b>${s.icon||'📘'} ${esc(s.name)}<em>${hm(sec)} / ${s.goal}時間</em></div><div class="bar" style="margin:0"><i style="width:${Math.min(100,sec/(s.goal*36))}%;background:${c}"></i></div>`}).join('')}</div>`}

function chk(){const dkn=dk(new Date()),wkk=dk(wk(0)),w=weekTotal(),td=todayTotal(),L=[];S.cel=S.cel||{};
if(S.goal&&w>=S.goal*3600&&S.cel.w!==wkk){S.cel.w=wkk;L.push(['🎉','今週の目標を達成！'])}
if(DG()&&td>=DG()*60&&S.cel.d!==dkn){S.cel.d=dkn;L.push(['✨','今日の目標を達成！'])}
const s=streak();if([7,14,30,50,100,200,365].includes(s)&&S.cel.s!==s+'|'+dkn){S.cel.s=s+'|'+dkn;L.push(['🔥',s+'日連続！'])}
if(L.length){save();celebrate(L[0][0],L.map(x=>x[1]).join('<br>'))}}
function celebrate(e,t){const c=$('cel');c.innerHTML=`<div class="cb"><div style="font-size:44px">${e}</div><b>${t}</b></div>`+Array.from({length:16},(_,i)=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*.6}s">${['🎉','✨','⭐','🎊'][i%4]}</i>`).join('');c.style.display='block';clearTimeout(ct);ct=setTimeout(()=>c.style.display='none',3500)}
function del(f){us=JSON.stringify({subs:S.subs,mats:S.mats,logs:S.logs});f();toast('削除しました','元に戻す')}
function toast(m,a){clearTimeout(ut);const t=$('toast');t.innerHTML=`${m}${a?` <button onclick="undo()">${a}</button>`:''}`;t.style.display='flex';ut=setTimeout(()=>t.style.display='none',6000)}
function undo(){if(!us)return;const o=JSON.parse(us);S.subs=o.subs;S.mats=o.mats;S.logs=o.logs;us=null;save();$('toast').style.display='none';render()}
function addSub(){const n=md.ns.trim();if(!n)return;const s={id:uid(),name:n,color:COL[S.subs.length%8],icon:'📘'};S.subs.push(s);md.sid=s.id;md.ns='';save();render()}
function addMat(){if(!md.title.trim()){md.msg='教材名を入力してください';render();return}
if(!md.sid){if(!S.subs.length)S.subs.push({id:uid(),name:'未分類',color:COL[0],icon:'📘'});md.sid=S.subs[0].id}
const nm={id:uid(),sid:+md.sid,title:md.title.trim(),unit:md.unit,cover:md.cover};
S.mats.push(nm);if(!S.sel)S.sel=nm.id;md={sid:md.sid,title:'',unit:md.unit,cover:'',msg:'',ns:''};save();toast('教材を追加しました');render()}
function delMat(id){if(pe==id)pe=null;S.mats=S.mats.filter(m=>m.id!=id);S.logs=S.logs.filter(l=>l.mid!=id);if(S.timer&&S.timer.mid==id){S.timer=null;unwake()}if(S.sel==id)S.sel=S.mats[0]?S.mats[0].id:null;save();render()}

/* ハイブリッドJSONバックアップ（共有シート / ファイルダウンロード自動切替） */
function bkData(){return JSON.stringify({app:'studylog',v:3,exportedAt:new Date().toISOString(),subs:S.subs,mats:S.mats,logs:S.logs,goal:S.goal,dgoal:S.dgoal,minDay:S.minDay,cel:S.cel})}
function exp(){const d=bkData(),t=$('bk');if(t){t.value=d;t.select()}try{navigator.clipboard.writeText(d).then(()=>toast('コピーしました')).catch(()=>document.execCommand('copy'))}catch(e){try{document.execCommand('copy')}catch(_){}}}
async function expFile(){
  const data=bkData(),t=$('bk');if(t)t.value=data;
  const fname='studylog_backup_'+dk(Date.now()).replace(/-/g,'')+'.json';
  const blob=new Blob([data],{type:'application/json'});
  try{
    const file=new File([blob],fname,{type:'application/json'});
    if(location.protocol==='file:'&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:fname});
      return;
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    const a=document.createElement('a'),url=URL.createObjectURL(blob);
    a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){}
}
async function impFile2(inp){const f=inp.files[0];if(!f)return;$('bk').value=await f.text();imp();inp.value=''}
function imp(){
  try{
    const o=JSON.parse($('bk').value);
    if(!Array.isArray(o.logs)||!Array.isArray(o.mats))throw 0;
    unwake();
    S={subs:o.subs||[],mats:o.mats,logs:o.logs,goal:o.goal||10,dgoal:o.dgoal??60,minDay:o.minDay??15,cel:o.cel||{},timer:null,sel:o.mats[0]?o.mats[0].id:null};
    save();toast('バックアップを復元しました');render();
  }catch(e){toast('データの形式が正しくありません')}
}

function render(){const sh=S.timer&&tab!=='home',mi=$('mini');if(sh){const m=mat(S.timer.mid);mi.innerHTML=`<div><b>${m?ico(m)+' '+esc(m.title):''}</b><span id="mclk">${clk(el())}</span></div><button onclick="toggle()">${S.timer.at?'⏸':'▶'}</button><button class="r" onclick="finish()">終了</button>`}mi.style.display=sh?'flex':'none';document.body.style.paddingTop=sh?'78px':'';$('v').innerHTML={home:vHome,log:vLog,stat:vStat,mat:vMat}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));tick()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
initStorage();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
